// ── Progress ──
function computeProgress(updates,schedules,gid){
  const grpUpd=updates[gid]||[],sched=schedules[gid]||{},acc={};
  grpUpd.forEach(u=>{if(!acc[u.floor])acc[u.floor]={};if(!acc[u.floor][u.room])acc[u.floor][u.room]={};const env=u.environment||"Ambiente";acc[u.floor][u.room][env]=(acc[u.floor][u.room][env]||0)+(u.actualPct||0);});
  const fs={};
  FLOORS.forEach(fl=>{
    const sc=sched[fl]||{},rc=sc.roomCount||12;
    let sum=0,done=0;const rooms={};
    for(let r=1;r<=rc;r++){const envs=acc[fl]?.[r]||{};const ek=Object.keys(envs);if(!ek.length){rooms[r]={envs:{},avgPct:0,done:false};continue;}let rs=0;const ed={};ek.forEach(e=>{const p=Math.min(100,envs[e]);ed[e]=p;rs+=p;});const avg=rs/ek.length;rooms[r]={envs:ed,avgPct:Math.round(avg),done:avg>=100};sum+=avg;if(avg>=100)done++;}
    const el=Math.max(0,diffD(sc.startDate||TODAY,TODAY)),td=Math.max(1,diffD(sc.startDate||TODAY,sc.endDate||fmt(addD(new Date(),90))));
    const pp=Math.min(100,(el/td)*100),ap=rc>0?sum/rc:0;
    fs[fl]={roomCount:rc,doneRooms:done,plannedPct:pp,actualPct:ap,variance:ap-pp,rooms,startDate:sc.startDate,endDate:sc.endDate};
  });
  const tot=FLOORS.reduce((a,f)=>{const s=fs[f];a.done+=s.doneRooms;a.total+=s.roomCount;a.sumPct+=s.actualPct;return a;},{done:0,total:0,sumPct:0});
  return{acc,floorStats:fs,totals:tot};
}

function computeChart(updates,schedules,gid,filterFloor){
  const grpUpd=(updates[gid]||[]).filter(u=>!filterFloor||u.floor===filterFloor);
  const sched=schedules[gid]||{};
  const floors=filterFloor?[filterFloor]:FLOORS;

  // Earliest schedule start and latest planned end
  let earliestStart=TODAY, latestEnd=fmt(addD(new Date(),90));
  let hasSchedule=false;
  floors.forEach(fl=>{
    const sc=sched[fl];
    if(!sc?.startDate||!sc?.endDate)return;
    hasSchedule=true;
    if(sc.startDate<earliestStart)earliestStart=sc.startDate;
    if(sc.endDate>latestEnd)latestEnd=sc.endDate;
  });
  if(!hasSchedule){earliestStart=TODAY;latestEnd=fmt(addD(new Date(),90));}

  // Progress calculation — use only environments with updates
  const todayAcc={};
  grpUpd.filter(u=>u.date<=TODAY).forEach(u=>{
    const k=`${u.floor}_${u.room}_${u.environment||"A"}`;
    todayAcc[k]=(todayAcc[k]||0)+(u.actualPct||0);
  });
  const todayVals=Object.values(todayAcc).map(v=>Math.min(100,v));
  const sumActual=todayVals.reduce((a,b)=>a+b,0);

  // Total units in project scope (all floors with schedule)
  let totalUnitsScope=0;
  floors.forEach(fl=>{const sc=sched[fl];if(sc?.startDate)totalUnitsScope+=sc.roomCount||12;});
  if(totalUnitsScope===0)totalUnitsScope=floors.length*12;

  // Project % complete = sum of all unit progress / total possible
  const currentActual=sumActual/totalUnitsScope;
  const currentActualOverall=currentActual;

  // Rate: average daily progress over ACTUAL work days only
  const workDates=[...new Set(grpUpd.map(u=>u.date))].sort();
  const workDays=Math.max(1,workDates.length);
  // Use daily increment: how many % per work day on average
  const ratePerDay=sumActual/(workDays*totalUnitsScope);

  // Project trend end date: when does trend reach 100%?
  let projectedEndDate=latestEnd;
  if(ratePerDay>0){
    const daysToFinish=Math.ceil((100-currentActual)/ratePerDay);
    projectedEndDate=fmt(addD(new Date(),daysToFinish));
  }
  const delayDays=Math.max(0,diffD(latestEnd,projectedEndDate));

  // Chart window: from schedule start to max(plannedEnd, projectedEnd) + 10 days buffer
  const chartStart=earliestStart;
  const chartEnd=fmt(addD(new Date(projectedEndDate>latestEnd?projectedEndDate:latestEnd),10));
  const totalDays=Math.max(2,diffD(chartStart,chartEnd));

  const data=[];
  for(let i=0;i<=totalDays;i++){
    const date=fmt(addD(new Date(chartStart),i));
    const isPast=date<=TODAY;

    // Planned: linear progress across all floors with schedules
    let planned=0,activeFloors=0;
    floors.forEach(fl=>{
      const sc=sched[fl];
      if(!sc?.startDate||!sc?.endDate)return;
      activeFloors++;
      if(date<sc.startDate)return;
      if(date>=sc.endDate){planned+=100;return;}
      const el=Math.max(0,diffD(sc.startDate,date));
      const td=Math.max(1,diffD(sc.startDate,sc.endDate));
      planned+=Math.min(100,(el/td)*100);
    });
    // DD/MM format for x-axis labels
    const dd=date.slice(8),mm=date.slice(5,7);
    const entry={date:dd+"/"+mm,fullDate:date,planned:Math.round(activeFloors>0?planned/activeFloors:0)};

    // Actual: cumulative
    if(isPast){
      const acc={};
      grpUpd.filter(u=>u.date<=date).forEach(u=>{
        const k=`${u.floor}_${u.room}_${u.environment||"A"}`;
        acc[k]=(acc[k]||0)+(u.actualPct||0);
      });
      const vals=Object.values(acc).map(v=>Math.min(100,v));
      let tu=0;floors.forEach(fl=>{const sc=sched[fl];if(sc?.startDate&&date>=sc.startDate)tu+=sc.roomCount||12;});
      entry.actual=tu>0?Math.round(vals.reduce((a,b)=>a+b,0)/tu):(vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0);
    }

    // Trend: project at current rate from today's actual, capped at 100
    if(!isPast&&ratePerDay>0){
      const daysAhead=diffD(TODAY,date);
      entry.trend=Math.min(100,Math.round(currentActual+ratePerDay*daysAhead));
    }

    data.push(entry);
  }

  // Attach metadata to array
  data._meta={plannedEndDate:latestEnd,projectedEndDate,delayDays,currentActual:Math.round(currentActual),ratePerDay:ratePerDay.toFixed(2)};
  return data;
}

function getUT(grpUpd,floor,room,env,dpu){
  const base=Math.round(100/Math.max(1,dpu));
  const ud=grpUpd.filter(u=>u.floor===floor&&String(u.room)===String(room)&&(u.environment||"Ambiente")===env);
  const tp=ud.reduce((s,u)=>s+(u.targetPct||0),0),ta=ud.reduce((s,u)=>s+(u.actualPct||0),0);
  const acc=Math.min(100,ta),rem=100-acc;
  if(rem<=0)return{target:0,accumulated:100,remaining:0,carryover:0,done:true};
  const co=Math.max(0,tp-ta);
  return{target:Math.min(rem,Math.round(base+co)),accumulated:Math.round(acc),remaining:Math.round(rem),carryover:Math.round(co),done:false};
}

function getFloorTeams(companies,floor){return(companies||[]).flatMap(co=>co.teams.filter(t=>(t.assignedFloors||[]).includes(floor)).map(t=>({...t,coName:co.name,coColor:co.color})));}

// Delivery date for room at index on a floor
function getDeliveryDate(startDate,roomIndex,dpu){
  if(!startDate)return null;
  return fmt(addD(new Date(startDate),(roomIndex+1)*Math.max(1,dpu)));
}

// Today's scheduled deliveries for a group
function getTodayDeliveries(grp,updates,schedules,date){
  const sched=schedules[grp.id]||{},grpUpd=updates[grp.id]||[];
  const deliveries=[];
  (grp.companies||[]).forEach(co=>co.teams.forEach(t=>(t.assignedFloors||[]).forEach(fl=>{
    const sc=sched[fl];if(!sc?.startDate)return;
    const rooms=parseRooms(sc);
    rooms.forEach((room,idx)=>{
      const dd=getDeliveryDate(sc.startDate,idx,t.dpu||3);
      if(dd===date){
        const already=grpUpd.find(u=>u.floor===fl&&u.room===room&&u.entregaDia&&u.date===date);
        if(!already)deliveries.push({floor:fl,room,teamId:t.id,coName:co.name,teamName:t.name,envName:grp.envName||"Ambiente",dd});
      }
    });
  })));
  return deliveries;
}

// Upcoming deliveries (next N days)
function getUpcomingDeliveries(grp,updates,schedules,days){
  const sched=schedules[grp.id]||{},grpUpd=updates[grp.id]||[];
  const upcoming=[];
  for(let d=0;d<=days;d++){
    const date=fmt(addD(new Date(),d));
    const dels=getTodayDeliveries(grp,updates,schedules,date);
    dels.forEach(dl=>upcoming.push({...dl,daysUntil:d,date}));
  }
  return upcoming.slice(0,10);
}

// Check if group has accumulated delay
function hasAccumulatedDelay(grp,updates){
  const grpUpd=updates[grp.id]||[];
  return grpUpd.some(u=>u.efeitoImpacto===true)||grpUpd.some(u=>u.entregaDia&&!u.entregue);
}

// Get efetivo previsto for a team
function getEfetivoPrevisto(companies,teamId){
  for(const co of(companies||[])){for(const t of co.teams){if(t.id===teamId)return t.people||1;}}
  return 1;
}

// ══════════ GROUP UPDATE ══════════
function GroupUpdate({grp,updates,onPushUpdate,schedules,showToast}){
  const companies=grp.companies||[];
  const grpUpd=updates[grp.id]||[];
  const allTeams=companies.flatMap(co=>co.teams.map(t=>({...t,coName:co.name,coColor:co.color})));
  const [date,setDate]=useState(TODAY);
  const [teamId,setTeamId]=useState(allTeams[0]?.id||"");
  const [step,setStep]=useState("efetivo"); // efetivo | impacto | recuperacao | entrega | pendencias | done
  const [efeivoReal,setEfeivoReal]=useState(null);
  const [efeitoImpacto,setEfeitoImpacto]=useState(null);
  const [recuperacao,setRecuperacao]=useState(null);
  const [deliveries,setDeliveries]=useState([]);
  const [delIdx,setDelIdx]=useState(0);
  const [entregue,setEntregue]=useState(null);
  const [pendencias,setPendencias]=useState("");
  const [motivo,setMotivo]=useState("");
  const [savedSteps,setSavedSteps]=useState([]);

  const selTeam=allTeams.find(t=>t.id===teamId)||allTeams[0];
  const previsto=selTeam?.people||1;
  const hasPendingDelay=hasAccumulatedDelay(grp,updates);
  const todayDels=getTodayDeliveries(grp,updates,schedules,date);
  const upcoming=getUpcomingDeliveries(grp,updates,schedules,5);

  const reset=()=>{setStep("efetivo");setEfeivoReal(null);setEfeitoImpacto(null);setRecuperacao(null);setDeliveries([]);setDelIdx(0);setEntregue(null);setPendencias("");setMotivo("");setSavedSteps([]);};

  const saveAndNext=async(extraData)=>{
    const base={id:`u${Date.now()}`,date,teamId:teamId||allTeams[0]?.id||"",ts:Date.now(),...extraData};
    await onPushUpdate(grp.id,base);
    setSavedSteps(p=>[...p,base]);
  };

  const handleEfetivo=async(real)=>{
    setEfeivoReal(real);
    if(real<previsto){setStep("impacto");}
    else{
      await saveAndNext({tipo:"efetivo",efetivoPrevisto:previsto,efeivoReal:real,efeitoImpacto:false});
      hasPendingDelay?setStep("recuperacao"):todayDels.length>0?(setDeliveries(todayDels),setStep("entrega")):setStep("done");
    }
  };

  const handleImpacto=async(imp)=>{
    setEfeitoImpacto(imp);
    await saveAndNext({tipo:"efetivo",efetivoPrevisto:previsto,efeivoReal,efeitoImpacto:imp});
    hasPendingDelay?setStep("recuperacao"):todayDels.length>0?(setDeliveries(todayDels),setStep("entrega")):setStep("done");
  };

  const handleRecuperacao=async(rec)=>{
    setRecuperacao(rec);
    await saveAndNext({tipo:"recuperacao",recuperacao:rec});
    todayDels.length>0?(setDeliveries(todayDels),setStep("entrega")):setStep("done");
  };

  const handleEntrega=async(ent)=>{
    setEntregue(ent);
    if(ent)setStep("pendencias");
    else setStep("motivo");
  };

  const handlePendencias=async()=>{
    const dl=deliveries[delIdx];
    await saveAndNext({tipo:"entrega",floor:dl.floor,room:dl.room,entregaDia:true,entregue:true,pendencias});
    nextDelivery();
  };

  const handleMotivo=async()=>{
    if(!motivo)return;
    const dl=deliveries[delIdx];
    await saveAndNext({tipo:"entrega",floor:dl.floor,room:dl.room,entregaDia:true,entregue:false,motivo});
    nextDelivery();
  };

  const nextDelivery=()=>{
    if(delIdx+1<deliveries.length){setDelIdx(p=>p+1);setEntregue(null);setPendencias("");setMotivo("");setStep("entrega");}
    else setStep("done");
  };

  const stepN={"efetivo":1,"impacto":2,"recuperacao":hasPendingDelay?2:null,"entrega":hasPendingDelay?3:2,"pendencias":hasPendingDelay?4:3,"motivo":hasPendingDelay?4:3,"done":hasPendingDelay?5:4};
  const totalSteps=hasPendingDelay?(todayDels.length>0?5:3):(todayDels.length>0?4:2);

  const stepLabel={"efetivo":"Efetivo","impacto":"Impacto","recuperacao":"Recuperação","entrega":"Entrega","pendencias":"Pendências","motivo":"Motivo","done":"Concluído"};
  const pct=Math.round(((stepN[step]||1)-1)/totalSteps*100);

  const BIG_BTN=(label,onClick,color,bg)=>ce("button",{onClick,style:{flex:1,padding:"14px 8px",borderRadius:12,border:`2px solid ${color}`,background:bg||"#fff",color,fontSize:13,fontWeight:700,cursor:"pointer",transition:"all .15s"}},label);

  return ce("div",{style:{maxWidth:620,margin:"0 auto"}},
    // Header
    ce("div",{style:{...S.card,marginBottom:16}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
        ce("div",{style:{fontSize:16,fontWeight:700,color:"#16181D"}},"Atualização Diária"),
        step!=="done"&&ce("button",{onClick:reset,style:{...S.btnS,fontSize:11,padding:"4px 10px"}},"Reiniciar")
      ),
      ce("div",{style:{...S.g2}},
        ce("div",null,ce("label",{style:S.lbl},"Data"),ce("input",{style:S.inp,type:"date",value:date,onChange:e=>setDate(e.target.value)})),
        allTeams.length>0?ce("div",null,ce("label",{style:S.lbl},"Equipe"),ce("select",{style:S.inp,value:teamId||allTeams[0]?.id,onChange:e=>setTeamId(e.target.value)},allTeams.map(t=>ce("option",{key:t.id,value:t.id},t.coName+" · "+t.name)))):
        ce("div",null,ce("div",{style:{padding:"10px 12px",background:"#FEF9E8",borderRadius:8,fontSize:11,color:"#B8895A"}},"Cadastre equipes primeiro"))
      ),
      // Progress bar
      step!=="done"&&ce("div",{style:{marginTop:12}},
        ce("div",{style:{display:"flex",justifyContent:"space-between",fontSize:10,color:"#94A3B8",marginBottom:4}},
          ce("span",null,stepLabel[step]),
          ce("span",null,"Passo "+(stepN[step]||1)+" de "+totalSteps)
        ),
        ce("div",{style:{background:"#E8ECF4",borderRadius:6,height:5}},
          ce("div",{style:{width:pct+"%",background:grp.color||"#6366F1",height:5,borderRadius:6,transition:"width .4s ease"}})
        )
      )
    ),

    // ── STEP: EFETIVO ──
    step==="efetivo"&&ce("div",{style:S.card},
      ce("div",{style:{textAlign:"center",marginBottom:20}},
        ce("div",{style:{fontSize:13,color:"#64748B",marginBottom:4}}),"Equipe "+(selTeam?.coName||"")+" · "+(selTeam?.name||""),
        ce("div",{style:{fontSize:24,fontWeight:700,color:"#16181D",marginBottom:2}},"Quantas pessoas vieram hoje?"),
        ce("div",{style:{fontSize:13,color:"#94A3B8"}},"Previsto: ",ce("b",{style:{color:"#16181D"}},previsto)," pessoas")
      ),
      ce("div",{style:{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center",marginBottom:8}},
        Array.from({length:Math.max(previsto+2,6)},(_,i)=>i+1).map(n=>
          ce("button",{key:n,onClick:()=>handleEfetivo(n),style:{
            width:56,height:56,borderRadius:14,border:`2px solid ${n===previsto?"#3B82F6":n<previsto?"#F87171":"#E2E8F0"}`,
            background:n===previsto?"#EFF6FF":n<previsto?"#FEF2F2":"#fff",
            color:n===previsto?"#1D4ED8":n<previsto?"#DC2626":"#374151",
            fontSize:22,fontWeight:700,cursor:"pointer"
          }},n)
        )
      ),
      ce("p",{style:{textAlign:"center",fontSize:11,color:"#94A3B8"}}),"Azul = previsto · Vermelho = abaixo"
    ),

    // ── STEP: IMPACTO ──
    step==="impacto"&&ce("div",{style:{...S.card,border:"1.5px solid #FCA5A5"}},
      ce("div",{style:{textAlign:"center",marginBottom:24}},
        ce("div",{style:{fontSize:36,marginBottom:8}},"⚠️"),
        ce("div",{style:{fontSize:20,fontWeight:700,color:"#16181D",marginBottom:6}}),(previsto-efeivoReal)+" pessoa(s) faltaram",
        ce("div",{style:{fontSize:14,color:"#64748B"}},"O avanço da obra foi impactado hoje?")
      ),
      ce("div",{style:{display:"flex",gap:12}},
        BIG_BTN("✓  Não impactou","#2D8A5F","#F0FAF5"),

            ce("div",null,ce("label",{style:S.lbl},"Termino"),ce("input",{style:S.inp,type:"date",value:s.endDate||"",onChange:e=>upd(fl,"endDate",e.target.value)})),

  const save=async()=>{setSaving(true);await onSave();setSaving(false);showToast("Equipes salvas!");};

      ce("p",{style:{...S.h3,color:"#7AAE90"}},"Nova Empresa"),
      ce("div",{style:{display:"flex",gap:10,alignItems:"flex-end"}},
        ce("div",{style:{flex:1}},ce("label",{style:S.lbl},"Nome"),ce("input",{style:S.inp,placeholder:"Nome da empresa",value:newCo.name,onChange:e=>setNewCo(p=>({...p,name:e.target.value}))})),

        ce("button",{style:S.btnP,onClick:addCo},"Adicionar"),

// ══════════ GROUP PRODUCAO ══════════
function GroupProducao({grp,updates,schedules,companies}){
  const [filterCo,setFilterCo]=useState("");
  const sched=schedules[grp.id]||{},grpUpd=updates[grp.id]||[];
  const progress=useMemo(()=>computeProgress(updates,schedules,grp.id),[updates,schedules,grp.id]);

  const allCos=(grp.companies||[]);
  const filteredCos=filterCo?allCos.filter(c=>c.id===filterCo):allCos;
  const allTeams=filteredCos.flatMap(co=>co.teams.map(t=>({...t,coName:co.name,coColor:co.color})));

  // Today's efetivo per team
  const todayEfetivo={};
  grpUpd.filter(u=>u.date===TODAY&&u.tipo==="efetivo").forEach(u=>{todayEfetivo[u.teamId]={real:u.efeivoReal,previsto:u.efetivoPrevisto};});

  return ce("div",null,
    ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
      ce("div",null,
        ce("div",{style:{fontSize:16,fontWeight:700,color:"#16181D"}}),"Visão de Produção — "+grp.name,
        ce("p",{style:{fontSize:12,color:"#94A3B8",marginTop:3}}),"Efetivo diário e avanço por andar"
      ),
      ce("div",{style:{display:"flex",gap:8}},
        ce("button",{onClick:()=>setFilterCo(""),style:{...filterCo===""?S.btnP:S.btnS,fontSize:11,padding:"5px 12px"}}),"Todos",
        allCos.map(co=>ce("button",{key:co.id,onClick:()=>setFilterCo(filterCo===co.id?"":co.id),style:{padding:"5px 12px",borderRadius:8,border:"none",fontSize:11,fontWeight:600,background:filterCo===co.id?co.color:"#F1F5F9",color:filterCo===co.id?"#fff":"#64748B",cursor:"pointer"}}),co.name)
      )
    ),
    // Stacking table
    ce("div",{style:{...S.card,padding:0,overflow:"hidden"}},
      // Header
      ce("div",{style:{display:"grid",gridTemplateColumns:"56px 1fr "+allTeams.map(()=>"110px").join(" "),background:"#F8FAFC",borderBottom:"1px solid #E2E8F0",padding:"10px 16px",gap:12,alignItems:"center"}},
        ce("div",{style:{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"1px"}},"Andar"),
        ce("div",{style:{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"1px"}},"Avanço"),
        allTeams.map(t=>ce("div",{key:t.id,style:{fontSize:10,fontWeight:700,color:"#94A3B8",textTransform:"uppercase",letterSpacing:"1px",textAlign:"center"}},
          ce("div",{style:{color:t.coColor,marginBottom:2}},t.coName),
          t.name+" ("+t.dpu+"d/amb)"
        ))
      ),
      FLOORS.map((fl,fi)=>{
        const s=progress.floorStats[fl];
        const st=getStatus(s.actualPct,s.plannedPct,s.doneRooms>=s.roomCount&&s.roomCount>0);
        const isEven=fi%2===0;
        return ce("div",{key:fl,style:{display:"grid",gridTemplateColumns:"56px 1fr "+allTeams.map(()=>"110px").join(" "),background:isEven?"#fff":"#FAFBFD",borderBottom:"1px solid #F1F5F9",padding:"12px 16px",gap:12,alignItems:"center"}},
          // Floor number
          ce("div",{style:{fontWeight:700,fontSize:15,color:"#16181D"}},fl+"°"),
          // Progress bar
          ce("div",null,
            ce("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
              ce("span",{style:{fontSize:11,fontWeight:600,color:"#374151"}}),s.actualPct.toFixed(0)+"%",
              ce("span",{style:{...S.badge(st.color),fontSize:9}},st.label)
            ),
            ce("div",{style:{background:"#E8ECF4",borderRadius:4,height:6}},
              ce("div",{style:{width:Math.min(100,s.actualPct)+"%",background:st.color,height:6,borderRadius:4,transition:"width .6s ease"}})
            ),
            ce("div",{style:{fontSize:10,color:"#94A3B8",marginTop:2}}),s.doneRooms+"/"+s.roomCount+" "+grp.envName+"s"
          ),
          // Efetivo per team
          allTeams.map(t=>{
            if(!(t.assignedFloors||[]).includes(fl))return ce("div",{key:t.id,style:{textAlign:"center",color:"#CBD5E1",fontSize:12}}),"──";
            const ef=todayEfetivo[t.id];
            const previsto=t.people||1;
            const real=ef?.real;

// ══════════ GROUP ANALYSIS ══════════
function GroupAnalysis({grp,schedules,updates,aiInsights,isLoadingAI,onRunAI}){
  const companies=grp.companies||[];
  const insight=typeof aiInsights[grp.id]==="string"?aiInsights[grp.id]:"";
  const grpUpd=updates[grp.id]||[];
  const causeStats={};grpUpd.filter(u=>!u.hitTarget&&u.cause).forEach(u=>{causeStats[u.cause]=(causeStats[u.cause]||0)+1;});
  const topCauses=Object.entries(causeStats).sort((a,b)=>b[1]-a[1]);
  const totalGap=grpUpd.filter(u=>!u.hitTarget).reduce((s,u)=>s+((u.targetPct||0)-(u.actualPct||0)),0);
  const progress=useMemo(()=>computeProgress(updates,schedules,grp.id),[updates,schedules,grp.id]);
  const [ff,setFf]=useState("");const [ft,setFt]=useState("");
  const allTeams=companies.flatMap(co=>co.teams.map(t=>({...t,coName:co.name,coColor:co.color})));
  const filteredUpd=grpUpd.filter(u=>(!ff||u.floor===+ff)&&(!ft||u.teamId===ft)&&!u.hitTarget);
  return ce("div",null,
    ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},

      ce("div",{style:S.card},ce("p",{style:S.h2},"Atraso Acumulado"),ce("div",{style:{fontSize:28,fontWeight:700,color:"#C48282",marginBottom:4}},totalGap+"%"),ce("div",{style:{fontSize:11,color:"#9BA3B8"}},grpUpd.filter(u=>!u.hitTarget).length+" dias")),
      ce("div",{style:S.card},ce("p",{style:S.h2},"Quartos Completos"),ce("div",{style:{fontSize:28,fontWeight:700,color:"#7AAE90",marginBottom:4}},progress.totals.done+"/"+progress.totals.total),ce("div",{style:{fontSize:11,color:"#9BA3B8"}},grp.name)),
      ce("div",{style:S.card},ce("p",{style:S.h2},"Top Causas"),topCauses.slice(0,3).map(([c,n])=>ce("div",{key:c,style:{fontSize:11,color:"#5A6070",marginBottom:4,display:"flex",justifyContent:"space-between"}},ce("span",null,c),ce("span",{style:{fontWeight:700,color:"#C4A882"}},n+"x"))),topCauses.length===0&&ce("span",{style:{color:"#7AAE90",fontSize:11}},"Nenhum atraso"))
    ),
    ce("div",{style:{...S.card,marginBottom:14}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
        ce("p",{style:{...S.h2,margin:0}},"Registros com Atraso"),
        ce("div",{style:{display:"flex",gap:8}},
          ce("select",{style:{...S.inp,width:"auto",fontSize:11},value:ff,onChange:e=>setFf(e.target.value)},ce("option",{value:""},"Todos os andares"),FLOORS.map(f=>ce("option",{key:f,value:f},f+"° Pavimento"))),
          ce("select",{style:{...S.inp,width:"auto",fontSize:11},value:ft,onChange:e=>setFt(e.target.value)},ce("option",{value:""},"Todas as equipes"),allTeams.map(t=>ce("option",{key:t.id,value:t.id},t.coName+" - "+t.name)))
        )
      ),
      filteredUpd.length===0?ce("div",{style:{padding:"16px 0",textAlign:"center",color:"#9BA3B8",fontSize:12}},"Nenhum atraso com esses filtros"):
      filteredUpd.slice(0,20).map(u=>{const co=companies.find(c=>c.teams.some(t=>t.id===u.teamId));const gap=(u.targetPct||0)-(u.actualPct||0);
        return ce("div",{key:u.id||u.ts,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#FAFBFD",borderRadius:8,border:"1px solid #EDEBE6",fontSize:11,marginBottom:6}},
          ce("div",null,ce("div",{style:{fontWeight:700,color:"#1A1D23"}},u.date+" - "+u.floor+"° Q"+u.room+" - "+(u.environment||"—")),ce("div",{style:{color:"#7A8090",marginTop:2}},u.cause||"Sem causa")),
          ce("div",{style:{display:"flex",gap:8,alignItems:"center"}},co&&ce("span",{style:S.badge(co.color)},co.name),ce("span",{style:{fontWeight:700,color:"#C48282"}},"-"+gap+"%"))
        );
      })
    ),

      ce("div",{style:{padding:"30px 0",textAlign:"center"}},ce("div",{style:{fontSize:13,color:"#9BA3B8",marginBottom:14}},"Clique para gerar recomendacoes executivas"),ce("button",{style:S.btnP,onClick:()=>onRunAI(grp.id)},"Gerar Analise"))
    )

// ══════════ MAIN APP ══════════
function App(){

  const [connected,setConnected]=useState(false);
  const [toast,setToast]=useState(null);

  useEffect(()=>{
    REF.on("value",snap=>{
      const d=snap.val();
      if(!d){const init={groups:IG,schedules:{},updates:{},aiInsights:{}};IG.forEach(g=>{init.schedules[g.id]=gS();});REF.set(init);}
      else{
        if(d.groups){const gs=Array.isArray(d.groups)?d.groups:Object.values(d.groups);setGroups(gs.map(g=>({...g,companies:Array.isArray(g.companies)?g.companies:Object.values(g.companies||{})})));}

        if(d.aiInsights){const ai={};Object.entries(d.aiInsights).forEach(([gid,val])=>{ai[gid]=typeof val==="string"?val:"";});setAiInsights(ai);}
      }
      setConnected(true);
      const sp=document.getElementById("splash");if(sp){sp.classList.add("hide");setTimeout(()=>sp.remove(),500);}
    },()=>setConnected(false));
    return()=>REF.off();

  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);},[]);
  const saveAll=useCallback(async()=>{await Promise.all([REF.child("groups").set(groups),REF.child("schedules").set(schedules)]);},[groups,schedules]);

  return ce("div",{style:{display:"flex",height:"100vh",overflow:"hidden",fontFamily:"'Outfit',system-ui,sans-serif",background:"#F0F2F7"}},
    // Sidebar

        ce("div",{style:{fontSize:10,color:"#A0A8BE",marginTop:5,display:"flex",alignItems:"center",gap:5}},
          ce("span",{style:{width:5,height:5,borderRadius:"50%",background:connected?"#3A9068":"#C48282",display:"inline-block"}}),
          connected?"Online":"Sem conexão"
        )

            ce("div",{style:{flex:1,overflow:"auto"}},
        ce("div",{style:{padding:"10px 0 4px"}},

              ce("button",{className:"icon-btn",title:"Remover grupo",onClick:e=>{e.stopPropagation();remGroup(g.id);},dangerouslySetInnerHTML:{__html:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>'}})
            );
          }),
          ce("div",{style:{padding:"6px 16px 8px"}},ce("button",{onClick:addGroup,style:S.btnAdd},"+ Novo Grupo"))
        )
      ),
      ce("div",{style:{padding:"12px 14px 16px",borderTop:"1px solid #F0F2F8"}},
        ce("button",{onClick:refresh,style:{width:"100%",padding:"9px 14px",borderRadius:10,border:"1.5px solid #ECEEF6",background:"#FAFBFD",fontSize:12,fontWeight:500,color:"#7A8094",display:"flex",alignItems:"center",gap:7,justifyContent:"center",cursor:"pointer"}},"↻  Atualizar dados"),

      selectedGroup&&curGrp?ce("div",null,
        ce("div",{style:{marginBottom:18}},
          ce("button",{onClick:()=>setSelectedGroup(null),style:{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,border:"1px solid #EDEBE6",background:"#fff",fontSize:12,fontWeight:600,color:"#5A6070",marginBottom:12}},"← Todos os grupos"),
          ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
            ce("div",{style:{display:"flex",alignItems:"center",gap:10}},
              ce("input",{type:"color",value:curGrp.color,onChange:e=>updGroupField(curGrp.id,"color",e.target.value),style:{width:24,height:24,borderRadius:5,border:"1px solid #E8E5DF",cursor:"pointer",padding:1,flexShrink:0}}),
              ce("input",{value:curGrp.name,onChange:e=>updGroupField(curGrp.id,"name",e.target.value),style:{fontSize:20,fontWeight:700,color:"#1A1D23",border:"none",background:"transparent",outline:"none",fontFamily:"inherit",padding:"2px 4px",borderRadius:4}})
            ),
            ce("div",{style:{display:"flex",gap:8,alignItems:"center"}},
              ce("span",{style:{fontSize:10,color:"#9BA3B8"}},"Tipo de ambiente:"),
              ce("input",{value:curGrp.envName,onChange:e=>updGroupField(curGrp.id,"envName",e.target.value),style:{...S.inp,width:130,padding:"5px 8px",fontSize:11},placeholder:"Banheiro, Quarto..."}),

    )

}

try{ReactDOM.createRoot(document.getElementById("root")).render(ce(App));}catch(err){document.getElementById("root").innerHTML='<div style="padding:40px;font-family:monospace;color:red;background:#fff"><h3>Erro React:</h3><pre>'+err.message+'\n\n'+err.stack+'</pre></div>';document.getElementById("splash")?.remove();}
</script>
