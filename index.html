function LineChart({data,color,h}){
  const H=h||260;
  if(!data||data.length<2)return ce("div",{style:{height:H,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#B0B8D0",gap:10}},
    ce("div",{style:{fontSize:28}},"📈"),
    ce("div",{style:{fontSize:13,fontWeight:500}},"Registre avanços para ver o gráfico")
  );
  const meta=data._meta||{};
  const W=860,CH=H-50,pL=44,pR=24,pT=14,pB=28,cW=W-pL-pR,cH=CH-pT-pB;
  const allV=data.flatMap(d=>[d.planned,d.actual,d.trend].filter(v=>v!==undefined));
  const maxV=Math.max(...allV,1);
  const xp=i=>pL+(i/(data.length-1))*cW;
  const yp=v=>pT+cH-(v/maxV)*cH;

  // Smooth bezier curve through points
  const smoothLine=(pts)=>{
    if(pts.length===0)return null;
    if(pts.length===1)return `M ${xp(pts[0].i).toFixed(1)} ${yp(pts[0].v).toFixed(1)}`;
    let d=`M ${xp(pts[0].i).toFixed(1)} ${yp(pts[0].v).toFixed(1)}`;
    for(let j=1;j<pts.length;j++){
      const p=pts[j-1],c=pts[j];
      const mx=((xp(p.i)+xp(c.i))/2).toFixed(1);
      d+=` C ${mx} ${yp(p.v).toFixed(1)}, ${mx} ${yp(c.v).toFixed(1)}, ${xp(c.i).toFixed(1)} ${yp(c.v).toFixed(1)}`;
    }
    return d;
  };

  const mkLine=(key,pts,stroke,dash,sw)=>{
    if(!pts||pts.length===0)return null;
    const d=smoothLine(pts);
    if(pts.length===1){const x=xp(pts[0].i),y=yp(pts[0].v);return ce("circle",{key,cx:x.toFixed(1),cy:y.toFixed(1),r:5,fill:stroke});}
    return ce("path",{key,d,stroke,strokeWidth:sw||2,fill:"none",strokeDasharray:dash||"none",strokeLinecap:"round",strokeLinejoin:"round"});
  };

  const actualPts=data.map((d,i)=>({v:d.actual,i})).filter(p=>p.v!==undefined);
  const plannedPts=data.map((d,i)=>({v:d.planned,i})).filter(p=>p.v!==undefined);
  const trendPts=data.map((d,i)=>({v:d.trend,i})).filter(p=>p.v!==undefined);

  // Area fill under actual line

    const linePath=smoothLine(actualPts);
    const last=actualPts[actualPts.length-1],first=actualPts[0];

  const todayI=data.findLastIndex(d=>d.actual!==undefined);

    ),

      // Defs: gradient for area fill
      ce("defs",null,
        ce("linearGradient",{id:"areaGrad_"+( color||"def").replace(/[^a-z0-9]/gi,""),x1:"0",y1:"0",x2:"0",y2:"1"},

          ce("stop",{offset:"100%",stopColor:accentColor,stopOpacity:"0"})
        )
      ),
      // Light horizontal grid lines
      [0,0.25,0.5,0.75,1].map((p,i)=>
        ce("line",{key:"g"+i,x1:pL,x2:W-pR,y1:(pT+cH*(1-p)).toFixed(1),y2:(pT+cH*(1-p)).toFixed(1),stroke:i===0?"#ECEEF6":"#F2F4F9",strokeWidth:1})
      ),
      // Y axis labels
      [0,25,50,75,100].filter(v=>v<=maxV+5).map((v,i)=>
        ce("text",{key:"y"+i,x:pL-6,y:yp(v)+4,textAnchor:"end",fontSize:10,fill:"#B0B8D0",fontFamily:"system-ui"},v+"%")
      ),
      // Area fill under actual
      areaPath&&ce("path",{key:"area",d:areaPath,fill:`url(#areaGrad_${(color||"def").replace(/[^a-z0-9]/gi,"")})`}),
      // Planned line - thin dashed gray
      mkLine("planned",plannedPts,"#D0D5E8","8,5",1.5),
      // Trend line - amber dashed
      mkLine("trend",trendPts,"#E8A048","5,4",2),
      // Actual line - solid, group color, bold
      mkLine("actual",actualPts,accentColor,null,3),
      // Delay shaded region
      hasDelay&&plannedEndI>=0&&trendEndI>=0&&ce("rect",{key:"dr",x:xp(plannedEndI),y:pT,width:Math.max(0,xp(trendEndI)-xp(plannedEndI)),height:cH,fill:"#C48282",opacity:.06}),
      // Today marker
      todayI>=0&&ce("line",{key:"td",x1:xp(todayI),x2:xp(todayI),y1:pT,y2:pT+cH,stroke:"#E0A0A0",strokeWidth:1.5,strokeDasharray:"5,4"}),
      todayI>=0&&ce("text",{key:"tdl",x:xp(todayI)+4,y:pT+12,fontSize:9,fill:"#C48282",fontFamily:"system-ui",fontWeight:"600"},"Hoje"),
      // End markers
      plannedEndI>=0&&ce("line",{key:"pe",x1:xp(plannedEndI),x2:xp(plannedEndI),y1:pT,y2:pT+cH,stroke:"#C8CCDB",strokeWidth:1,strokeDasharray:"4,4"}),
      plannedEndI>=0&&ce("text",{key:"pel",x:xp(plannedEndI)+3,y:pT+24,fontSize:8,fill:"#9BA3B8",fontFamily:"system-ui"},"Prazo"),
      hasDelay&&trendEndI>=0&&ce("line",{key:"te",x1:xp(trendEndI),x2:xp(trendEndI),y1:pT,y2:pT+cH,stroke:"#E8A048",strokeWidth:1.5,strokeDasharray:"4,3"}),
      hasDelay&&trendEndI>=0&&ce("text",{key:"tel",x:xp(trendEndI)+3,y:pT+24,fontSize:8,fill:"#B8895A",fontFamily:"system-ui"},"Projeção"),
      // Dots on actual data points > 0
      actualPts.filter(p=>p.v>0).map((p,i)=>
        ce("circle",{key:"dot"+i,cx:xp(p.i).toFixed(1),cy:yp(p.v).toFixed(1),r:4,fill:accentColor,stroke:"#fff",strokeWidth:2})
      ),
      // X axis labels
      data.filter((_,i)=>i%step===0).map((d,i)=>
        ce("text",{key:"x"+i,x:xp(data.indexOf(d)).toFixed(1),y:CH+18,textAnchor:"middle",fontSize:9,fill:"#B0B8D0",fontFamily:"system-ui"},d.date)
      )
    ),
    // Legend
    ce("div",{style:{display:"flex",gap:20,marginTop:8}},
      [[accentColor,"Realizado","solid"],["#D0D5E8","Planejado","dashed"],["#E8A048","Tendência","dashed"]].map(([c,l,t])=>
        ce("div",{key:l,style:{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"#7A8094"}},
          ce("svg",{width:24,height:10,viewBox:"0 0 24 10"},
            ce("line",{x1:0,y1:5,x2:24,y2:5,stroke:c,strokeWidth:t==="solid"?2.5:1.5,strokeDasharray:t==="dashed"?"6,3":"none",strokeLinecap:"round"}),
            t==="solid"&&ce("circle",{cx:12,cy:5,r:3,fill:c})
          ),
          l
        )

}

// ── Progress ──
function computeProgress(updates,schedules,gid){
  const grpUpd=updates[gid]||[],sched=schedules[gid]||{},acc={};
  grpUpd.forEach(u=>{if(!acc[u.floor])acc[u.floor]={};if(!acc[u.floor][u.room])acc[u.floor][u.room]={};const env=u.environment||"Ambiente";acc[u.floor][u.room][env]=(acc[u.floor][u.room][env]||0)+(u.actualPct||0);});
  const fs={};
  FLOORS.forEach(fl=>{
    const sc=sched[fl]||{},rc=sc.roomCount||12;
    let sum=0,done=0;const rooms={};
    for(let r=1;r<=rc;r++){const envs=acc[fl]?.[r]||{};const ek=Object.keys(envs);if(!ek.length){rooms[r]={envs:{},avgPct:0,done:false};continue;}let rs=0;const ed={};ek.forEach(e=>{const p=Math.min(100,envs[e]);ed[e]=p;rs+=p;});const avg=rs/ek.length;rooms[r]={envs:ed,avgPct:Math.round(avg),done:avg>=100};sum+=avg;if(avg>=100)done++;}
    const el=Math.max(0,diffD(sc.startDate||TODAY,TODAY)),td=Math.max(1,diffD(sc.startDate||TODAY,sc.endDate||fmt(addD(new Date(),90))));
    const pp=Math.min(100,(el/td)*100),ap=rc>0?sum/rc:0;
    fs[fl]={roomCount:rc,doneRooms:done,plannedPct:pp,actualPct:ap,variance:ap-pp,rooms,startDate:sc.startDate,endDate:sc.endDate};
  });
  const tot=FLOORS.reduce((a,f)=>{const s=fs[f];a.done+=s.doneRooms;a.total+=s.roomCount;a.sumPct+=s.actualPct;return a;},{done:0,total:0,sumPct:0});
  return{acc,floorStats:fs,totals:tot};
}

function computeChart(updates,schedules,gid,filterFloor){
  const grpUpd=(updates[gid]||[]).filter(u=>!filterFloor||u.floor===filterFloor);
  const sched=schedules[gid]||{};
  const floors=filterFloor?[filterFloor]:FLOORS;

  // Earliest schedule start and latest planned end
  let earliestStart=TODAY, latestEnd=fmt(addD(new Date(),90));
  let hasSchedule=false;
  floors.forEach(fl=>{
    const sc=sched[fl];
    if(!sc?.startDate||!sc?.endDate)return;
    hasSchedule=true;
    if(sc.startDate<earliestStart)earliestStart=sc.startDate;
    if(sc.endDate>latestEnd)latestEnd=sc.endDate;
  });
  if(!hasSchedule){earliestStart=TODAY;latestEnd=fmt(addD(new Date(),90));}

  // Current actual % and rate from TODAY
  const todayAcc={};
  grpUpd.filter(u=>u.date<=TODAY).forEach(u=>{
    const k=`${u.floor}_${u.room}_${u.environment||"A"}`;
    todayAcc[k]=(todayAcc[k]||0)+(u.actualPct||0);
  });
  let totalUnitsNow=0;
  floors.forEach(fl=>{const sc=sched[fl];if(sc?.startDate&&TODAY>=sc.startDate)totalUnitsNow+=sc.roomCount||12;});
  const todayVals=Object.values(todayAcc).map(v=>Math.min(100,v));
  const currentActual=totalUnitsNow>0
    ?todayVals.reduce((a,b)=>a+b,0)/totalUnitsNow
    :(todayVals.length?todayVals.reduce((a,b)=>a+b,0)/todayVals.length:0);

  // Daily rate = current actual / days since earliest schedule start
  const daysElapsed=Math.max(1,diffD(earliestStart,TODAY));
  const ratePerDay=currentActual/daysElapsed; // % per day

  // Project trend end date: when does trend reach 100%?
  let projectedEndDate=latestEnd;
  if(ratePerDay>0){
    const daysToFinish=Math.ceil((100-currentActual)/ratePerDay);
    projectedEndDate=fmt(addD(new Date(),daysToFinish));
  }
  const delayDays=Math.max(0,diffD(latestEnd,projectedEndDate));

  // Chart window: from schedule start to max(plannedEnd, projectedEnd) + 10 days buffer
  const chartStart=earliestStart;
  const chartEnd=fmt(addD(new Date(projectedEndDate>latestEnd?projectedEndDate:latestEnd),10));
  const totalDays=Math.max(2,diffD(chartStart,chartEnd));

  const data=[];
  for(let i=0;i<=totalDays;i++){
    const date=fmt(addD(new Date(chartStart),i));
    const isPast=date<=TODAY;

    // Planned: linear progress across all floors with schedules
    let planned=0,activeFloors=0;
    floors.forEach(fl=>{
      const sc=sched[fl];
      if(!sc?.startDate||!sc?.endDate)return;
      activeFloors++;
      if(date<sc.startDate)return;
      if(date>=sc.endDate){planned+=100;return;}
      const el=Math.max(0,diffD(sc.startDate,date));
      const td=Math.max(1,diffD(sc.startDate,sc.endDate));
      planned+=Math.min(100,(el/td)*100);
    });
    // DD/MM format for x-axis labels
    const dd=date.slice(8),mm=date.slice(5,7);
    const entry={date:dd+"/"+mm,fullDate:date,planned:Math.round(activeFloors>0?planned/activeFloors:0)};

    // Actual: cumulative
    if(isPast){
      const acc={};
      grpUpd.filter(u=>u.date<=date).forEach(u=>{
        const k=`${u.floor}_${u.room}_${u.environment||"A"}`;
        acc[k]=(acc[k]||0)+(u.actualPct||0);
      });
      const vals=Object.values(acc).map(v=>Math.min(100,v));
      let tu=0;floors.forEach(fl=>{const sc=sched[fl];if(sc?.startDate&&date>=sc.startDate)tu+=sc.roomCount||12;});
      entry.actual=tu>0?Math.round(vals.reduce((a,b)=>a+b,0)/tu):(vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0);
    }

    // Trend: project at current rate from today's actual, capped at 100
    if(!isPast&&ratePerDay>0){
      const daysAhead=diffD(TODAY,date);
      entry.trend=Math.min(100,Math.round(currentActual+ratePerDay*daysAhead));
    }

    data.push(entry);
  }

  // Attach metadata to array
  data._meta={plannedEndDate:latestEnd,projectedEndDate,delayDays,currentActual:Math.round(currentActual),ratePerDay:ratePerDay.toFixed(2)};
  return data;
}

function getUT(grpUpd,floor,room,env,dpu){
  const base=Math.round(100/Math.max(1,dpu));
  const ud=grpUpd.filter(u=>u.floor===floor&&String(u.room)===String(room)&&(u.environment||"Ambiente")===env);
  const tp=ud.reduce((s,u)=>s+(u.targetPct||0),0),ta=ud.reduce((s,u)=>s+(u.actualPct||0),0);
  const acc=Math.min(100,ta),rem=100-acc;
  if(rem<=0)return{target:0,accumulated:100,remaining:0,carryover:0,done:true};
  const co=Math.max(0,tp-ta);
  return{target:Math.min(rem,Math.round(base+co)),accumulated:Math.round(acc),remaining:Math.round(rem),carryover:Math.round(co),done:false};
}

function getFloorTeams(companies,floor){return(companies||[]).flatMap(co=>co.teams.filter(t=>(t.assignedFloors||[]).includes(floor)).map(t=>({...t,coName:co.name,coColor:co.color})));}

function App(){
  const [selectedGroup,setSelectedGroup]=useState(null);
  const [groupTab,setGroupTab]=useState("dashboard");
  const [groups,setGroups]=useState(IG);
  const [schedules,setSchedules]=useState(()=>{const s={};IG.forEach(g=>{s[g.id]=gS();});return s;});

  const [aiInsights,setAiInsights]=useState({});
  const [isLoadingAI,setIsLoadingAI]=useState(false);
  const [connected,setConnected]=useState(false);
  const [toast,setToast]=useState(null);

  useEffect(()=>{
    REF.on("value",snap=>{
      const d=snap.val();
      if(!d){const init={groups:IG,schedules:{},updates:{},aiInsights:{}};IG.forEach(g=>{init.schedules[g.id]=gS();});REF.set(init);}
      else{

        if(d.schedules)setSchedules(d.schedules);
        if(d.updates){const u={};Object.entries(d.updates).forEach(([gid,vals])=>{u[gid]=Object.values(vals||{}).sort((a,b)=>(a.date||"")>(b.date||"")?1:-1);});setUpdates(u);}
        if(d.aiInsights){const ai={};Object.entries(d.aiInsights).forEach(([gid,val])=>{ai[gid]=typeof val==="string"?val:"";});setAiInsights(ai);}
      }
      setConnected(true);
      const sp=document.getElementById("splash");if(sp){sp.classList.add("hide");setTimeout(()=>sp.remove(),500);}
    },()=>setConnected(false));
    return()=>REF.off();
  },[]);

  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);},[]);
  const saveAll=useCallback(async()=>{await Promise.all([REF.child("groups").set(groups),REF.child("schedules").set(schedules)]);},[groups,schedules]);
  const onPushUpdate=useCallback(async(gid,update)=>{await REF.child("updates").child(gid).push(update);},[]);
  const refresh=()=>{REF.once("value",()=>{});showToast("Dados atualizados!");};
  const addGroup=()=>{const name=window.prompt("Nome do novo grupo:");if(!name?.trim())return;const id=`g${Date.now()}`;setGroups(p=>[...p,{id,name:name.trim(),color:"#9BB5C8",envName:"Ambiente",companies:[]}]);setSchedules(p=>({...p,[id]:gS()}));showToast("Grupo criado!");};

  const updGroupField=(id,f,v)=>setGroups(p=>p.map(g=>g.id===id?{...g,[f]:v}:g));

  const onRunAI=useCallback(async(gid)=>{
    setIsLoadingAI(true);
    const grp=groups.find(g=>g.id===gid);
    const grpUpd=updates[gid]||[];
    const progress=computeProgress(updates,schedules,gid);
    const totalGap=grpUpd.filter(u=>!u.hitTarget).reduce((s,u)=>s+((u.targetPct||0)-(u.actualPct||0)),0);
    const causeStats={};grpUpd.filter(u=>!u.hitTarget&&u.cause).forEach(u=>{causeStats[u.cause]=(causeStats[u.cause]||0)+1;});
    const topCauses=Object.entries(causeStats).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const allTeams=(grp?.companies||[]).flatMap(co=>co.teams.map(t=>({...t,coName:co.name})));
    const prompt=`Consultor senior de obras hoteleiras. OBRA: Sofitel RJ | GRUPO: ${grp?.name} | DATA: ${TODAY}\nEQUIPES:\n${allTeams.map(t=>`${t.coName} ${t.name}: ${t.people}p, ${t.dpu}d/amb, andares:[${(t.assignedFloors||[]).join(",")}]`).join("\n")}\nPROGRESSO:\n${FLOORS.map(f=>{const s=progress.floorStats[f];return `${f}: real ${s.actualPct.toFixed(0)}% plan ${s.plannedPct.toFixed(0)}% | ${s.doneRooms}/${s.roomCount}`;}).join("\n")}\nATRASO: ${totalGap}%\nCAUSAS: ${topCauses.map(([c,n])=>`${c}(${n}x)`).join(", ")||"Nenhuma"}\nForneca: 1.STATUS GERAL 2.ALERTAS 3.TENDENCIA com nova data 4.ACOES IMEDIATAS 5.RECOMENDACAO para recuperar ${totalGap}%: adicionar pessoas ou estender horas - calcule impacto em dias 6.META DIARIA. Direto, executivo, portugues, para o CEO.`;
    try{const res=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});const data=await res.json();const text=data.content?.find(b=>b.type==="text")?.text||"Erro.";setAiInsights(p=>({...p,[gid]:text}));await REF.child("aiInsights").child(gid).set(text);}catch(e){setAiInsights(p=>({...p,[gid]:"Erro ao conectar com a IA."}));}
    setIsLoadingAI(false);
  },[groups,schedules,updates]);

  const curGrp=groups.find(g=>g.id===selectedGroup);
  const TABS=[{id:"dashboard",l:"Dashboard"},{id:"update",l:"Atualizacao"},{id:"schedule",l:"Cronograma"},{id:"teams",l:"Equipes"},{id:"analysis",l:"Analise IA"}];

  return ce("div",{style:{display:"flex",height:"100vh",overflow:"hidden",fontFamily:"'Outfit',system-ui,sans-serif",background:"#F0F2F7"}},
    // Sidebar
    ce("nav",{style:{width:228,background:"#fff",display:"flex",flexDirection:"column",flexShrink:0,boxShadow:"1px 0 0 #ECEEF6",zIndex:10}},
      ce("div",{style:{padding:"22px 20px 18px",borderBottom:"1px solid #F0F2F6"}},
        ce("div",{style:{fontFamily:"'Sora',sans-serif",fontWeight:800,fontSize:12,letterSpacing:"3px",color:"#16181D"}},"SOFITEL RJ"),
        ce("div",{style:{fontSize:10,color:"#A0A8BE",marginTop:5,display:"flex",alignItems:"center",gap:5}},
          ce("span",{style:{width:5,height:5,borderRadius:"50%",background:connected?"#3A9068":"#C48282",display:"inline-block"}}),
          connected?"Online":"Sem conexão"
        )
      ),
            ce("div",{style:{flex:1,overflow:"auto"}},
        ce("div",{style:{padding:"10px 0 4px"}},
          ce("div",{onClick:()=>setSelectedGroup(null),style:{display:"flex",alignItems:"center",gap:9,padding:"9px 14px",cursor:"pointer",background:!selectedGroup?"#EAECF5":"transparent",borderRadius:9,margin:"0 8px 2px",color:!selectedGroup?"#16181D":"#7A8094",fontSize:13,fontWeight:!selectedGroup?600:400,transition:"all .15s"}},"◈  Visão Geral")
        ),
        ce("div",{style:{padding:"4px 0"}},
          ce("div",{style:{fontSize:9,fontWeight:600,color:"#B0B8D0",letterSpacing:"1.4px",textTransform:"uppercase",padding:"8px 22px 6px"}},"Grupos de Serviço"),
          groups.map(g=>{
            const isSel=selectedGroup===g.id;
            return ce("div",{key:g.id,style:{display:"flex",alignItems:"center",padding:"0 8px",marginBottom:1}},
              ce("div",{onClick:()=>{setSelectedGroup(g.id);setGroupTab("dashboard");},style:{display:"flex",alignItems:"center",gap:9,flex:1,cursor:"pointer",padding:"8px 10px",borderRadius:9,background:isSel?"#EAECF5":"transparent",color:isSel?"#16181D":"#7A8094",fontSize:13,fontWeight:isSel?600:400,minWidth:0,transition:"all .15s"}},
                ce("div",{style:{width:8,height:8,borderRadius:"50%",background:g.color,flexShrink:0}}),
                ce("span",{style:{flex:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},g.name)
              ),
              ce("button",{className:"icon-btn",title:"Editar grupo",onClick:e=>{e.stopPropagation();setSelectedGroup(g.id);setGroupTab("teams");},dangerouslySetInnerHTML:{__html:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'}}),
              ce("button",{className:"icon-btn",title:"Remover grupo",onClick:e=>{e.stopPropagation();remGroup(g.id);},dangerouslySetInnerHTML:{__html:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>'}})
            );
          }),
          ce("div",{style:{padding:"6px 16px 8px"}},ce("button",{onClick:addGroup,style:S.btnAdd},"+ Novo Grupo"))
        )
      ),
      ce("div",{style:{padding:"12px 14px 16px",borderTop:"1px solid #F0F2F8"}},
        ce("button",{onClick:refresh,style:{width:"100%",padding:"9px 14px",borderRadius:10,border:"1.5px solid #ECEEF6",background:"#FAFBFD",fontSize:12,fontWeight:500,color:"#7A8094",display:"flex",alignItems:"center",gap:7,justifyContent:"center",cursor:"pointer"}},"↻  Atualizar dados"),
        curGrp&&ce("div",{style:{fontSize:10,color:curGrp.color,fontWeight:600,textTransform:"uppercase",letterSpacing:"1.2px",marginTop:10,paddingLeft:4}},curGrp.name)
      )
    ),
    // Main
    ce("main",{style:{flex:1,overflow:"auto",padding:"28px 32px",background:"#F7F8FA"}},
      !connected&&ce("div",{style:{background:"#FBF0F0",border:"1px solid #E8C4C4",borderRadius:8,padding:"10px 16px",marginBottom:16,fontSize:12,color:"#C48282",fontWeight:600}},"Sem conexao com Firebase"),
      selectedGroup&&curGrp?ce("div",null,
        ce("div",{style:{marginBottom:18}},
          ce("button",{onClick:()=>setSelectedGroup(null),style:{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,border:"1px solid #EDEBE6",background:"#fff",fontSize:12,fontWeight:600,color:"#5A6070",marginBottom:12}},"← Todos os grupos"),
          ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
            ce("div",{style:{display:"flex",alignItems:"center",gap:10}},
              ce("input",{type:"color",value:curGrp.color,onChange:e=>updGroupField(curGrp.id,"color",e.target.value),style:{width:24,height:24,borderRadius:5,border:"1px solid #E8E5DF",cursor:"pointer",padding:1,flexShrink:0}}),
              ce("input",{value:curGrp.name,onChange:e=>updGroupField(curGrp.id,"name",e.target.value),style:{fontSize:20,fontWeight:700,color:"#1A1D23",border:"none",background:"transparent",outline:"none",fontFamily:"inherit",padding:"2px 4px",borderRadius:4}})
            ),
            ce("div",{style:{display:"flex",gap:8,alignItems:"center"}},
              ce("span",{style:{fontSize:10,color:"#9BA3B8"}},"Tipo de ambiente:"),
              ce("input",{value:curGrp.envName,onChange:e=>updGroupField(curGrp.id,"envName",e.target.value),style:{...S.inp,width:130,padding:"5px 8px",fontSize:11},placeholder:"Banheiro, Quarto..."}),
              ce("button",{onClick:saveAll,style:S.btnP},"Salvar tudo")
            )
          ),
          ce("div",{style:{display:"flex",borderBottom:"1px solid #EDEBE6",marginTop:14}},
            TABS.map(t=>ce("button",{key:t.id,onClick:()=>setGroupTab(t.id),style:{padding:"9px 22px",border:"none",background:groupTab===t.id?"#fff":"transparent",fontSize:13,fontWeight:groupTab===t.id?600:400,color:groupTab===t.id?"#16181D":"#9BA3B8",borderRadius:"8px 8px 0 0",borderBottom:groupTab===t.id?`2px solid ${curGrp.color}`:"2px solid transparent",marginBottom:-1,cursor:"pointer",letterSpacing:"-.01em",transition:"all .15s"}},t.l))
          )
        ),
        groupTab==="dashboard"&&ce(GroupDashboard,{grp:curGrp,updates,schedules,setTab:setGroupTab}),
        groupTab==="update"&&ce(GroupUpdate,{grp:curGrp,updates,onPushUpdate,schedules,showToast}),
        groupTab==="schedule"&&ce(GroupSchedule,{grp:curGrp,schedules,setSchedules,onSave:saveAll,showToast}),
        groupTab==="teams"&&ce(GroupTeams,{grp:curGrp,setGroups,onSave:saveAll,showToast}),
        groupTab==="analysis"&&ce(GroupAnalysis,{grp:curGrp,schedules,updates,aiInsights,isLoadingAI,onRunAI})
      ):ce(Overview,{groups,updates,schedules,setSelectedGroup}),
      toast&&ce("div",{style:{position:"fixed",bottom:20,right:20,padding:"11px 20px",borderRadius:9,background:"#1A1D23",color:"#fff",fontSize:12,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.15)",zIndex:9999,borderLeft:"3px solid #A8C4B0"}},toast)
    )
  );
}

try{ReactDOM.createRoot(document.getElementById("root")).render(ce(App));}catch(err){document.getElementById("root").innerHTML='<div style="padding:40px;font-family:monospace;color:red;background:#fff"><h3>Erro React:</h3><pre>'+err.message+'\n\n'+err.stack+'</pre></div>';document.getElementById("splash")?.remove();}
</script>
</body>
</html>
