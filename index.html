// Back button component

// ── Chart ──
function LineChart({data,color,h}){
  const H=h||240;
  if(!data||data.length<2)return ce("div",{style:{height:H,display:"flex",alignItems:"center",justifyContent:"center",color:"#B8B5AD",fontSize:12}},"Registre avanços para ver o gráfico");
  const W=900,CH=H-50,pL=42,pR=20,pT=10,pB=28,cW=W-pL-pR,cH=CH-pT-pB;
  const allV=data.flatMap(d=>[d.planned,d.actual,d.trend].filter(v=>v!==undefined));
  const maxV=Math.max(...allV,1);
  const xp=i=>pL+(i/(data.length-1))*cW;
  const yp=v=>pT+cH-(v/maxV)*cH;
  const mkLine=(key,stroke,dash,sw)=>{
    const pts=data.map((d,i)=>({v:d[key],i})).filter(p=>p.v!==undefined);
    if(pts.length<2)return null;
    return ce("path",{key,d:pts.map((p,j)=>`${j===0?"M":"L"} ${xp(p.i).toFixed(1)} ${yp(p.v).toFixed(1)}`).join(" "),stroke,strokeWidth:sw||2,fill:"none",strokeDasharray:dash||"none"});
  };
  const step=Math.max(1,Math.floor(data.length/10));
  const todayI=data.findLastIndex(d=>d.actual!==undefined);
  return ce("div",null,
    ce("svg",{viewBox:`0 0 ${W} ${CH+24}`,style:{width:"100%",height:H-10},preserveAspectRatio:"xMidYMid meet"},
      [0,.2,.4,.6,.8,1].map((p,i)=>ce("line",{key:i,x1:pL,x2:W-pR,y1:(pT+cH*(1-p)).toFixed(1),y2:(pT+cH*(1-p)).toFixed(1),stroke:"#F0EDE8",strokeWidth:1})),
      mkLine("planned","#D6D3CC","6,4",1.5),
      mkLine("actual",color||"#9BB5C8",null,3),
      mkLine("trend","#C4A882","5,3",2),
      todayI>=0&&ce("line",{key:"td",x1:xp(todayI),x2:xp(todayI),y1:pT,y2:pT+cH,stroke:"#E8C4C4",strokeWidth:1.5,strokeDasharray:"4,3"}),
      todayI>=0&&ce("text",{key:"tdl",x:xp(todayI)+3,y:pT+10,fontSize:8,fill:"#C48282",fontFamily:"system-ui"},"Hoje"),
      data.filter((_,i)=>i%step===0).map((d,i)=>ce("text",{key:"x"+i,x:xp(data.indexOf(d)).toFixed(1),y:CH+16,textAnchor:"middle",fontSize:9,fill:"#C4C1BA",fontFamily:"system-ui"},d.date)),
      [0,Math.round(maxV/3),Math.round(maxV*2/3),maxV].map((v,i)=>ce("text",{key:"y"+i,x:pL-4,y:yp(v)+3,textAnchor:"end",fontSize:9,fill:"#C4C1BA",fontFamily:"system-ui"},v+"%"))
    ),
    ce("div",{style:{display:"flex",gap:20,marginTop:8}},
      [["#D6D3CC","Planejado"],[color||"#9BB5C8","Realizado"],["#C4A882","Tendência"]].map(([c,l])=>
        ce("div",{key:l,style:{display:"flex",alignItems:"center",gap:5,fontSize:10,color:"#8C8980"}},
          ce("div",{style:{width:22,height:2,background:c,borderRadius:1}}),l
        )
      )
    )
  );
}

// ── Progress ──
function computeProgress(updates,schedules,gid){
  const grpUpd=updates[gid]||[],sched=schedules[gid]||{};
  const acc={};
  grpUpd.forEach(u=>{if(!acc[u.floor])acc[u.floor]={};if(!acc[u.floor][u.room])acc[u.floor][u.room]={};const env=u.environment||"Ambiente";acc[u.floor][u.room][env]=(acc[u.floor][u.room][env]||0)+(u.actualPct||0);});
  const fs={};
  FLOORS.forEach(fl=>{
    const sc=sched[fl]||{},rc=sc.roomCount||12;
    let sum=0,done=0;const rooms={};
    for(let r=1;r<=rc;r++){const envs=acc[fl]?.[r]||{};const ek=Object.keys(envs);if(!ek.length){rooms[r]={envs:{},avgPct:0,done:false};continue;}let rs=0;const ed={};ek.forEach(e=>{const p=Math.min(100,envs[e]);ed[e]=p;rs+=p;});const avg=rs/ek.length;rooms[r]={envs:ed,avgPct:Math.round(avg),done:avg>=100};sum+=avg;if(avg>=100)done++;}
    const el=Math.max(0,diffD(sc.startDate||TODAY,TODAY)),td=Math.max(1,diffD(sc.startDate||TODAY,sc.endDate||fmt(addD(new Date(),90))));
    const pp=Math.min(100,(el/td)*100),ap=rc>0?sum/rc:0;
    fs[fl]={roomCount:rc,doneRooms:done,plannedPct:pp,actualPct:ap,variance:ap-pp,rooms,startDate:sc.startDate,endDate:sc.endDate};
  });
  const tot=FLOORS.reduce((a,f)=>{const s=fs[f];a.done+=s.doneRooms;a.total+=s.roomCount;a.sumPct+=s.actualPct;return a;},{done:0,total:0,sumPct:0});
  return{acc,floorStats:fs,totals:tot};
}

function computeChart(updates,schedules,gid,filterFloor){
  const grpUpd=(updates[gid]||[]).filter(u=>!filterFloor||u.floor===filterFloor);
  const sched=schedules[gid]||{};
  const dates=[...new Set(grpUpd.map(u=>u.date))].sort();
  const base=dates[0]||TODAY;
  const floors=filterFloor?[filterFloor]:FLOORS;
  const data=[];
  for(let i=0;i<=diffD(base,fmt(addD(new Date(),35)));i++){
    const date=fmt(addD(new Date(base),i)),isPast=date<=TODAY;
    let planned=0;floors.forEach(fl=>{const sc=sched[fl];if(!sc||date<sc.startDate)return;const el=Math.max(0,diffD(sc.startDate,date));const td=Math.max(1,diffD(sc.startDate,sc.endDate));planned+=(el/td)*100;});
    const avgP=floors.length>0?planned/floors.length:0;
    const entry={date:date.slice(5),planned:Math.round(avgP)};
    if(isPast){const acc={};grpUpd.filter(u=>u.date<=date).forEach(u=>{const k=`${u.floor}_${u.room}_${u.environment||"A"}`;acc[k]=(acc[k]||0)+(u.actualPct||0);});const vals=Object.values(acc).map(v=>Math.min(100,v));entry.actual=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;}
    if(!isPast&&dates.length>=2){const la=data.filter(d=>d.actual!==undefined);if(la.length>=2){const v=la[la.length-1].actual,r=v/Math.max(1,diffD(dates[0],TODAY));entry.trend=Math.min(100,Math.round(v+r*diffD(TODAY,date)));}}
    data.push(entry);
  }
  return data;
}

function getUT(grpUpd,floor,room,env,dpu){
  const base=Math.round(100/Math.max(1,dpu));
  const ud=grpUpd.filter(u=>u.floor===floor&&u.room===room&&(u.environment||"Ambiente")===env);
  const tp=ud.reduce((s,u)=>s+(u.targetPct||0),0),ta=ud.reduce((s,u)=>s+(u.actualPct||0),0);
  const acc=Math.min(100,ta),rem=100-acc;
  if(rem<=0)return{target:0,accumulated:100,remaining:0,carryover:0,done:true};
  const co=Math.max(0,tp-ta);
  return{target:Math.min(rem,Math.round(base+co)),accumulated:Math.round(acc),remaining:Math.round(rem),carryover:Math.round(co),done:false};
}

function getFloorTeams(companies,floor){return companies.flatMap(co=>co.teams.filter(t=>(t.assignedFloors||[]).includes(floor)).map(t=>({...t,coName:co.name,coColor:co.color})));}

// ══════════ GROUP DASHBOARD TAB ══════════
function GroupDashboard({grp,updates,schedules,companies,setTab}){
  const [selFloor,setSelFloor]=useState(null);
  const progress=useMemo(()=>computeProgress(updates,schedules,grp.id),[updates,schedules,grp.id]);

  const {totals,floorStats}=progress;
  const grpUpd=updates[grp.id]||[];
  const avgPct=totals.total>0?Math.round(totals.sumPct/totals.total):0;
  const daysA=grpUpd.length>0?Math.max(1,diffD(grpUpd[0]?.date||TODAY,TODAY)+1):1;
  const dp=(grpUpd.reduce((s,u)=>s+(u.actualPct||0),0)/daysA).toFixed(1);
  const atRisk=FLOORS.filter(f=>floorStats[f]?.variance<-10).length;

  // Floor detail data
  const [selRoom,setSelRoom]=useState(null);
  const floorChartData=useMemo(()=>selFloor?computeChart(updates,schedules,grp.id,selFloor):[],[updates,schedules,grp.id,selFloor]);
  const floorTeams=selFloor?getFloorTeams(companies,selFloor):[];
  const sc=selFloor?(schedules[grp.id]||{})[selFloor]||{}:{};
  const rc=sc.roomCount||12;
  const acc=selFloor?(progress.acc[selFloor]||{}):{};
  const rooms=selFloor?Array.from({length:rc},(_,i)=>i+1).map(r=>{const envs=acc[r]||{};const ek=Object.keys(envs);if(!ek.length)return{r,envs:{},avgPct:0};let s=0;const ed={};ek.forEach(e=>{const p=Math.min(100,envs[e]);ed[e]=p;s+=p;});return{r,envs:ed,avgPct:Math.round(s/ek.length)};}).slice(0,rc):[];

  return ce("div",null,
    // KPIs
    ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}},
      [{l:"Avanço Médio",v:avgPct+"%",s:"média dos ambientes",c:grp.color,bg:"#F0F4F8"},
       {l:"Quartos Completos",v:totals.done+"/"+totals.total,s:"concluídos",c:"#7AAE90",bg:"#F0F7F3"},
       {l:"Ritmo Diário",v:dp+"%",s:"avanço por dia",c:"#C4B89A",bg:"#FAF8F3"},
       {l:"Andares em Risco",v:String(atRisk),s:"abaixo do plano",c:"#C4A882",bg:"#FAF6F0"},
      ].map((k,i)=>ce("div",{key:i,style:{background:k.bg,borderRadius:11,padding:"13px 15px",borderTop:`3px solid ${k.c}`,border:`1px solid ${k.c}22`}},
        ce("div",{style:{fontSize:9,color:"#B8B5AD",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:5}},k.l),
        ce("div",{style:{fontSize:24,fontWeight:700,color:k.c,lineHeight:1,marginBottom:3}},k.v),
        ce("div",{style:{fontSize:10,color:"#B8B5AD"}},k.s)
      ))
    ),
    // Chart — full width
    ce("div",{style:{...S.card,marginBottom:14,padding:"16px 20px"}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
        ce("p",{style:{...S.h2,margin:0}},"Cronograma Base · Avanço % e Tendência"),
        ce("button",{style:{...S.btnS,fontSize:11,padding:"5px 12px"},onClick:()=>setTab("update")},"+ Registrar avanço")
      ),
      ce(LineChart,{data:chartData,color:grp.color,h:260})
    ),
    // Floor grid
    ce("div",{style:S.card},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
        ce("p",{style:{...S.h2,margin:0}},"Pavimentos — Clique para ver detalhes"),
        selFloor&&ce("button",{style:{...S.btnS,fontSize:11,padding:"5px 10px"},onClick:()=>{setSelFloor(null);setSelRoom(null);}},"✕ Fechar detalhe")
      ),
      ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:selFloor?16:0}},
        FLOORS.map(fl=>{
          const s=floorStats[fl];const co=companies.find(c=>c.teams.some(t=>(t.assignedFloors||[]).includes(fl)));
          const color=SC(s.variance);const isSel=selFloor===fl;
          return ce("div",{key:fl,onClick:()=>{setSelFloor(isSel?null:fl);setSelRoom(null);},style:{borderRadius:10,padding:"10px 12px",background:isSel?"#fff":SB(s.variance),border:`${isSel?2:1}px solid ${isSel?color:color+"44"}`,cursor:"pointer"}},
            ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}},
              ce("span",{style:{fontWeight:700,fontSize:14,color:"#1C1B18"}},fl+"°"),
              ce("span",{style:{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:10,background:color+"22",color}},SL(s.variance))
            ),
            co&&ce("div",{style:{fontSize:9,color:"#B8B5AD",marginBottom:4}},co.name),
            ce("div",{style:{background:"#E8E5DF",borderRadius:3,height:4,marginBottom:4}},ce("div",{style:{width:Math.min(100,s.actualPct)+"%",background:color,height:4,borderRadius:3}})),
            ce("div",{style:{display:"flex",justifyContent:"space-between",fontSize:9,color:"#B8B5AD"}},ce("span",null,"Real "+s.actualPct.toFixed(0)+"%"),ce("span",null,"Plan "+s.plannedPct.toFixed(0)+"%")),
            ce("div",{style:{fontSize:9,color:"#C4C1BA",marginTop:2}},s.doneRooms+"/"+s.roomCount+" completos")
          );
        })
      ),
      selFloor&&ce("div",{style:{borderTop:"1px solid #EDEBE6",paddingTop:16}},
        ce("div",{style:{...S.g2,marginBottom:14}},
          ce("div",{style:{background:"#F5F4F1",borderRadius:9,padding:"12px 14px"}},
            ce("div",{style:{fontSize:10,color:"#B8B5AD",marginBottom:2}},"Equipes no "+selFloor+"° andar"),
            floorTeams.length?floorTeams.map(t=>ce("div",{key:t.id,style:{fontSize:12,fontWeight:600,color:"#1C1B18",marginBottom:3,display:"flex",gap:8,alignItems:"center"}},
              ce("div",{style:{width:8,height:8,borderRadius:"50%",background:t.coColor}}),t.coName+" · "+t.name+" ("+t.dpu+"d/amb · "+t.people+"p)"
            )):ce("div",{style:{color:"#B8B5AD",fontSize:12}},"Nenhuma equipe atribuída")
          ),
          ce("div",{style:{background:"#F5F4F1",borderRadius:9,padding:"12px 14px"}},
            ce("div",{style:{fontSize:10,color:"#B8B5AD",marginBottom:2}},"Cronograma"),
            ce("div",{style:{fontSize:13,fontWeight:700,color:"#1C1B18"}}),sc.startDate||"—"," → ",sc.endDate||"—",
            ce("div",{style:{fontSize:10,color:"#B8B5AD",marginTop:3}}),rc," quartos · ",sc.startDate&&sc.endDate?diffD(sc.startDate,sc.endDate):"—"," dias"
          )
        ),
        ce("div",{style:{marginBottom:14}},
          ce("p",{style:{...S.h3,marginBottom:10}},"Quartos — Q"+selFloor),
          ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:6}},
            rooms.map(rm=>{
              const color=rm.done?"#7AAE90":rm.avgPct>0?"#9BB5C8":"#D6D3CC";
              return ce("div",{key:rm.r,onClick:()=>setSelRoom(selRoom===rm.r?null:rm.r),style:{padding:"8px",borderRadius:8,background:selRoom===rm.r?"#fff":"#FAFAF9",border:`${selRoom===rm.r?2:1}px solid ${selRoom===rm.r?color:"#EDEBE6"}`,cursor:"pointer",textAlign:"center"}},
                ce("div",{style:{fontWeight:700,fontSize:12,color:"#1C1B18"}},"Q"+rm.r),
                ce("div",{style:{fontSize:10,color,fontWeight:700,marginTop:2}},rm.avgPct+"%"),
                ce("div",{style:{background:"#E8E5DF",borderRadius:2,height:3,marginTop:4}},ce("div",{style:{width:rm.avgPct+"%",background:color,height:3,borderRadius:2}}))
              );
            })
          )
        ),

    ),
    ce("div",{style:{...S.g3,marginBottom:14}},
      ce("div",{style:S.card},ce("p",{style:S.h2},"Atraso Acumulado"),ce("div",{style:{fontSize:28,fontWeight:700,color:"#C48282",marginBottom:4}},totalGap+"%"),ce("div",{style:{fontSize:11,color:"#B8B5AD"}},grpUpd.filter(u=>!u.hitTarget).length+" dias não atingidos")),
      ce("div",{style:S.card},ce("p",{style:S.h2},"Quartos Completos"),ce("div",{style:{fontSize:28,fontWeight:700,color:"#7AAE90",marginBottom:4}},progress.totals.done+"/"+progress.totals.total),ce("div",{style:{fontSize:11,color:"#B8B5AD"}},"no grupo "+grp.name)),
      ce("div",{style:S.card},ce("p",{style:S.h2},"Top Causas"),topCauses.slice(0,3).map(([c,n])=>ce("div",{key:c,style:{fontSize:11,color:"#6C6960",marginBottom:4,display:"flex",justifyContent:"space-between"}},ce("span",null,c),ce("span",{style:{fontWeight:700,color:"#C4A882"}},n+"x"))),topCauses.length===0&&ce("span",{style:{color:"#7AAE90",fontSize:11}},"Nenhum atraso! 🟢"))
    ),
    ce("div",{style:{...S.card,marginBottom:14}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
        ce("p",{style:{...S.h2,margin:0}},"Registros com Atraso — Filtros"),
        ce("div",{style:{display:"flex",gap:8}},
          ce("select",{style:{...S.inp,width:"auto",fontSize:11},value:ff,onChange:e=>setFf(e.target.value)},ce("option",{value:""},"Todos os andares"),FLOORS.map(f=>ce("option",{key:f,value:f},f+"° Pavimento"))),
          ce("select",{style:{...S.inp,width:"auto",fontSize:11},value:ft,onChange:e=>setFt(e.target.value)},ce("option",{value:""},"Todas as equipes"),allTeams.map(t=>ce("option",{key:t.id,value:t.id},t.coName+" · "+t.name)))
        )
      ),
      filteredUpd.length===0?ce("div",{style:{padding:"16px 0",textAlign:"center",color:"#B8B5AD",fontSize:12}},"Nenhum atraso com esses filtros 🟢"):
      ce("div",{style:{display:"flex",flexDirection:"column",gap:6}},
        filteredUpd.slice(0,20).map(u=>{
          const co=companies.find(c=>c.teams.some(t=>t.id===u.teamId));const gap=(u.targetPct||0)-(u.actualPct||0);
          return ce("div",{key:u.id||u.ts,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#FAFAF9",borderRadius:8,border:"1px solid #EDEBE6",fontSize:11}},
            ce("div",null,ce("div",{style:{fontWeight:700,color:"#1C1B18"}},u.date+" · "+u.floor+"° · Q"+u.room+" · "+(u.environment||"—")),ce("div",{style:{color:"#8C8980",marginTop:2}},u.cause||"Sem causa")),
            ce("div",{style:{display:"flex",gap:8,alignItems:"center"}},co&&ce("span",{style:S.badge(co.color)},co.name),ce("span",{style:{fontWeight:700,color:"#C48282"}},"-"+gap+"%"))
          );
        })
      )
    ),
    ce("div",{style:{...S.card,background:"#FAFAF9"}},
      ce("p",{style:S.h2},"✦ Análise & Recomendações IA"),
      isLoadingAI?ce("div",{style:{padding:"30px 0",textAlign:"center",color:"#B8B5AD",fontSize:13}},"Analisando dados da obra..."):
      insight?ce("div",{style:{fontSize:12,lineHeight:1.9,whiteSpace:"pre-line",color:"#6C6960"}},insight):
      ce("div",{style:{padding:"30px 0",textAlign:"center"}},ce("div",{style:{fontSize:13,color:"#B8B5AD",marginBottom:14}},"Clique para gerar recomendações executivas"),ce("button",{style:S.btnP,onClick:()=>onRunAI(grp.id)},"✦ Gerar Análise"))
    )
  );
}

// ══════════ OVERVIEW (no group selected) ══════════
function Overview({groups,updates,schedules,setSelectedGroup}){
  return ce("div",null,
    ce("div",{style:{fontSize:20,fontWeight:700,color:"#1C1B18",marginBottom:4}},"Visão Geral da Obra"),
    ce("p",{style:{fontSize:11,color:"#B8B5AD",marginBottom:20}},"Selecione um grupo de serviço na sidebar ou clique abaixo para acessar"),
    ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}},
      groups.map(g=>{
        const progress=computeProgress(updates,schedules,g.id);
        const avg=progress.totals.total>0?Math.round(progress.totals.sumPct/progress.totals.total):0;
        return ce("div",{key:g.id,onClick:()=>setSelectedGroup(g.id),style:{...S.card,cursor:"pointer",borderTop:`3px solid ${g.color}`,borderLeft:`1px solid ${g.color}22`}},
          ce("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
            ce("div",{style:{width:10,height:10,borderRadius:"50%",background:g.color}}),
            ce("span",{style:{fontWeight:700,fontSize:13,color:"#1C1B18"}},g.name)
          ),
          ce("div",{style:{fontSize:26,fontWeight:700,color:g.color,marginBottom:4}},avg+"%"),
          ce("div",{style:{background:"#E8E5DF",borderRadius:3,height:5,marginBottom:6}},ce("div",{style:{width:avg+"%",background:g.color,height:5,borderRadius:3}})),
          ce("div",{style:{fontSize:10,color:"#B8B5AD"}},progress.totals.done+"/"+progress.totals.total+" ambientes completos"),
          ce("div",{style:{fontSize:10,color:"#B8B5AD",marginTop:2}},(updates[g.id]||[]).length+" registros")
        );
      })
    )
  );
}

// ══════════ MAIN APP ══════════
function App(){
  const [selectedGroup,setSelectedGroup]=useState(null);
  const [groupTab,setGroupTab]=useState("dashboard");
  const [groups,setGroups]=useState(IG);
  const [companies,setCompanies]=useState(IC);
  const [schedules,setSchedules]=useState(()=>{const s={};IG.forEach(g=>{s[g.id]=gS();});return s;});
  const [updates,setUpdates]=useState({});
  const [aiInsights,setAiInsights]=useState({});
  const [isLoadingAI,setIsLoadingAI]=useState(false);
  const [connected,setConnected]=useState(false);
  const [toast,setToast]=useState(null);

  useEffect(()=>{
    REF.on("value",snap=>{
      const d=snap.val();
      if(!d){const init={groups:IG,companies:IC,schedules:{},updates:{},aiInsights:{}};IG.forEach(g=>{init.schedules[g.id]=gS();});REF.set(init);}
      else{
        if(d.groups)setGroups(Array.isArray(d.groups)?d.groups:Object.values(d.groups));
        if(d.companies)setCompanies(Array.isArray(d.companies)?d.companies:Object.values(d.companies));
        if(d.schedules)setSchedules(d.schedules);
        if(d.updates){const u={};Object.entries(d.updates).forEach(([gid,vals])=>{u[gid]=Object.values(vals||{}).sort((a,b)=>(a.date||"")>(b.date||"")?1:-1);});setUpdates(u);}
        if(d.aiInsights){const ai={};Object.entries(d.aiInsights).forEach(([gid,val])=>{ai[gid]=typeof val==="string"?val:"";});setAiInsights(ai);}
      }
      setConnected(true);
      const splash=document.getElementById("splash");
      if(splash){splash.classList.add("hide");setTimeout(()=>splash.remove(),500);}
    },()=>setConnected(false));
    return()=>REF.off();
  },[]);

  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);},[]);
  const saveAll=useCallback(async()=>{await Promise.all([REF.child("groups").set(groups),REF.child("companies").set(companies),REF.child("schedules").set(schedules)]);},[groups,companies,schedules]);
  const onPushUpdate=useCallback(async(gid,update)=>{await REF.child("updates").child(gid).push(update);},[]);
  const refresh=()=>{REF.once("value",()=>{});showToast("🔄 Dados atualizados!");};
  const addGroup=()=>{const name=window.prompt("Nome do novo grupo de serviço:");if(!name?.trim())return;const id=`g${Date.now()}`;const newG={id,name:name.trim(),color:"#9BB5C8",envName:"Ambiente"};setGroups(p=>[...p,newG]);setSchedules(p=>({...p,[id]:gS()}));showToast("✅ Grupo '"+name.trim()+"' criado!");};
  const remGroup=id=>{if(!window.confirm("Remover este grupo?"))return;setGroups(p=>p.filter(g=>g.id!==id));if(selectedGroup===id)setSelectedGroup(null);};
  const updGroupField=(id,f,v)=>setGroups(p=>p.map(g=>g.id===id?{...g,[f]:v}:g));

  const onRunAI=useCallback(async(gid)=>{
    setIsLoadingAI(true);
    const grp=groups.find(g=>g.id===gid);
    const sched=schedules[gid]||{};
    const grpUpd=updates[gid]||[];
    const progress=computeProgress(updates,schedules,gid);
    const totalGap=grpUpd.filter(u=>!u.hitTarget).reduce((s,u)=>s+((u.targetPct||0)-(u.actualPct||0)),0);
    const causeStats={};grpUpd.filter(u=>!u.hitTarget&&u.cause).forEach(u=>{causeStats[u.cause]=(causeStats[u.cause]||0)+1;});
    const topCauses=Object.entries(causeStats).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const allTeams=companies.flatMap(co=>co.teams.map(t=>({...t,coName:co.name})));
    const prompt=`Consultor sênior de obras hoteleiras de alto padrão.\n\nOBRA: Sofitel RJ | GRUPO: ${grp?.name} | DATA: ${TODAY}\n\nEQUIPES:\n${allTeams.map(t=>`${t.coName} ${t.name}: ${t.people}p, ${t.dpu}d/amb, andares:[${(t.assignedFloors||[]).join(",")}]`).join("\n")}\n\nPROGRESSO:\n${FLOORS.map(f=>{const s=progress.floorStats[f];return `${f}°: real ${s.actualPct.toFixed(0)}% plan ${s.plannedPct.toFixed(0)}% var ${s.variance>0?"+":""}${s.variance.toFixed(0)}% | ${s.doneRooms}/${s.roomCount} completos`;}).join("\n")}\n\nATRASO: ${totalGap}% total\nCAUSAS: ${topCauses.map(([c,n])=>`${c}(${n}x)`).join(", ")||"Nenhuma"}\n\nÚLTIMOS:\n${grpUpd.slice(-10).map(u=>`${u.date}|${u.floor}°|Q${u.room}|${u.environment||"?"}|meta:${u.targetPct}%|real:${u.actualPct}%|${u.hitTarget?"✓":"✗"}${u.cause?"|"+u.cause:""}`).join("\n")||"Nenhum"}\n\nForneça:\n1.🔴🟡🟢 STATUS GERAL\n2.⚠️ ALERTAS críticos\n3.📈 TENDÊNCIA — nova data vs prazo\n4.✅ AÇÕES IMEDIATAS\n5.🔄 PARA RECUPERAR ${totalGap}%: (a) adicionar pessoas (quantas, onde) (b) estender horas (quantas) — impacto em dias de cada opção\n6.🎯 META DIÁRIA por equipe\nDireto, executivo, português, para o CEO.`;
    try{const res=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});const data=await res.json();const text=data.content?.find(b=>b.type==="text")?.text||data.error||"Erro.";setAiInsights(p=>({...p,[gid]:text}));await REF.child("aiInsights").child(gid).set(text);}catch(e){setAiInsights(p=>({...p,[gid]:"⚠ Erro ao conectar com a IA."}));}
    setIsLoadingAI(false);
  },[groups,schedules,updates,companies]);

  const curGrp=groups.find(g=>g.id===selectedGroup);
  const TABS=[{id:"dashboard",label:"Dashboard"},{id:"update",label:"Atualização"},{id:"schedule",label:"Cronograma"},{id:"teams",label:"Equipes"},{id:"analysis",label:"Análise IA"}];

  return ce("div",{style:{display:"flex",height:"100vh",overflow:"hidden",fontFamily:"'DM Sans',system-ui,sans-serif",background:"#F5F4F1"}},
    // Sidebar
    ce("nav",{style:{width:215,background:"#fff",display:"flex",flexDirection:"column",flexShrink:0,borderRight:"1px solid #EDEBE6"}},
      ce("div",{style:{padding:"18px 16px 14px",borderBottom:"1px solid #EDEBE6"}},
        ce("div",{style:{fontWeight:700,fontSize:10,letterSpacing:"2.5px",color:"#1C1B18"}},"SOFITEL RJ"),
        ce("div",{style:{fontSize:10,color:"#B8B5AD",marginTop:3,display:"flex",alignItems:"center"}},
          ce("span",{style:{width:6,height:6,borderRadius:"50%",background:connected?"#A8C4B0":"#C48282",display:"inline-block",marginRight:5}}),
          connected?"Online":"Sem conexão"
        )
      ),
      ce("div",{style:{flex:1,overflow:"auto"}},
        // Overview
        ce("div",{style:{padding:"12px 0 4px"}},
          ce("div",{onClick:()=>{setSelectedGroup(null);},style:{display:"flex",alignItems:"center",gap:9,padding:"9px 16px",cursor:"pointer",borderLeft:!selectedGroup?"2px solid #9BB5C8":"2px solid transparent",background:!selectedGroup?"#F5F4F1":"transparent",color:!selectedGroup?"#1C1B18":"#8C8980",fontSize:12,fontWeight:!selectedGroup?700:500,marginBottom:4}},"◈  Visão Geral")
        ),
        // Groups
        ce("div",{style:{padding:"4px 0"}},
          ce("div",{style:{fontSize:9,fontWeight:700,color:"#C4C1BA",letterSpacing:"1.2px",textTransform:"uppercase",padding:"0 16px",marginBottom:4}},"Grupos de Serviço"),
          groups.map(g=>ce("div",{key:g.id,style:{display:"flex",alignItems:"center",padding:"8px 16px",cursor:"pointer",borderLeft:selectedGroup===g.id?"2px solid "+g.color:"2px solid transparent",background:selectedGroup===g.id?"#F5F4F1":"transparent",marginBottom:2}},
            ce("div",{onClick:()=>{setSelectedGroup(g.id);setGroupTab("dashboard");},style:{display:"flex",alignItems:"center",gap:9,flex:1}},
              ce("div",{style:{width:8,height:8,borderRadius:"50%",background:g.color,flexShrink:0}}),
              ce("span",{style:{fontSize:12,fontWeight:selectedGroup===g.id?700:500,color:selectedGroup===g.id?"#1C1B18":"#8C8980",flex:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},g.name)
            )
          )),
          ce("div",{style:{padding:"8px 16px"}},
            ce("button",{onClick:addGroup,style:S.btnAdd},"+ Novo Grupo")
          )
        )
      ),
      // Footer
      ce("div",{style:{padding:"12px 16px",borderTop:"1px solid #EDEBE6",display:"flex",flexDirection:"column",gap:6}},
        ce("button",{onClick:refresh,style:{...S.btnS,fontSize:11,padding:"7px 12px",display:"flex",alignItems:"center",gap:6,justifyContent:"center"}},"🔄 Atualizar dados"),
        curGrp&&ce("div",{style:{fontSize:9,color:curGrp.color,fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginTop:2}},curGrp.name)
      )
    ),
    // Main
    ce("main",{style:{flex:1,overflow:"auto",padding:24,background:"#F5F4F1"}},
      !connected&&ce("div",{style:{background:"#FBF0F0",border:"1px solid #E8C4C4",borderRadius:8,padding:"10px 16px",marginBottom:16,fontSize:12,color:"#C48282",fontWeight:600}},"🔴 Sem conexão com Firebase"),

      // Group view
      selectedGroup&&curGrp?ce("div",null,
        // Header with back + tabs
        ce("div",{style:{marginBottom:20}},
          ce("button",{onClick:()=>setSelectedGroup(null),style:{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:8,border:"1px solid #EDEBE6",background:"#fff",fontSize:12,fontWeight:600,color:"#6C6960",marginBottom:12}},"← Todos os grupos"),
          ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
            ce("div",{style:{display:"flex",alignItems:"center",gap:10}},
              ce("div",{style:{width:12,height:12,borderRadius:"50%",background:curGrp.color}}),
              ce("div",{style:{fontSize:20,fontWeight:700,color:"#1C1B18"}},curGrp.name)
            ),
            ce("div",{style:{display:"flex",gap:8}},
              // Edit group inline
              ce("input",{style:{...S.inp,width:120,padding:"5px 8px",fontSize:11},value:curGrp.envName,onChange:e=>updGroupField(curGrp.id,"envName",e.target.value),placeholder:"Tipo de ambiente"}),
              ce("input",{type:"color",value:curGrp.color,onChange:e=>updGroupField(curGrp.id,"color",e.target.value),style:{width:32,height:32,borderRadius:6,border:"1px solid #E8E5DF",cursor:"pointer",padding:1,background:"transparent"}}),
              ce("button",{onClick:()=>remGroup(curGrp.id),style:S.btnD},"✕ Remover grupo"),
              ce("button",{onClick:saveAll,style:S.btnP},"💾 Salvar tudo")
            )
          ),
          // Tabs
          ce("div",{style:{display:"flex",borderBottom:"1px solid #EDEBE6",marginTop:16}},
            TABS.map(t=>ce("button",{key:t.id,onClick:()=>setGroupTab(t.id),style:{padding:"9px 18px",border:"none",background:"transparent",fontSize:12,fontWeight:700,color:groupTab===t.id?"#1C1B18":"#B8B5AD",borderBottom:groupTab===t.id?`2px solid ${curGrp.color}`:"2px solid transparent",marginBottom:-1,cursor:"pointer"}},t.label))
          )
        ),
        groupTab==="dashboard"&&ce(GroupDashboard,{grp:curGrp,updates,schedules,companies,setTab:setGroupTab}),
        groupTab==="update"&&ce(GroupUpdate,{grp:curGrp,updates,onPushUpdate,companies,schedules,showToast}),
        groupTab==="schedule"&&ce(GroupSchedule,{grp:curGrp,schedules,setSchedules,onSave:saveAll,showToast}),
        groupTab==="teams"&&ce(GroupTeams,{grp:curGrp,companies,setCompanies,onSave:saveAll,showToast}),
        groupTab==="analysis"&&ce(GroupAnalysis,{grp:curGrp,companies,schedules,updates,aiInsights,isLoadingAI,onRunAI})
      )
      // Overview
      :ce(Overview,{groups,updates,schedules,setSelectedGroup}),

      toast&&ce("div",{style:{position:"fixed",bottom:20,right:20,padding:"11px 20px",borderRadius:9,background:"#1C1B18",color:"#fff",fontSize:12,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.15)",zIndex:9999,borderLeft:"3px solid #A8C4B0"}},toast)
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(ce(App));
</script>
</body>
</html>
