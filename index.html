    setNewTeam({ name:"Equipe B", people:3, productivity:5, assignedFloors:[] }); setEditCo(null);
  };

    const team = lCo.find(c=>c.id===coId)?.teams.find(t=>t.id===tId);

          ),
          React.createElement("button", { style:S.btnP, onClick:addCo }, "Adicionar")

            React.createElement("div", null, React.createElement("label", { style:S.label }, "Nº Pessoas"),     React.createElement("input", { style:S.input, type:"number", min:"1", value:team.people, onChange:e=>updT(co.id,team.id,"people",+e.target.value) })),
            React.createElement("div", null, React.createElement("label", { style:S.label }, "Dias/Banheiro"),  React.createElement("input", { style:S.input, type:"number", min:"1", value:team.productivity, onChange:e=>updT(co.id,team.id,"productivity",+e.target.value) }))
          ),
          React.createElement("div", { style:{ marginBottom:8 } },
            React.createElement("label", { style:S.label }, "Andares Atribuídos"),
            React.createElement("div", { style:{ display:"flex", flexWrap:"wrap", gap:4 } },
              FLOORS.map(f => React.createElement("button", { key:f, onClick:()=>togFlr(co.id,team.id,f), style:{ padding:"3px 9px", borderRadius:5, border:"none", fontSize:11, fontWeight:700, background:team.assignedFloors.includes(f)?co.color:"#1e2d3d", color:team.assignedFloors.includes(f)?"#080f18":"#64748b" } }, f+"°"))
            )
          ),
          React.createElement("div", { style:{ fontSize:11, color:"#475569", marginBottom:8 } }, "Meta diária: "+(1/team.productivity).toFixed(2)+" banh/dia · "+team.people+" pessoas"),
          React.createElement("button", { style:S.btnD, onClick:()=>remT(co.id,team.id) }, "✕ Remover equipe")
        )),
        editCo===co.id
          ? React.createElement("div", { style:{ background:"rgba(14,165,233,0.06)", borderRadius:9, padding:12, border:"1px solid rgba(14,165,233,0.2)" } },
              React.createElement("p", { style:{...S.h3, color:"#38bdf8"} }, "Nova Equipe"),
              React.createElement("div", { style:{...S.grid3, marginBottom:10} },
                React.createElement("div", null, React.createElement("label", { style:S.label }, "Nome"),         React.createElement("input", { style:S.input, placeholder:"Equipe B", value:newTeam.name, onChange:e=>setNewTeam(p=>({...p,name:e.target.value})) })),
                React.createElement("div", null, React.createElement("label", { style:S.label }, "Nº Pessoas"),   React.createElement("input", { style:S.input, type:"number", min:"1", value:newTeam.people, onChange:e=>setNewTeam(p=>({...p,people:+e.target.value})) })),
                React.createElement("div", null, React.createElement("label", { style:S.label }, "Dias/Banheiro"),React.createElement("input", { style:S.input, type:"number", min:"1", value:newTeam.productivity, onChange:e=>setNewTeam(p=>({...p,productivity:+e.target.value})) }))
              ),
              React.createElement("div", { style:{ display:"flex", gap:8 } },
                React.createElement("button", { style:S.btnP, onClick:()=>addT(co.id) }, "Salvar"),
                React.createElement("button", { style:S.btnS, onClick:()=>setEditCo(null) }, "Cancelar")
              )
            )
          : React.createElement("button", { style:S.btnS, onClick:()=>setEditCo(co.id) }, "+ Nova Equipe")
      ))
    ),

    tab==="schedule" && React.createElement("div", { style:S.grid2 },
      FLOORS.map(fl => {
        const sc = lSc[fl]||{};
        const co = lCo.find(c=>c.teams.some(t=>t.assignedFloors.includes(fl)));

function UpdateView({ updates, onPushUpdate, companies, schedule, progress, showToast }) {
  const [form, setForm] = useState({ date:TODAY, floor:5, room:1, teamId:"", completedActivities:[], causes:{ Piso:"", Parede:"", Bancada:"" } });
  const allTeams = companies.flatMap(co => co.teams.map(t=>({...t,coName:co.name,coColor:co.color})));
  const roomCount = schedule[form.floor]?.roomCount || 10;
  const alreadyDone = act => !!progress.completed[`${form.floor}_${form.room}_${act}`];
  const toggleAct   = act => setForm(p => ({ ...p, completedActivities: p.completedActivities.includes(act) ? p.completedActivities.filter(a=>a!==act) : [...p.completedActivities, act] }));
  const actColors   = { Piso:"#38bdf8", Parede:"#34d399", Bancada:"#a78bfa" };

  const submit = async () => {
    const notDone = ACTIVITIES.filter(a => !form.completedActivities.includes(a) && !alreadyDone(a));
    await onPushUpdate({
      id: `u${Date.now()}`, date: form.date, floor: form.floor, room: form.room,
      teamId: form.teamId || allTeams[0]?.id || "",
      completedActivities: form.completedActivities,
      notCompleted: notDone.map(a => ({ activity:a, cause:form.causes[a]||"" })),
      cause: notDone.find(a => form.causes[a]) ? form.causes[notDone.find(a=>form.causes[a])] : null,
      ts: Date.now()
    });
    setForm(p => ({ ...p, room:Math.min(p.room+1,roomCount), completedActivities:[], causes:{Piso:"",Parede:"",Bancada:""} }));
    showToast("✅ Registro salvo e sincronizado!");
  };

  const floorCo = companies.find(c=>c.teams.some(t=>t.assignedFloors.includes(form.floor)));

  return React.createElement("div", null,
    React.createElement("div", { style:{ fontSize:18, fontWeight:800, color:"#f1f5f9", marginBottom:4 } }, "Atualização Diária"),
    React.createElement("p", { style:{ fontSize:11, color:"#475569", marginBottom:20 } }, "Preencha ao final do turno · Dados salvos em tempo real"),
    React.createElement("div", { style:S.grid2 },
      React.createElement("div", { style:S.card },
        React.createElement("p", { style:S.h3 }, "Dados do Registro"),
        React.createElement("div", { style:{...S.grid2, marginBottom:12} },
          React.createElement("div", null, React.createElement("label", { style:S.label }, "Data"),
            React.createElement("input", { style:S.input, type:"date", value:form.date, onChange:e=>setForm(p=>({...p,date:e.target.value})) })
          ),
          React.createElement("div", null, React.createElement("label", { style:S.label }, "Pavimento"),
            React.createElement("select", { style:S.input, value:form.floor, onChange:e=>setForm(p=>({...p,floor:+e.target.value,room:1})) },
              FLOORS.map(f => React.createElement("option", { key:f, value:f }, f+"° Pavimento"))
            )
          ),
          React.createElement("div", null, React.createElement("label", { style:S.label }, "Banheiro Nº"),
            React.createElement("select", { style:S.input, value:form.room, onChange:e=>setForm(p=>({...p,room:+e.target.value})) },
              Array.from({length:roomCount},(_,i)=>i+1).map(r => React.createElement("option", { key:r, value:r }, "Banheiro "+r))
            )
          ),
          React.createElement("div", null, React.createElement("label", { style:S.label }, "Equipe"),
            React.createElement("select", { style:S.input, value:form.teamId||allTeams[0]?.id||"", onChange:e=>setForm(p=>({...p,teamId:e.target.value})) },
              allTeams.map(t => React.createElement("option", { key:t.id, value:t.id }, t.coName+" · "+t.name+" ("+t.people+"p)"))
            )
          )
        ),
        React.createElement("div", { style:{ marginBottom:18 } },
          React.createElement("label", { style:{...S.label,marginBottom:12} }, "Atividades do Dia"),

// ══════════════════════════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════════════════════════
function App() {
  const [view, setView]           = useState("dashboard");
  const [companies, setCompanies] = useState(INIT_COMPANIES);
  const [schedule, setSchedule]   = useState(genSchedule);
  const [updates, setUpdates]     = useState([]);
  const [aiInsights, setAiInsights] = useState("");
  const [isLoadingAI, setIsLoadingAI] = useState(false);
  const [connected, setConnected] = useState(false);
  const [toast, setToast]         = useState(null);
  const [connCount, setConnCount] = useState(0);

  // ── Firebase real-time listeners ──
  useEffect(() => {
    const ref = REF;
    ref.on("value", snap => {
      const d = snap.val();
      if (!d) {
        // First run: write initial data
        REF.set({ companies: INIT_COMPANIES, schedule: genSchedule(), updates: {}, aiInsights: "" });
      } else {
        if (d.companies) setCompanies(Array.isArray(d.companies) ? d.companies : Object.values(d.companies));
        if (d.schedule)  setSchedule(d.schedule);
        if (d.updates)   setUpdates(Object.values(d.updates).sort((a,b) => (a.date||"") > (b.date||"") ? 1 : -1));
        if (d.aiInsights) setAiInsights(d.aiInsights);
      }
      setConnected(true);
      // Hide splash
      const splash = document.getElementById("splash");
      if (splash) splash.classList.add("hide");
      setTimeout(() => { if (splash) splash.remove(); }, 500);
    }, err => {
      console.error("Firebase error:", err);
      setConnected(false);
    });
    // Connected users count (optional)
    const connRef = db.ref(".info/connected");
    connRef.on("value", snap => { if (snap.val()) setConnCount(c => c + 1); });
    return () => { ref.off(); connRef.off(); };
  }, []);

  const showToast = useCallback(msg => { setToast(msg); setTimeout(()=>setToast(null), 3500); }, []);

  // ── Firebase write functions ──
  const saveCompanies = useCallback(c  => REF.child("companies").set(c), []);
  const saveSchedule  = useCallback(s  => REF.child("schedule").set(s), []);
  const pushUpdate    = useCallback(u  => REF.child("updates").push(u), []);
  const saveAI        = useCallback(ai => REF.child("aiInsights").set(ai), []);

  // ── Progress computation ──
  const progress = useMemo(() => {
    const completed = {};
    updates.forEach(u => (u.completedActivities||[]).forEach(act => {
      const k = `${u.floor}_${u.room}_${act}`;
      if (!completed[k] || u.date > completed[k]) completed[k] = u.date;
    }));
    const floorStats = {};
    FLOORS.forEach(fl => {
      const sc  = schedule[fl]||{};
      const rc  = sc.roomCount||10;
      let dA=0, dR=0;
      for (let r=1;r<=rc;r++) { const d=ACTIVITIES.filter(a=>completed[`${fl}_${r}_${a}`]); dA+=d.length; if(d.length===3)dR++; }
      const tot = rc*3;
      const el  = Math.max(0, diffD(sc.startDate||TODAY, TODAY));
      const td  = Math.max(1, diffD(sc.startDate||TODAY, sc.endDate||fmt(addD(new Date(),90))));
      const pPct = Math.min(100, (el/td)*100);
      const aPct = tot>0?(dA/tot)*100:0;
      floorStats[fl] = { roomCount:rc, doneRooms:dR, doneActs:dA, total:tot, plannedPct:pPct, actualPct:aPct, variance:aPct-pPct, startDate:sc.startDate, endDate:sc.endDate };
    });
    const totals = FLOORS.reduce((acc,f)=>{ const s=floorStats[f]; acc.doneActs+=s.doneActs; acc.totalActs+=s.total; acc.doneRooms+=s.doneRooms; acc.totalRooms+=s.roomCount; return acc; }, {doneActs:0,totalActs:0,doneRooms:0,totalRooms:0});
    return { completed, floorStats, totals };
  }, [updates, schedule]);

  // ── Chart data ──
  const chartData = useMemo(() => {
    const dates = [...new Set(updates.map(u=>u.date))].sort();
    const base  = dates[0]||TODAY;
    const data  = [];
    for (let i=0; i<=diffD(base, fmt(addD(new Date(),35))); i++) {
      const date   = fmt(addD(new Date(base), i));
      const isPast = date<=TODAY;
      let planned  = 0;
      FLOORS.forEach(fl => { const sc=schedule[fl]; if(!sc||date<sc.startDate) return; const el=Math.max(0,diffD(sc.startDate,date)); const td=Math.max(1,diffD(sc.startDate,sc.endDate)); planned+=Math.min((sc.roomCount||10)*3,(el/td)*(sc.roomCount||10)*3); });
      const entry = { date:date.slice(5), planned:Math.round(planned) };
      if (isPast) entry.actual = Object.entries(progress.completed).filter(([_,d])=>d<=date).length;
      if (!isPast && dates.length>=2) { const la=Object.keys(progress.completed).length; const rate=Math.max(0,la/Math.max(1,diffD(dates[0],TODAY))); entry.trend=Math.round(la+rate*diffD(TODAY,date)); }
      data.push(entry);
    }
    return data;
  }, [updates, schedule, progress]);

  // ── AI Analysis ──
  const runAI = useCallback(async () => {
    setIsLoadingAI(true);
    const prompt = `Você é um consultor sênior de gestão de obras hoteleiras de alto padrão.

OBRA: Hotel Sofitel Rio de Janeiro — Instalação de Pedras (Piso, Parede, Bancada)
ANDARES: 5° ao 20° | DATA: ${TODAY}

EMPRESAS E EQUIPES:
${companies.map(co=>`• ${co.name}: ${co.teams.map(t=>`${t.name} — ${t.people} pessoas, ${t.productivity} dias/banheiro, andares: [${t.assignedFloors.join(",")}]`).join(" | ")}`).join("\n")}

PROGRESSO POR ANDAR:
${FLOORS.map(f=>{ const s=progress.floorStats[f]; const co=companies.find(c=>c.teams.some(t=>t.assignedFloors.includes(f))); return `• ${f}° (${co?.name||"—"}): Real ${s.actualPct.toFixed(1)}% | Plan ${s.plannedPct.toFixed(1)}% | Var ${s.variance>0?"+":""}${s.variance.toFixed(1)}% | ${s.doneRooms}/${s.roomCount} banh.`; }).join("\n")}

TOTAL: ${progress.totals.doneRooms}/${progress.totals.totalRooms} banheiros | ${progress.totals.totalActs>0?((progress.totals.doneActs/progress.totals.totalActs)*100).toFixed(1):0}% das atividades

ÚLTIMAS OCORRÊNCIAS:
${updates.slice(-10).map(u=>`${u.date} | ${u.floor}° B.${u.room} | ✓ ${u.completedActivities?.join(",")||"-"}${u.cause?" | ⚠ "+u.cause:""}`).join("\n")||"Nenhuma ainda"}

Forneça:
1. 🔴🟡🟢 STATUS GERAL (2-3 frases)
2. ⚠️ ALERTAS — andares e equipes em risco (bullets)
3. 📈 TENDÊNCIA — se continuar assim, qual o novo prazo projetado?
4. ✅ AÇÕES IMEDIATAS — o que o gerente deve fazer hoje/amanhã (bullets práticos)
5. 🔄 REALOCAÇÃO — quem está adiantado e pode reforçar quem está atrasado (específico)
6. 🎯 META DIÁRIA — atividades mínimas por equipe para manter o cronograma

Direto, executivo, acionável. Para o CEO. Em português.`;

    try {
      const res  = await fetch("/api/analyze", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ prompt }) });
      const data = await res.json();
      const text = data.content?.find(b=>b.type==="text")?.text || data.error || "Erro ao gerar análise.";
      setAiInsights(text);
      await saveAI(text);
    } catch(e) {
      const msg = "Erro ao conectar com a IA. Verifique se o servidor está configurado corretamente (/api/analyze).";
      setAiInsights(msg);
    }
    setIsLoadingAI(false);
  }, [companies, progress, schedule, updates, saveAI]);

  const NAV = [
    { id:"dashboard", icon:"📊", label:"Dashboard" },
    { id:"config",    icon:"⚙️", label:"Configurações" },
    { id:"update",    icon:"📝", label:"Atualização" },
    { id:"analysis",  icon:"🤖", label:"Análise IA" },
  ];

  return React.createElement("div", { style:{ display:"flex", height:"100vh", overflow:"hidden" } },
    // Sidebar
    React.createElement("nav", { style:{ width:200, background:"#060d15", display:"flex", flexDirection:"column", flexShrink:0, borderRight:"1px solid #0f1923" } },
      React.createElement("div", { style:{ padding:"20px 16px 18px", borderBottom:"1px solid #0f1923" } },
        React.createElement("div", { style:{ color:"#f1f5f9", fontWeight:900, fontSize:11, letterSpacing:"2.5px", fontFamily:"'Sora',sans-serif" } }, "SOFITEL RJ"),
        React.createElement("div", { style:{ color:"#1e2d3d", fontSize:10, marginTop:3, fontWeight:600 } }, "Instalação de Pedras"),
        React.createElement("div", { style:{ marginTop:8, fontSize:10, display:"flex", alignItems:"center" } },
          connected
            ? React.createElement("span", { className:"online-dot" })
            : React.createElement("span", { className:"offline-dot" }),
          React.createElement("span", { style:{ color:connected?"#34d399":"#ef4444" } }, connected?"Online":"Sem conexão")
        )
      ),
      React.createElement("div", { style:{ padding:"8px 0", flex:1 } },
        NAV.map(n => React.createElement("div", { key:n.id, onClick:()=>setView(n.id), style:{ display:"flex", alignItems:"center", gap:9, padding:"11px 16px", cursor:"pointer", borderLeft:view===n.id?"3px solid #0ea5e9":"3px solid transparent", background:view===n.id?"#0f1923":"transparent", color:view===n.id?"#f1f5f9":"#475569", fontSize:12, fontWeight:view===n.id?700:500, marginBottom:2 } },
          React.createElement("span", { style:{ fontSize:14 } }, n.icon), n.label
        ))
      ),
      React.createElement("div", { style:{ padding:"14px 16px", borderTop:"1px solid #0f1923" } },
        React.createElement("div", { style:{ fontSize:9, color:"#1e2d3d", textTransform:"uppercase", letterSpacing:"1px", marginBottom:4, fontWeight:700 } }, "Progresso Total"),
        React.createElement("div", { style:{ fontSize:20, fontWeight:900, color:"#38bdf8", fontFamily:"'Sora',sans-serif" } },
          progress.totals.totalActs>0?(progress.totals.doneActs/progress.totals.totalActs*100).toFixed(0):0,"%"
        ),
        React.createElement("div", { style:{ background:"#0f1923", borderRadius:3, height:3, marginTop:6 } },
          React.createElement("div", { style:{ width:(progress.totals.totalActs>0?(progress.totals.doneActs/progress.totals.totalActs*100):0)+"%", background:"#38bdf8", height:3, borderRadius:3 } })
        ),
        React.createElement("div", { style:{ fontSize:9, color:"#1e2d3d", marginTop:4 } }, updates.length+" registros · "+progress.totals.doneRooms+"/"+progress.totals.totalRooms+" banh.")
      )
    ),

    // Main content
    React.createElement("main", { style:{ flex:1, overflow:"auto", padding:24, background:"#0b1220" } },
      !connected && React.createElement("div", { style:{ background:"rgba(239,68,68,0.1)", border:"1px solid rgba(239,68,68,0.3)", borderRadius:8, padding:"10px 16px", marginBottom:16, fontSize:12, color:"#ef4444", fontWeight:600 } },
        "🔴 Sem conexão com Firebase — verifique a configuração no arquivo index.html"
      ),
      view==="dashboard" && React.createElement(DashboardView, { progress, chartData, companies, setView, aiInsights }),
      view==="config"    && React.createElement(ConfigView, { companies, schedule, onSaveCompanies:saveCompanies, onSaveSchedule:saveSchedule, showToast }),
      view==="update"    && React.createElement(UpdateView, { updates, onPushUpdate:pushUpdate, companies, schedule, progress, showToast }),
      view==="analysis"  && React.createElement(AnalysisView, { companies, schedule, updates, progress, aiInsights, isLoadingAI, onRunAI:runAI })
    ),

    // Toast
    toast && React.createElement("div", { style:{ position:"fixed", bottom:20, right:20, padding:"11px 20px", borderRadius:9, background:"#0f1923", color:"#f1f5f9", fontSize:12, fontWeight:700, boxShadow:"0 8px 32px rgba(0,0,0,0.5)", zIndex:9999, borderLeft:"3px solid #34d399" } }, toast)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
