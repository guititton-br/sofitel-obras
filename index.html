// ── Line Chart ──
function LineChart({data,color,height}){
  const h=height||220;
  if(!data||data.length<2) return ce("div",{style:{height:h,display:"flex",alignItems:"center",justifyContent:"center",color:"#B8B5AD",fontSize:12}},"Registre avanços para ver o gráfico");
  const W=720,H=h-30,pL=40,pR=20,pT=10,pB=24,cW=W-pL-pR,cH=H-pT-pB;
  const allV=data.flatMap(d=>[d.planned,d.actual,d.trend].filter(v=>v!==undefined));
  const maxV=Math.max(...allV,1);
  const xp=i=>pL+(i/(data.length-1))*cW;
  const yp=v=>pT+cH-(v/maxV)*cH;
  const mkLine=(key,stroke,dash,sw)=>{
    const pts=data.map((d,i)=>({v:d[key],i})).filter(p=>p.v!==undefined);
    if(pts.length<2)return null;
    return ce("path",{key,d:pts.map((p,j)=>`${j===0?"M":"L"} ${xp(p.i).toFixed(1)} ${yp(p.v).toFixed(1)}`).join(" "),stroke,strokeWidth:sw||2,fill:"none",strokeDasharray:dash||"none"});
  };
  const step=Math.max(1,Math.floor(data.length/9));
  const todayI=data.findLastIndex(d=>d.actual!==undefined);
  return ce("div",null,
    ce("svg",{viewBox:`0 0 ${W} ${H+20}`,style:{width:"100%",height:h}},
      [0,.25,.5,.75,1].map((p,i)=>ce("line",{key:i,x1:pL,x2:W-pR,y1:(pT+cH*(1-p)).toFixed(1),y2:(pT+cH*(1-p)).toFixed(1),stroke:"#F0EDE8",strokeWidth:1})),
      mkLine("planned","#D6D3CC","6,4",1.5),
      mkLine("actual",color||"#9BB5C8",null,2.5),
      mkLine("trend","#C4A882","4,3",2),
      todayI>=0&&ce("line",{key:"td",x1:xp(todayI),x2:xp(todayI),y1:pT,y2:pT+cH,stroke:"#E8C4C4",strokeWidth:1.5,strokeDasharray:"4,3"}),
      todayI>=0&&ce("text",{key:"tdl",x:xp(todayI)+3,y:pT+10,fontSize:8,fill:"#C48282",fontFamily:"system-ui"},"Hoje"),
      data.filter((_,i)=>i%step===0).map((d,i)=>ce("text",{key:"x"+i,x:xp(data.indexOf(d)).toFixed(1),y:H+14,textAnchor:"middle",fontSize:9,fill:"#C4C1BA",fontFamily:"system-ui"},d.date)),
      [0,Math.round(maxV/2),maxV].map((v,i)=>ce("text",{key:"y"+i,x:pL-3,y:yp(v)+3,textAnchor:"end",fontSize:9,fill:"#C4C1BA",fontFamily:"system-ui"},v+"%"))
    ),
    ce("div",{style:{display:"flex",gap:20,marginTop:6}},
      [["#D6D3CC","Planejado"],[color||"#9BB5C8","Realizado"],["#C4A882","Tendência"]].map(([c,l])=>
        ce("div",{key:l,style:{display:"flex",alignItems:"center",gap:5,fontSize:10,color:"#8C8980"}},
          ce("div",{style:{width:22,height:2,background:c,borderRadius:1}}),l
        )
      )
    )
  );
}

// ── Progress computation ──
function computeProgress(updates,schedules,groupId){
  const grpUpd=updates[groupId]||[],sched=schedules[groupId]||{};
  // acc[floor][room][env] = %
  const acc={};
  grpUpd.forEach(u=>{
    if(!acc[u.floor])acc[u.floor]={};
    if(!acc[u.floor][u.room])acc[u.floor][u.room]={};
    const env=u.environment||"Ambiente";
    acc[u.floor][u.room][env]=(acc[u.floor][u.room][env]||0)+(u.actualPct||0);
  });
  const floorStats={};
  FLOORS.forEach(fl=>{
    const sc=sched[fl]||{},rc=sc.roomCount||12;
    let sumPct=0,doneRooms=0,totalEnvs=0;
    const rooms={};
    for(let r=1;r<=rc;r++){
      const envs=acc[fl]?.[r]||{};
      const envKeys=Object.keys(envs);
      if(envKeys.length===0){rooms[r]={envs:{},avgPct:0,done:false};continue;}
      let rSum=0;
      const envData={};
      envKeys.forEach(e=>{const p=Math.min(100,envs[e]);envData[e]=p;rSum+=p;totalEnvs++;});
      const avgR=rSum/envKeys.length;
      rooms[r]={envs:envData,avgPct:Math.round(avgR),done:avgR>=100};
      sumPct+=avgR;
      if(avgR>=100)doneRooms++;
    }
    const el=Math.max(0,diffD(sc.startDate||TODAY,TODAY));
    const td=Math.max(1,diffD(sc.startDate||TODAY,sc.endDate||fmt(addD(new Date(),90))));
    const plannedPct=Math.min(100,(el/td)*100);
    const actualPct=rc>0?sumPct/rc:0;
    floorStats[fl]={roomCount:rc,doneRooms,plannedPct,actualPct,variance:actualPct-plannedPct,rooms,startDate:sc.startDate,endDate:sc.endDate};
  });
  const totals=FLOORS.reduce((a,f)=>{const s=floorStats[f];a.done+=s.doneRooms;a.total+=s.roomCount;a.sumPct+=s.actualPct;return a;},{done:0,total:0,sumPct:0});
  return {acc,floorStats,totals};
}

// ── Chart data ──
function computeChartData(updates,schedules,groupId,filterFloor){
  const grpUpd=updates[groupId]||[],sched=schedules[groupId]||{};
  const filtered=filterFloor?grpUpd.filter(u=>u.floor===filterFloor):grpUpd;
  const dates=[...new Set(filtered.map(u=>u.date))].sort();
  const base=dates[0]||TODAY;
  const floors=filterFloor?[filterFloor]:FLOORS;
  const data=[];
  for(let i=0;i<=diffD(base,fmt(addD(new Date(),35)));i++){
    const date=fmt(addD(new Date(base),i)),isPast=date<=TODAY;
    let planned=0;
    floors.forEach(fl=>{const sc=sched[fl];if(!sc||date<sc.startDate)return;const el=Math.max(0,diffD(sc.startDate,date));const td=Math.max(1,diffD(sc.startDate,sc.endDate));planned+=(el/td)*100;});
    const avgP=floors.length>0?planned/floors.length:0;
    const entry={date:date.slice(5),planned:Math.round(avgP)};
    if(isPast){
      const acc={};
      filtered.filter(u=>u.date<=date).forEach(u=>{const k=`${u.floor}_${u.room}_${u.environment||"A"}`;acc[k]=(acc[k]||0)+(u.actualPct||0);});
      const vals=Object.values(acc).map(v=>Math.min(100,v));
      entry.actual=vals.length>0?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
    }
    if(!isPast&&dates.length>=2){
      const lastActs=data.filter(d=>d.actual!==undefined);
      if(lastActs.length>=2){const la=lastActs[lastActs.length-1].actual,rate=la/Math.max(1,diffD(dates[0],TODAY));entry.trend=Math.min(100,Math.round(la+rate*diffD(TODAY,date)));}
    }
    data.push(entry);
  }
  return data;
}

// ── Get unit target ──
function getUnitTarget(grpUpd,floor,room,env,daysPerUnit){
  const base=Math.round(100/Math.max(1,daysPerUnit));
  const unitUpd=grpUpd.filter(u=>u.floor===floor&&u.room===room&&(u.environment||"Ambiente")===env);
  const totalP=unitUpd.reduce((s,u)=>s+(u.targetPct||0),0);
  const totalA=unitUpd.reduce((s,u)=>s+(u.actualPct||0),0);
  const accumulated=Math.min(100,totalA);
  const remaining=100-accumulated;
  if(remaining<=0)return{target:0,accumulated:100,remaining:0,carryover:0,done:true};
  const carryover=Math.max(0,totalP-totalA);
  return{target:Math.min(remaining,Math.round(base+carryover)),accumulated:Math.round(accumulated),remaining:Math.round(remaining),carryover:Math.round(carryover),done:false};
}

// ── Team schedule info for a floor ──
function getFloorTeams(companies,floor){
  return companies.flatMap(co=>co.teams.filter(t=>(t.assignedFloors||[]).includes(floor)).map(t=>({...t,coName:co.name,coColor:co.color})));
}
function calcFloorDailyCapacity(teams,roomCount){
  // capacity = sum(1/daysPerUnit) environments per day
  const cap=teams.reduce((s,t)=>s+(1/Math.max(1,t.daysPerUnit||4)),0);
  const daysNeeded=roomCount/Math.max(0.001,cap);
  return{cap:cap.toFixed(2),daysNeeded:Math.round(daysNeeded)};
}

// ══════════ UPDATE VIEW ══════════
function UpdateView({groups,currentGroupId,setCurrentGroupId,updates,onPushUpdate,companies,schedules,showToast}){
  const grp=groups.find(g=>g.id===currentGroupId)||groups[0];
  const sched=schedules[grp?.id]||{},grpUpd=updates[grp?.id]||[];
  const allTeams=companies.flatMap(co=>co.teams.map(t=>({...t,coName:co.name,coColor:co.color})));

  const [form,setForm]=useState({date:TODAY,floor:5,room:1,environment:"",teamId:""});
  const [hitTarget,setHitTarget]=useState(null);
  const [actualPct,setActualPct]=useState("");
  const [cause,setCause]=useState("");

  const rc=sched[form.floor]?.roomCount||12;
  const selTeam=allTeams.find(t=>t.id===form.teamId)||allTeams[0];
  const dpu=selTeam?.daysPerUnit||3;
  const env=form.environment||grp?.envName||"Ambiente";
  const unitInfo=useMemo(()=>getUnitTarget(grpUpd,form.floor,form.room,env,dpu),[grpUpd,form.floor,form.room,env,dpu]);

  // Autocomplete envs from previous entries
  const knownEnvs=useMemo(()=>[...new Set(grpUpd.map(u=>u.environment).filter(Boolean))],[grpUpd]);

  const reset=()=>{setHitTarget(null);setActualPct("");setCause("");};
  const handleChange=(field,val)=>{setForm(p=>({...p,[field]:val}));if(field!=="date"&&field!=="teamId")reset();};
  const handleHit=v=>{setHitTarget(v);if(v){setActualPct(String(unitInfo.target));setCause("");}else setActualPct("");};
  const canSave=hitTarget===true||(hitTarget===false&&actualPct!==""&&cause!=="");

  const submit=async()=>{
    const ap=hitTarget?unitInfo.target:Math.min(unitInfo.remaining,Math.max(0,+actualPct));
    await onPushUpdate(grp.id,{id:`u${Date.now()}`,date:form.date,floor:form.floor,room:form.room,environment:env,teamId:form.teamId||allTeams[0]?.id||"",targetPct:unitInfo.target,actualPct:ap,hitTarget:hitTarget===true,cause:hitTarget?null:cause,ts:Date.now()});
    const ni=getUnitTarget([...grpUpd,{floor:form.floor,room:form.room,environment:env,targetPct:unitInfo.target,actualPct:ap}],form.floor,form.room,env,dpu);
    if(ni.done){const nr=Math.min(form.room+1,rc);setForm(p=>({...p,room:nr,environment:""}));}
    reset();
    showToast("✅ Avanço registrado!");
  };

  return ce("div",null,
    ce("div",{style:{fontSize:18,fontWeight:700,color:"#1C1B18",marginBottom:4}},"Atualização Diária"),
    ce("p",{style:{fontSize:11,color:"#B8B5AD",marginBottom:14}},"Meta calculada por efetivo e cronograma · Atraso carrega automaticamente para o próximo dia"),
    ce("div",{style:{display:"flex",gap:7,marginBottom:18,flexWrap:"wrap"}},
      groups.map(g=>ce("button",{key:g.id,onClick:()=>{setCurrentGroupId(g.id);reset();},style:{padding:"5px 14px",borderRadius:20,border:`1px solid ${currentGroupId===g.id?g.color:"#EDEBE6"}`,background:currentGroupId===g.id?g.color+"22":"#fff",fontSize:11,fontWeight:600,color:currentGroupId===g.id?g.color:"#8C8980"}},g.name))
    ),
    ce("div",{style:S.g2},
      ce("div",{style:{display:"flex",flexDirection:"column",gap:14}},
        ce("div",{style:S.card},
          ce("p",{style:S.h3},"Identificação"),
          ce("div",{style:{...S.g2,marginBottom:10}},
            ce("div",null,ce("label",{style:S.lbl},"Data"),ce("input",{style:S.inp,type:"date",value:form.date,onChange:e=>handleChange("date",e.target.value)})),
            ce("div",null,ce("label",{style:S.lbl},"Equipe"),ce("select",{style:S.inp,value:form.teamId||allTeams[0]?.id||"",onChange:e=>handleChange("teamId",e.target.value)},allTeams.map(t=>ce("option",{key:t.id,value:t.id},t.coName+" · "+t.name+" ("+t.daysPerUnit+"d/amb)"))))
          ),
          ce("div",{style:S.g3},
            ce("div",null,ce("label",{style:S.lbl},"Pavimento"),ce("select",{style:S.inp,value:form.floor,onChange:e=>handleChange("floor",+e.target.value)},FLOORS.map(f=>ce("option",{key:f,value:f},f+"° Pavimento")))),
            ce("div",null,ce("label",{style:S.lbl},"Quarto Nº"),ce("select",{style:S.inp,value:form.room,onChange:e=>handleChange("room",+e.target.value)},Array.from({length:rc},(_,i)=>i+1).map(r=>ce("option",{key:r,value:r},"Quarto "+r)))),
            ce("div",null,
              ce("label",{style:S.lbl},"Ambiente"),
              ce("input",{style:S.inp,list:"envs-list",value:form.environment,onChange:e=>handleChange("environment",e.target.value),placeholder:grp?.envName||"Banheiro, Quarto..."}),
              ce("datalist",{id:"envs-list"},knownEnvs.map(e=>ce("option",{key:e,value:e})))
            )
          )
        ),
        ce("div",{style:{...S.card,border:`1.5px solid ${grp?.color||"#9BB5C8"}22`,background:(grp?.color||"#9BB5C8")+"06"}},
          unitInfo.done
          ? ce("div",{style:{textAlign:"center",padding:"12px 0"}},
              ce("div",{style:{fontSize:24,marginBottom:6}},"✅"),
              ce("div",{style:{fontWeight:700,color:"#7AAE90",fontSize:14}},"Ambiente concluído!"),
              ce("div",{style:{fontSize:11,color:"#B8B5AD",marginTop:2}}),"Quarto "+form.room+" · "+env+" no "+form.floor+"° está 100% completo"
            )
          : ce("div",null,
              ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}},
                ce("div",null,
                  ce("div",{style:{fontSize:10,color:"#B8B5AD",marginBottom:2}},"Meta de hoje — Q"+form.room+" · "+env),
                  ce("div",{style:{fontSize:32,fontWeight:800,color:grp?.color||"#9BB5C8",lineHeight:1}},unitInfo.target+"%"),
                  unitInfo.carryover>0&&ce("div",{style:{fontSize:10,color:"#C4A882",marginTop:2}},"⚠ inclui "+unitInfo.carryover+"% de atraso anterior")
                ),
                ce("div",{style:{textAlign:"right"}},
                  ce("div",{style:{fontSize:10,color:"#B8B5AD"}},"Já executado"),
                  ce("div",{style:{fontSize:22,fontWeight:700,color:unitInfo.accumulated>50?"#9BB5C8":"#C4A882"}},unitInfo.accumulated+"%"),
                  ce("div",{style:{fontSize:10,color:"#B8B5AD"}},"Restante: "+unitInfo.remaining+"%")
                )
              ),
              ce("div",{style:{background:"#E8E5DF",borderRadius:6,height:8,marginBottom:16}},
                ce("div",{style:{width:unitInfo.accumulated+"%",background:unitInfo.accumulated>50?"#9BB5C8":"#C4A882",height:8,borderRadius:6}})
              ),
              ce("p",{style:{...S.h3,marginBottom:10}},"A meta foi atingida hoje?"),
              ce("div",{style:{display:"flex",gap:10,marginBottom:hitTarget===false?14:0}},
                ce("button",{onClick:()=>handleHit(true),style:{flex:1,padding:"12px",borderRadius:10,border:`2px solid ${hitTarget===true?"#7AAE90":"#E8E5DF"}`,background:hitTarget===true?"#7AAE90":"#fff",color:hitTarget===true?"#fff":"#6C6960",fontSize:13,fontWeight:700}},"✓  Sim, atingida"),
                ce("button",{onClick:()=>handleHit(false),style:{flex:1,padding:"12px",borderRadius:10,border:`2px solid ${hitTarget===false?"#C48282":"#E8E5DF"}`,background:hitTarget===false?"#C48282":"#fff",color:hitTarget===false?"#fff":"#6C6960",fontSize:13,fontWeight:700}},"✗  Não, parcial")
              ),
              hitTarget===false&&ce("div",{style:{background:"#FBF0F0",borderRadius:10,padding:"12px",border:"1px solid #F0D0D0"}},
                ce("div",{style:{...S.g2,marginBottom:10}},
                  ce("div",null,
                    ce("label",{style:{...S.lbl,color:"#C48282"}},"Executado hoje (%)"),
                    ce("input",{style:{...S.inp,borderColor:"#E8C4C4"},type:"number",min:"0",max:unitInfo.remaining,placeholder:"ex: 20",value:actualPct,onChange:e=>setActualPct(e.target.value)})
                  ),
                  actualPct&&ce("div",{style:{display:"flex",flexDirection:"column",justifyContent:"flex-end"}},
                    ce("div",{style:{fontSize:10,color:"#C4A882"}},"Atraso do dia"),
                    ce("div",{style:{fontSize:20,fontWeight:700,color:"#C48282"}},(unitInfo.target-Math.min(unitInfo.target,+actualPct||0))+"%"),
                    ce("div",{style:{fontSize:10,color:"#B8B5AD"}},"→ carrega amanhã")
                  )
                ),
                ce("label",{style:{...S.lbl,color:"#C48282"}},"Causa do não cumprimento"),
                ce("select",{style:{...S.inp,borderColor:"#E8C4C4"},value:cause,onChange:e=>setCause(e.target.value)},
                  ce("option",{value:""},"— Selecione a causa —"),
                  DELAY_CAUSES.map(c=>ce("option",{key:c,value:c},c))
                )
              ),
              hitTarget!==null&&ce("button",{style:{...S.btnP,width:"100%",padding:"12px",fontSize:13,marginTop:12,opacity:canSave?1:.4},onClick:submit,disabled:!canSave},"💾 Registrar Avanço")
            )
        )
      ),
      ce("div",{style:{display:"flex",flexDirection:"column",gap:14}},
        ce("div",{style:S.card},
          ce("p",{style:S.h3},"Q"+form.room+" — Ambientes registrados"),

            Object.entries((updates[grp?.id]||[]).filter(u=>u.floor===form.floor&&u.room===form.room).reduce((acc,u)=>{const e=u.environment||"Amb";acc[e]=(acc[e]||0)+(u.actualPct||0);return acc;},{}) ).map(([e,p])=>{

// ══════════ ANALYSIS VIEW ══════════
function AnalysisView({groups,currentGroupId,companies,schedules,updates,aiInsights,isLoadingAI,onRunAI}){
  const grp=groups.find(g=>g.id===currentGroupId)||groups[0];
  const insight=typeof aiInsights[grp?.id]==="string"?aiInsights[grp?.id]:"";
  const grpUpd=updates[grp?.id]||[];
  const causeStats={};
  grpUpd.filter(u=>!u.hitTarget&&u.cause).forEach(u=>{causeStats[u.cause]=(causeStats[u.cause]||0)+1;});
  const topCauses=Object.entries(causeStats).sort((a,b)=>b[1]-a[1]);
  const total=Object.values(causeStats).reduce((a,b)=>a+b,0);
  const totalGap=grpUpd.filter(u=>!u.hitTarget).reduce((s,u)=>s+((u.targetPct||0)-(u.actualPct||0)),0);
  const progress=useMemo(()=>computeProgress(updates,schedules,currentGroupId),[updates,schedules,currentGroupId]);
  const [filterFloor,setFilterFloor]=useState("");
  const [filterTeam,setFilterTeam]=useState("");
  const allTeams=companies.flatMap(co=>co.teams.map(t=>({...t,coName:co.name,coColor:co.color})));

  const filteredUpd=grpUpd.filter(u=>{
    if(filterFloor&&u.floor!==+filterFloor)return false;
    if(filterTeam&&u.teamId!==filterTeam)return false;
    return!u.hitTarget;
  });

  return ce("div",null,
    ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
      ce("div",null,
        ce("div",{style:{fontSize:18,fontWeight:700,color:"#1C1B18"}},"Análise — "+grp?.name),
        ce("p",{style:{fontSize:11,color:"#B8B5AD",marginTop:4}},"Relatório executivo para apresentação ao CEO")

    ce("div",{style:{...S.g3,marginBottom:14}},
      ce("div",{style:S.card},
        ce("p",{style:S.h2},"Atraso Acumulado"),
        ce("div",{style:{fontSize:28,fontWeight:700,color:"#C48282",marginBottom:4}},totalGap+"%"),
        ce("div",{style:{fontSize:11,color:"#B8B5AD"}}),grpUpd.filter(u=>!u.hitTarget).length," dias não atingidos"
      ),
      ce("div",{style:S.card},
        ce("p",{style:S.h2},"Quartos Completos"),
        ce("div",{style:{fontSize:28,fontWeight:700,color:"#7AAE90",marginBottom:4}},progress.totals.done+"/"+progress.totals.total),
        ce("div",{style:{fontSize:11,color:"#B8B5AD"}},"no grupo "+grp?.name)
      ),
      ce("div",{style:S.card},
        ce("p",{style:S.h2},"Principais Causas"),
        topCauses.slice(0,3).map(([c,n])=>ce("div",{key:c,style:{fontSize:11,color:"#6C6960",marginBottom:4,display:"flex",justifyContent:"space-between"}},
          ce("span",null,c),ce("span",{style:{fontWeight:700,color:"#C4A882"}},n+"x")
        )),
        topCauses.length===0&&ce("span",{style:{color:"#7AAE90",fontSize:11}},"Nenhum atraso!")
      )
    ),
    // Filtros de infrações
    ce("div",{style:{...S.card,marginBottom:14}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
        ce("p",{style:{...S.h2,margin:0}},"Registros com Atraso — Filtros"),
        ce("div",{style:{display:"flex",gap:8}},
          ce("select",{style:{...S.inp,width:"auto",fontSize:11},value:filterFloor,onChange:e=>setFilterFloor(e.target.value)},
            ce("option",{value:""},"Todos os andares"),
            FLOORS.map(f=>ce("option",{key:f,value:f},f+"° Pavimento"))
          ),
          ce("select",{style:{...S.inp,width:"auto",fontSize:11},value:filterTeam,onChange:e=>setFilterTeam(e.target.value)},
            ce("option",{value:""},"Todas as equipes"),
            allTeams.map(t=>ce("option",{key:t.id,value:t.id},t.coName+" · "+t.name))
          )
        )
      ),
      filteredUpd.length===0?ce("div",{style:{padding:"20px 0",textAlign:"center",color:"#B8B5AD",fontSize:12}},"Nenhum atraso encontrado com esses filtros 🟢"):
      ce("div",{style:{display:"flex",flexDirection:"column",gap:6}},
        filteredUpd.slice(0,20).map(u=>{
          const co=companies.find(c=>c.teams.some(t=>t.id===u.teamId));
          const gap=(u.targetPct||0)-(u.actualPct||0);
          return ce("div",{key:u.id||u.ts,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#FAFAF9",borderRadius:8,border:"1px solid #EDEBE6",fontSize:11}},

            ce("div",{style:{display:"flex",gap:8,alignItems:"center"}},
              co&&ce("span",{style:S.badge(co.color)},co.name),
              ce("span",{style:{fontWeight:700,color:"#C48282"}},"-"+gap+"%")
            )
          );
        })

    ce("div",{style:{...S.card,background:"#FAFAF9"}},

}

              ce("span",{style:{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:10,background:color+"22",color}},STATUS_LABEL(s.variance))
            ),
            co&&ce("div",{style:{fontSize:9,color:"#B8B5AD",marginBottom:5}},co.name),
            ce("div",{style:{background:"#E8E5DF",borderRadius:3,height:4,marginBottom:4}},
              ce("div",{style:{width:Math.min(100,s.actualPct)+"%",background:color,height:4,borderRadius:3}})
            ),
            ce("div",{style:{display:"flex",justifyContent:"space-between",fontSize:9,color:"#B8B5AD",fontWeight:600}},
              ce("span",null,"Real "+s.actualPct.toFixed(0)+"%"),
              ce("span",null,"Plan "+s.plannedPct.toFixed(0)+"%")
            ),
            ce("div",{style:{fontSize:9,color:"#C4C1BA",marginTop:2}},s.doneRooms+"/"+s.roomCount+" completos")
          );
        })
      ),
      selectedFloor&&ce(FloorDetail,{
        floor:selectedFloor,grp,
        grpUpd:updates[currentGroupId]||[],
        sched:schedules[currentGroupId]||{},
        companies,onClose:()=>setSelectedFloor(null),
        groupColor:grp?.color
      })
    ),
    aiText&&ce("div",{style:{...S.card,marginTop:14,background:"#FAFAF9"}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
        ce("span",{style:{fontWeight:700,fontSize:12,color:"#1C1B18"}},"✦ Última análise IA — "+grp?.name),
        ce("button",{style:{...S.btnS,fontSize:10,padding:"4px 10px"},onClick:()=>setView("analysis")},"Ver completo →")
      ),
      ce("div",{style:{fontSize:11,lineHeight:1.8,color:"#8C8980",whiteSpace:"pre-line"}},aiText.split("\n").slice(0,8).join("\n")+(aiText.split("\n").length>8?"\n...":""))
    )
  );
}

// ══════════ CONFIG VIEW ══════════
function ConfigView({groups,setGroups,companies,setCompanies,schedules,setSchedules,onSave,showToast}){
  const [tab,setTab]=useState("groups");
  const [selG,setSelG]=useState(groups[0]?.id||null);
  const [saving,setSaving]=useState(false);
  const curG=groups.find(g=>g.id===selG);
  const updG=(id,f,v)=>setGroups(p=>p.map(g=>g.id===id?{...g,[f]:v}:g));
  const addG=()=>{const name=window.prompt("Nome do grupo:");if(!name?.trim())return;const id=`g${Date.now()}`;setGroups(p=>[...p,{id,name:name.trim(),color:"#9BB5C8",envName:"Ambiente"}]);setSchedules(p=>({...p,[id]:genSched()}));setSelG(id);};
  const remG=id=>{if(!window.confirm("Remover?"))return;setGroups(p=>p.filter(g=>g.id!==id));setSelG(groups.find(g=>g.id!==id)?.id||null);};
  const save=async()=>{setSaving(true);await onSave(groups,companies,schedules);setSaving(false);showToast("✅ Salvo!");};
  const tS=id=>({padding:"8px 16px",border:"none",background:"transparent",fontSize:12,fontWeight:700,color:tab===id?"#1C1B18":"#B8B5AD",borderBottom:tab===id?"2px solid #1C1B18":"2px solid transparent",marginBottom:-1,cursor:"pointer"});
  return ce("div",null,
    ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}},

    ),
    ce("p",{style:{fontSize:11,color:"#B8B5AD",marginBottom:18}},"Rascunho até clicar em Salvar."),
    ce("div",{style:{display:"flex",borderBottom:"1px solid #EDEBE6",marginBottom:20}},
      ["groups","schedule","companies"].map(id=>ce("button",{key:id,style:tS(id),onClick:()=>setTab(id)},id==="groups"?"Grupos":id==="schedule"?"Cronograma":"Empresas & Equipes"))
    ),
    tab==="groups"&&ce("div",{style:S.g2},
      ce("div",null,
        ce("div",{style:{...S.card,marginBottom:12}},
          ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
            ce("p",{style:{...S.h3,margin:0}},"Grupos de Serviço"),
            ce("button",{style:{...S.btnS,fontSize:11,padding:"5px 10px"},onClick:addG},"+ Novo")
          ),
          groups.map(g=>ce("div",{key:g.id,onClick:()=>setSelG(g.id),style:{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:8,cursor:"pointer",background:selG===g.id?"#F5F4F1":"transparent",marginBottom:4}},
            ce("div",{style:{width:10,height:10,borderRadius:"50%",background:g.color,flexShrink:0}}),
            ce("span",{style:{fontSize:12,fontWeight:selG===g.id?700:500,flex:1}},g.name),
            ce("span",{style:{fontSize:10,color:"#B8B5AD"}},g.envName)
          ))
        )
      ),
      curG&&ce("div",null,
        ce("div",{style:S.card},
          ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
            ce("p",{style:{...S.h3,margin:0}},curG.name),
            ce("button",{style:S.btnD,onClick:()=>remG(curG.id)},"Remover")
          ),
          ce("div",{style:{marginBottom:10}},ce("label",{style:S.lbl},"Nome"),ce("input",{style:S.inp,value:curG.name,onChange:e=>updG(curG.id,"name",e.target.value)})),
          ce("div",{style:{...S.g2,marginBottom:10}},
            ce("div",null,ce("label",{style:S.lbl},"Cor"),ce("input",{type:"color",value:curG.color,onChange:e=>updG(curG.id,"color",e.target.value),style:{width:42,height:34,borderRadius:7,border:"1px solid #E8E5DF",cursor:"pointer",padding:2,background:"transparent"}})),
            ce("div",null,ce("label",{style:S.lbl},"Tipo de Ambiente"),ce("input",{style:S.inp,value:curG.envName,onChange:e=>updG(curG.id,"envName",e.target.value),placeholder:"Banheiro, Quarto, Vão..."}))
          ),
          ce("div",{style:{padding:"10px 12px",background:"#F5F4F1",borderRadius:8,fontSize:11,color:"#8C8980"}},"O campo de ambiente é preenchido livremente na Atualização Diária. Esta configuração é apenas a sugestão padrão.")
        )
      )
    ),
    tab==="schedule"&&ce("div",null,
      ce("div",{style:{display:"flex",gap:7,marginBottom:14,flexWrap:"wrap"}},
        groups.map(g=>ce("button",{key:g.id,onClick:()=>setSelG(g.id),style:{padding:"5px 14px",borderRadius:20,border:`1px solid ${selG===g.id?g.color:"#EDEBE6"}`,background:selG===g.id?g.color+"22":"#fff",fontSize:11,fontWeight:600,color:selG===g.id?g.color:"#8C8980"}},g.name))
      ),
      curG&&ce("div",{style:S.g2},
        FLOORS.map(fl=>{
          const sc=(schedules[curG.id]||{})[fl]||{};
          const u=(f,v)=>setSchedules(p=>({...p,[curG.id]:{...(p[curG.id]||{}),[fl]:{...(p[curG.id]||{})[fl]||{},[f]:f==="roomCount"?+v:v}}}));
          return ce("div",{key:fl,style:S.card},
            ce("div",{style:{fontWeight:700,fontSize:12,color:"#1C1B18",marginBottom:10}},fl+"° Pavimento"),
            ce("div",{style:S.g3},
              ce("div",null,ce("label",{style:S.lbl},"Início"),ce("input",{style:S.inp,type:"date",value:sc.startDate||"",onChange:e=>u("startDate",e.target.value)})),
              ce("div",null,ce("label",{style:S.lbl},"Término"),ce("input",{style:S.inp,type:"date",value:sc.endDate||"",onChange:e=>u("endDate",e.target.value)})),
              ce("div",null,ce("label",{style:S.lbl},"Quartos"),ce("input",{style:S.inp,type:"number",min:"1",value:sc.roomCount||12,onChange:e=>u("roomCount",e.target.value)}))
            )
          );
        })
      )
    ),
    tab==="companies"&&ce("div",null,
      ce("p",{style:{fontSize:11,color:"#B8B5AD",marginBottom:14}},"Empresas e equipes compartilhadas entre todos os grupos."),
      companies.map(co=>ce("div",{key:co.id,style:{...S.card,marginBottom:12}},
        ce("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:12}},
          ce("div",{style:{width:10,height:10,borderRadius:"50%",background:co.color}}),
          ce("span",{style:{fontWeight:700,fontSize:14}},co.name)
        ),
        co.teams.map(t=>ce("div",{key:t.id,style:{background:"#F5F4F1",borderRadius:8,padding:12,marginBottom:8}},
          ce("div",{style:S.g3},
            ce("div",null,ce("label",{style:S.lbl},"Nome"),ce("input",{style:S.inp,value:t.name,onChange:e=>setCompanies(p=>p.map(c=>c.id===co.id?{...c,teams:c.teams.map(tm=>tm.id===t.id?{...tm,name:e.target.value}:tm)}:c))})),
            ce("div",null,ce("label",{style:S.lbl},"Pessoas"),ce("input",{style:S.inp,type:"number",min:"1",value:t.people,onChange:e=>setCompanies(p=>p.map(c=>c.id===co.id?{...c,teams:c.teams.map(tm=>tm.id===t.id?{...tm,people:+e.target.value}:tm)}:c))})),
            ce("div",null,ce("label",{style:S.lbl},"Dias/Ambiente"),ce("input",{style:S.inp,type:"number",min:"1",value:t.daysPerUnit||3,onChange:e=>setCompanies(p=>p.map(c=>c.id===co.id?{...c,teams:c.teams.map(tm=>tm.id===t.id?{...tm,daysPerUnit:+e.target.value}:tm)}:c))}))
          ),
          ce("div",{style:{marginTop:8}},
            ce("label",{style:S.lbl},"Andares Atribuídos"),
            ce("div",{style:{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}},
              FLOORS.map(f=>ce("button",{key:f,onClick:()=>{const cur=t.assignedFloors||[];const nf=cur.includes(f)?cur.filter(x=>x!==f):[...cur,f].sort((a,b)=>a-b);setCompanies(p=>p.map(c=>c.id===co.id?{...c,teams:c.teams.map(tm=>tm.id===t.id?{...tm,assignedFloors:nf}:tm)}:c));},style:{padding:"3px 9px",borderRadius:5,border:"none",fontSize:11,fontWeight:700,background:(t.assignedFloors||[]).includes(f)?co.color:"#E8E5DF",color:(t.assignedFloors||[]).includes(f)?"#fff":"#8C8980"}},f+"°"))
            )
          )
        ))
      ))
    )
  );
}

// ══════════ MAIN APP ══════════
function App(){
  const [view,setView]=useState("dashboard");
  const [groups,setGroups]=useState(INIT_GROUPS);
  const [companies,setCompanies]=useState(INIT_COMPANIES);
  const [schedules,setSchedules]=useState(()=>{const s={};INIT_GROUPS.forEach(g=>{s[g.id]=genSched();});return s;});
  const [updates,setUpdates]=useState({});
  const [aiInsights,setAiInsights]=useState({});
  const [currentGroupId,setCurrentGroupId]=useState(INIT_GROUPS[0].id);
  const [isLoadingAI,setIsLoadingAI]=useState(false);
  const [connected,setConnected]=useState(false);
  const [toast,setToast]=useState(null);

  useEffect(()=>{
    REF.on("value",snap=>{
      const d=snap.val();
      if(!d){const init={groups:INIT_GROUPS,companies:INIT_COMPANIES,schedules:{},updates:{},aiInsights:{}};INIT_GROUPS.forEach(g=>{init.schedules[g.id]=genSched();});REF.set(init);}
      else{
        if(d.groups)setGroups(Array.isArray(d.groups)?d.groups:Object.values(d.groups));
        if(d.companies)setCompanies(Array.isArray(d.companies)?d.companies:Object.values(d.companies));
        if(d.schedules)setSchedules(d.schedules);
        if(d.updates){const upd={};Object.entries(d.updates).forEach(([gid,vals])=>{upd[gid]=Object.values(vals||{}).sort((a,b)=>(a.date||"")>(b.date||"")?1:-1);});setUpdates(upd);}
        if(d.aiInsights){const ai={};Object.entries(d.aiInsights).forEach(([gid,val])=>{ai[gid]=typeof val==="string"?val:"";});setAiInsights(ai);}
      }
      setConnected(true);
      const splash=document.getElementById("splash");
      if(splash){splash.classList.add("hide");setTimeout(()=>splash.remove(),500);}
    },()=>setConnected(false));
    return()=>REF.off();
  },[]);

  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);},[]);
  const onSave=useCallback(async(g,c,sc)=>{await Promise.all([REF.child("groups").set(g),REF.child("companies").set(c),REF.child("schedules").set(sc)]);},[]);
  const onPushUpdate=useCallback(async(groupId,update)=>{await REF.child("updates").child(groupId).push(update);},[]);

  const onRunAI=useCallback(async(groupId)=>{
    setIsLoadingAI(true);
    const grp=groups.find(g=>g.id===groupId);
    const sched=schedules[groupId]||{};
    const grpUpd=updates[groupId]||[];
    const progress=computeProgress(updates,schedules,groupId);
    const totalGap=grpUpd.filter(u=>!u.hitTarget).reduce((s,u)=>s+((u.targetPct||0)-(u.actualPct||0)),0);
    const causeStats={};grpUpd.filter(u=>!u.hitTarget&&u.cause).forEach(u=>{causeStats[u.cause]=(causeStats[u.cause]||0)+1;});
    const topCauses=Object.entries(causeStats).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const allTeams=companies.flatMap(co=>co.teams.map(t=>({...t,coName:co.name})));
    const teamSummary=allTeams.map(t=>`${t.coName} ${t.name}: ${t.people} pessoas, ${t.daysPerUnit} dias/ambiente, andares: [${(t.assignedFloors||[]).join(",")}]`).join("\n");
    const prompt=`Você é consultor sênior de gestão de obras hoteleiras de alto padrão.

OBRA: Hotel Sofitel RJ | GRUPO: ${grp?.name} | DATA: ${TODAY}
TIPO DE AMBIENTE: ${grp?.envName} | ANDARES: 5° ao 20°

EQUIPES:
${teamSummary}

PROGRESSO POR ANDAR:
${FLOORS.map(f=>{
  const s=progress.floorStats[f];
  const teams=getFloorTeams(companies,f);
  const cap=calcFloorDailyCapacity(teams,s.roomCount);
  return `• ${f}°: real ${s.actualPct.toFixed(0)}% vs plan ${s.plannedPct.toFixed(0)}% (var ${s.variance>0?"+":""}${s.variance.toFixed(0)}%) | ${s.doneRooms}/${s.roomCount} quartos | capacidade ${cap.cap} amb/dia`;
}).join("\n")}

ATRASO ACUMULADO: ${totalGap}% total
PRINCIPAIS CAUSAS: ${topCauses.map(([c,n])=>`${c} (${n}x)`).join(", ")||"Nenhuma"}

ÚLTIMOS 10 REGISTROS:
${grpUpd.slice(-10).map(u=>`${u.date}|${u.floor}°|Q${u.room}|${u.environment||"?"}|Meta:${u.targetPct}%|Real:${u.actualPct}%|${u.hitTarget?"✓":"✗"}${u.cause?"|"+u.cause:""}`).join("\n")||"Nenhum"}

Forneça análise executiva:
1. 🔴🟡🟢 STATUS GERAL (2-3 frases)
2. ⚠️ ALERTAS — andares e quartos críticos
3. 📈 TENDÊNCIA — nova data de conclusão vs prazo original com os atrasos atuais
4. ✅ AÇÕES IMEDIATAS — o que fazer hoje/amanhã
5. 🔄 RECOMENDAÇÃO ESPECÍFICA — para recuperar ${totalGap}% de atraso: (a) adicionar pessoas → calcule quantas e onde, (b) estender jornada → calcule horas extras necessárias. Mostre impacto de cada opção em dias.
6. 🎯 META DIÁRIA — % mínimo por ambiente por equipe para terminar no prazo

Direto, executivo, em português. Para o CEO.`;
    try{
      const res=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
      const data=await res.json();
      const text=data.content?.find(b=>b.type==="text")?.text||data.error||"Erro.";
      setAiInsights(p=>({...p,[groupId]:text}));
      await REF.child("aiInsights").child(groupId).set(text);
    }catch(e){setAiInsights(p=>({...p,[groupId]:"⚠ Erro ao conectar com a IA."}));}
    setIsLoadingAI(false);
  },[groups,schedules,updates,companies]);

  const curGrp=groups.find(g=>g.id===currentGroupId);
  const NAV=[{id:"dashboard",icon:"◈",label:"Dashboard"},{id:"config",icon:"⚙",label:"Configurações"},{id:"update",icon:"◎",label:"Atualização"},{id:"analysis",icon:"✦",label:"Análise IA"}];

  return ce("div",{style:{display:"flex",height:"100vh",overflow:"hidden",fontFamily:"'DM Sans',system-ui,sans-serif",background:"#F5F4F1"}},
    ce("nav",{style:{width:210,background:"#fff",display:"flex",flexDirection:"column",flexShrink:0,borderRight:"1px solid #EDEBE6"}},
      ce("div",{style:{padding:"18px 16px 14px",borderBottom:"1px solid #EDEBE6"}},
        ce("div",{style:{fontWeight:700,fontSize:10,letterSpacing:"2.5px",color:"#1C1B18"}},"SOFITEL RJ"),
        ce("div",{style:{fontSize:10,color:"#B8B5AD",marginTop:3,display:"flex",alignItems:"center"}},
          ce("span",{style:{width:6,height:6,borderRadius:"50%",background:connected?"#A8C4B0":"#C48282",display:"inline-block",marginRight:5}}),
          connected?"Online":"Sem conexão"
        )
      ),
      ce("div",{style:{flex:1,overflow:"auto"}},
        ce("div",{style:{padding:"14px 0 4px"}},
          ce("div",{style:{fontSize:9,fontWeight:700,color:"#C4C1BA",letterSpacing:"1.2px",textTransform:"uppercase",padding:"0 16px",marginBottom:4}},"Ferramentas"),
          NAV.map(n=>ce("div",{key:n.id,onClick:()=>setView(n.id),style:{display:"flex",alignItems:"center",gap:9,padding:"9px 16px",cursor:"pointer",borderLeft:view===n.id?"2px solid "+(curGrp?.color||"#9BB5C8"):"2px solid transparent",background:view===n.id?"#F5F4F1":"transparent",color:view===n.id?"#1C1B18":"#8C8980",fontSize:12,fontWeight:view===n.id?700:500,marginBottom:2}},
            ce("span",{style:{fontSize:13}},n.icon)," ",n.label
          ))
        ),
        ce("div",{style:{padding:"14px 0 4px",borderTop:"1px solid #F5F4F1"}},
          ce("div",{style:{fontSize:9,fontWeight:700,color:"#C4C1BA",letterSpacing:"1.2px",textTransform:"uppercase",padding:"0 16px",marginBottom:4}},"Grupos de Serviço"),
          groups.map(g=>ce("div",{key:g.id,onClick:()=>{setCurrentGroupId(g.id);setView("dashboard");},style:{display:"flex",alignItems:"center",gap:9,padding:"9px 16px",cursor:"pointer",borderLeft:currentGroupId===g.id&&view==="dashboard"?"2px solid "+g.color:"2px solid transparent",background:currentGroupId===g.id&&view==="dashboard"?"#F5F4F1":"transparent",color:currentGroupId===g.id&&view==="dashboard"?"#1C1B18":"#8C8980",fontSize:12,fontWeight:currentGroupId===g.id&&view==="dashboard"?700:500,marginBottom:2}},
            ce("div",{style:{width:8,height:8,borderRadius:"50%",background:g.color,flexShrink:0}}),
            ce("span",{style:{flex:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},g.name)
          ))
        )
      ),
      ce("div",{style:{padding:"12px 16px",borderTop:"1px solid #EDEBE6"}},
        ce("div",{style:{fontSize:9,color:"#C4C1BA",textTransform:"uppercase",letterSpacing:"1px",marginBottom:2}},"Grupo atual"),
        ce("div",{style:{fontSize:12,fontWeight:700,color:curGrp?.color||"#9BB5C8"}},curGrp?.name||"—"),
        ce("div",{style:{fontSize:10,color:"#B8B5AD"}},curGrp?.envName||"—")
      )
    ),
    ce("main",{style:{flex:1,overflow:"auto",padding:24,background:"#F5F4F1"}},
      !connected&&ce("div",{style:{background:"#FBF0F0",border:"1px solid #E8C4C4",borderRadius:8,padding:"10px 16px",marginBottom:16,fontSize:12,color:"#C48282",fontWeight:600}},"🔴 Sem conexão com Firebase"),
      view==="dashboard"&&ce(DashboardView,{groups,currentGroupId,setCurrentGroupId,updates,schedules,companies,setView,aiInsights}),
      view==="config"&&ce(ConfigView,{groups,setGroups,companies,setCompanies,schedules,setSchedules,onSave,showToast}),
      view==="update"&&ce(UpdateView,{groups,currentGroupId,setCurrentGroupId,updates,onPushUpdate,companies,schedules,showToast}),
      view==="analysis"&&ce(AnalysisView,{groups,currentGroupId,companies,schedules,updates,aiInsights,isLoadingAI,onRunAI})
    ),
    toast&&ce("div",{style:{position:"fixed",bottom:20,right:20,padding:"11px 20px",borderRadius:9,background:"#1C1B18",color:"#fff",fontSize:12,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.15)",zIndex:9999,borderLeft:"3px solid #A8C4B0"}},toast)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(ce(App));
</script>
