// 4-state status
function getStatus(actual,planned,isDone){
  if(isDone||actual>=100)return{label:"Finalizado",color:"#5E9E7E",bg:"#D9EEE5",pill:"#B8DDD0"};
  if(actual>=planned)return{label:"No prazo",color:"#5E9E7E",bg:"#E4F2EC",pill:"#C4E4D6"};
  if(actual>=planned-15)return{label:"Em alerta",color:"#B8895A",bg:"#F5E8D6",pill:"#EDD5B0"};
  return{label:"Atrasado",color:"#B86060",bg:"#F5DADA",pill:"#EDB8B8"};
}

// Parse room numbers: "501-512" or "501,502,503" or fallback 1..N
function parseRooms(sc){
  const rc=sc?.roomCount||12;
  if(sc?.roomNumbers){
    const s=String(sc.roomNumbers).trim();
    if(s.includes("-")){const[a,b]=s.split("-").map(Number);if(!isNaN(a)&&!isNaN(b)&&b>a&&b-a<200)return Array.from({length:b-a+1},(_,i)=>a+i);}
    const arr=s.split(",").map(x=>parseInt(x.trim())).filter(n=>!isNaN(n));
    if(arr.length)return arr;
  }
  return Array.from({length:rc},(_,i)=>i+1);
}

// ── Chart ──
function LineChart({data,color,h}){
  const H=h||240;
  if(!data||data.length<2)return ce("div",{style:{height:H,display:"flex",alignItems:"center",justifyContent:"center",color:"#B8B5AD",fontSize:12}},"Registre avanços para ver o gráfico");
  const W=900,CH=H-40,pL=42,pR=16,pT=10,pB=28,cW=W-pL-pR,cH=CH-pT-pB;
  const allV=data.flatMap(d=>[d.planned,d.actual,d.trend].filter(v=>v!==undefined));
  const maxV=Math.max(...allV,1);
  const xp=i=>pL+(i/(data.length-1))*cW;const yp=v=>pT+cH-(v/maxV)*cH;
  const mkLine=(key,stroke,dash,sw)=>{
    const pts=data.map((d,i)=>({v:d[key],i})).filter(p=>p.v!==undefined);
    if(pts.length===0)return null;
    // Single point: draw a short horizontal segment so it's visible
    if(pts.length===1){const x=xp(pts[0].i),y=yp(pts[0].v);return ce("path",{key,d:`M ${(x-4).toFixed(1)} ${y.toFixed(1)} L ${(x+4).toFixed(1)} ${y.toFixed(1)}`,stroke,strokeWidth:(sw||2)+1,fill:"none",strokeLinecap:"round"});}
    return ce("path",{key,d:pts.map((p,j)=>`${j===0?"M":"L"} ${xp(p.i).toFixed(1)} ${yp(p.v).toFixed(1)}`).join(" "),stroke,strokeWidth:sw||2,fill:"none",strokeDasharray:dash||"none"});
  };
  const step=Math.max(1,Math.floor(data.length/10));
  const todayI=data.findLastIndex(d=>d.actual!==undefined);
  return ce("div",null,
    ce("svg",{viewBox:`0 0 ${W} ${CH+24}`,style:{width:"100%",height:H-10},preserveAspectRatio:"xMidYMid meet"},
      [0,.25,.5,.75,1].map((p,i)=>ce("line",{key:i,x1:pL,x2:W-pR,y1:(pT+cH*(1-p)).toFixed(1),y2:(pT+cH*(1-p)).toFixed(1),stroke:"#F0EDE8",strokeWidth:1})),
      mkLine("planned","#D6D3CC","6,4",1.5),mkLine("actual",color||"#9BB5C8",null,3),mkLine("trend","#C4A882","5,3",2),
      todayI>=0&&ce("line",{key:"td",x1:xp(todayI),x2:xp(todayI),y1:pT,y2:pT+cH,stroke:"#E8C4C4",strokeWidth:1.5,strokeDasharray:"4,3"}),
      todayI>=0&&ce("text",{key:"tdl",x:xp(todayI)+3,y:pT+10,fontSize:8,fill:"#C48282",fontFamily:"system-ui"},"Hoje"),
      // Dots on actual data points where actual > 0
      data.map((d,i)=>d.actual>0?ce("circle",{key:"dot"+i,cx:xp(i).toFixed(1),cy:yp(d.actual).toFixed(1),r:3,fill:color||"#9BB5C8",stroke:"#fff",strokeWidth:1.5}):null).filter(Boolean),
      data.filter((_,i)=>i%step===0).map((d,i)=>ce("text",{key:"x"+i,x:xp(data.indexOf(d)).toFixed(1),y:CH+16,textAnchor:"middle",fontSize:9,fill:"#C4C1BA",fontFamily:"system-ui"},d.date)),
      [0,Math.round(maxV/3),Math.round(maxV*2/3),maxV].map((v,i)=>ce("text",{key:"y"+i,x:pL-4,y:yp(v)+3,textAnchor:"end",fontSize:9,fill:"#C4C1BA",fontFamily:"system-ui"},v+"%"))
    ),
    ce("div",{style:{display:"flex",gap:20,marginTop:6}},
      [["#D6D3CC","Planejado"],[color||"#9BB5C8","Realizado"],["#C4A882","Tendência"]].map(([c,l])=>

// ── Progress ──
function computeProgress(updates,schedules,gid){
  const grpUpd=updates[gid]||[],sched=schedules[gid]||{},acc={};
  grpUpd.forEach(u=>{if(!acc[u.floor])acc[u.floor]={};if(!acc[u.floor][u.room])acc[u.floor][u.room]={};const env=u.environment||"Ambiente";acc[u.floor][u.room][env]=(acc[u.floor][u.room][env]||0)+(u.actualPct||0);});
  const fs={};
  FLOORS.forEach(fl=>{
    const sc=sched[fl]||{},rc=sc.roomCount||12;
    let sum=0,done=0;const rooms={};
    for(let r=1;r<=rc;r++){const envs=acc[fl]?.[r]||{};const ek=Object.keys(envs);if(!ek.length){rooms[r]={envs:{},avgPct:0,done:false};continue;}let rs=0;const ed={};ek.forEach(e=>{const p=Math.min(100,envs[e]);ed[e]=p;rs+=p;});const avg=rs/ek.length;rooms[r]={envs:ed,avgPct:Math.round(avg),done:avg>=100};sum+=avg;if(avg>=100)done++;}
    const el=Math.max(0,diffD(sc.startDate||TODAY,TODAY)),td=Math.max(1,diffD(sc.startDate||TODAY,sc.endDate||fmt(addD(new Date(),90))));
    const pp=Math.min(100,(el/td)*100),ap=rc>0?sum/rc:0;
    fs[fl]={roomCount:rc,doneRooms:done,plannedPct:pp,actualPct:ap,variance:ap-pp,rooms,startDate:sc.startDate,endDate:sc.endDate};
  });
  const tot=FLOORS.reduce((a,f)=>{const s=fs[f];a.done+=s.doneRooms;a.total+=s.roomCount;a.sumPct+=s.actualPct;return a;},{done:0,total:0,sumPct:0});
  return{acc,floorStats:fs,totals:tot};
}

function computeChart(updates,schedules,gid,filterFloor){
  const grpUpd=(updates[gid]||[]).filter(u=>!filterFloor||u.floor===filterFloor);
  const sched=schedules[gid]||{};
  const floors=filterFloor?[filterFloor]:FLOORS;

  // Start from earliest schedule date (gives context for planned curve)
  let earliestStart=TODAY;
  floors.forEach(fl=>{const sc=sched[fl];if(sc?.startDate&&sc.startDate<earliestStart)earliestStart=sc.startDate;});
  // Chart window: from schedule start to today+40 days
  const chartStart=earliestStart;
  const chartEnd=fmt(addD(new Date(),40));
  const totalDays=Math.max(2,diffD(chartStart,chartEnd));

  const data=[];
  for(let i=0;i<=totalDays;i++){
    const date=fmt(addD(new Date(chartStart),i));
    const isPast=date<=TODAY;

    // Planned: weighted average across floors that have started
    let planned=0,activeFloors=0;
    floors.forEach(fl=>{
      const sc=sched[fl];
      if(!sc?.startDate||!sc?.endDate)return;
      activeFloors++;
      if(date<sc.startDate)return; // not started yet
      const el=Math.max(0,diffD(sc.startDate,date));
      const td=Math.max(1,diffD(sc.startDate,sc.endDate));
      planned+=Math.min(100,(el/td)*100);
    });
    const entry={date:date.slice(5),planned:Math.round(activeFloors>0?planned/activeFloors:0)};

    // Actual: cumulative progress up to this date (0 if no updates yet)
    if(isPast){
      const acc={};
      grpUpd.filter(u=>u.date<=date).forEach(u=>{
        const k=`${u.floor}_${u.room}_${u.environment||"A"}`;
        acc[k]=(acc[k]||0)+(u.actualPct||0);
      });
      const vals=Object.values(acc).map(v=>Math.min(100,v));
      // Count all expected units for denominator (total rooms across floors with schedules)
      let totalUnits=0;
      floors.forEach(fl=>{const sc=sched[fl];if(sc?.startDate&&date>=sc.startDate)totalUnits+=sc.roomCount||12;});
      entry.actual=totalUnits>0
        ?Math.round(vals.reduce((a,b)=>a+b,0)/totalUnits)
        :(vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0);
    }

    // Trend: extrapolate from accumulated actual (works with 1+ real points)
    if(!isPast){
      const lastActuals=data.filter(d=>d.actual!==undefined);
      if(lastActuals.length>=1){
        const lastVal=lastActuals[lastActuals.length-1].actual;
        const daysElapsed=Math.max(1,diffD(chartStart,TODAY)+1);
        const rate=lastVal/daysElapsed;
        entry.trend=Math.min(100,Math.round(lastVal+rate*diffD(TODAY,date)));
      }
    }
    data.push(entry);
  }
  return data;
}

function getUT(grpUpd,floor,room,env,dpu){
  const base=Math.round(100/Math.max(1,dpu));
  const ud=grpUpd.filter(u=>u.floor===floor&&String(u.room)===String(room)&&(u.environment||"Ambiente")===env);
  const tp=ud.reduce((s,u)=>s+(u.targetPct||0),0),ta=ud.reduce((s,u)=>s+(u.actualPct||0),0);
  const acc=Math.min(100,ta),rem=100-acc;
  if(rem<=0)return{target:0,accumulated:100,remaining:0,carryover:0,done:true};
  const co=Math.max(0,tp-ta);
  return{target:Math.min(rem,Math.round(base+co)),accumulated:Math.round(acc),remaining:Math.round(rem),carryover:Math.round(co),done:false};
}

function getFloorTeams(companies,floor){return(companies||[]).flatMap(co=>co.teams.filter(t=>(t.assignedFloors||[]).includes(floor)).map(t=>({...t,coName:co.name,coColor:co.color})));}

// ══════════ GROUP DASHBOARD ══════════
function GroupDashboard({grp,updates,schedules,setTab}){
  const companies=grp.companies||[];
  const [selFloor,setSelFloor]=useState(null);
  const [selRoom,setSelRoom]=useState(null);
  const progress=useMemo(()=>computeProgress(updates,schedules,grp.id),[updates,schedules,grp.id]);
  const chartData=useMemo(()=>computeChart(updates,schedules,grp.id,null),[updates,schedules,grp.id]);
  const {totals,floorStats}=progress;
  const grpUpd=updates[grp.id]||[];
  const avgPct=totals.total>0?Math.round(totals.sumPct/totals.total):0;
  const daysA=grpUpd.length>0?Math.max(1,diffD(grpUpd[0]?.date||TODAY,TODAY)+1):1;
  const dp=(grpUpd.reduce((s,u)=>s+(u.actualPct||0),0)/daysA).toFixed(1);
  const atRisk=FLOORS.filter(f=>{const s=floorStats[f];return getStatus(s.actualPct,s.plannedPct,s.doneRooms>=s.roomCount&&s.roomCount>0).label==="Atrasado";}).length;
  const flSc=selFloor?(schedules[grp.id]||{})[selFloor]||{}:{};
  const flRooms=selFloor?parseRooms(flSc):[];
  const acc=selFloor?(progress.acc[selFloor]||{}):{};
  const floorChartData=useMemo(()=>selFloor?computeChart(updates,schedules,grp.id,selFloor):null,[updates,schedules,grp.id,selFloor]);

  const roomData=flRooms.map(r=>{
    const envs=acc[r]||{};const ek=Object.keys(envs);
    if(!ek.length)return{r,envs:{},avgPct:0,done:false};
    let s=0;const ed={};ek.forEach(e=>{const p=Math.min(100,envs[e]);ed[e]=p;s+=p;});
    const avg=s/ek.length;return{r,envs:ed,avgPct:Math.round(avg),done:avg>=100};
  });

  const ovSt=getStatus(avgPct,50,totals.done===totals.total&&totals.total>0);

  return ce("div",null,
    // KPIs
    ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}},
      [{l:"Avanço Médio",v:avgPct+"%",s:"média dos ambientes",c:grp.color,bg:grp.color+"11"},
       {l:"Quartos Completos",v:totals.done+"/"+totals.total,s:"concluídos",c:"#7AAE90",bg:"#F0F7F3"},
       {l:"Ritmo Diário",v:dp+"%",s:"avanço por dia",c:"#C4B89A",bg:"#FAF8F3"},
       {l:"Andares Atrasados",v:String(atRisk),s:"abaixo do plano",c:"#C4A882",bg:"#FAF6F0"},
      ].map((k,i)=>ce("div",{key:i,style:{background:k.bg,borderRadius:11,padding:"13px 15px",borderTop:`3px solid ${k.c}`}},
        ce("div",{style:{fontSize:9,color:"#B8B5AD",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:5}},k.l),
        ce("div",{style:{fontSize:24,fontWeight:700,color:k.c,lineHeight:1,marginBottom:3}},k.v),
        ce("div",{style:{fontSize:10,color:"#B8B5AD"}},k.s)
      ))
    ),
    // Chart
    ce("div",{style:{...S.card,marginBottom:14,padding:"16px 20px"}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
        ce("div",{style:{display:"flex",alignItems:"center",gap:10}},
          ce("p",{style:{...S.h2,margin:0}},"Avanço % · Cronograma e Tendência"),
          ce("span",{style:{...S.badge(ovSt.color),fontSize:9}},ovSt.label)
        ),
        ce("button",{style:{...S.btnS,fontSize:11,padding:"5px 12px"},onClick:()=>setTab("update")},"+ Registrar avanço")
      ),
      ce(LineChart,{data:chartData,color:grp.color,h:260})
    ),
    // Floor grid
    ce("div",{style:S.card},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
        ce("p",{style:{...S.h2,margin:0}},"Pavimentos — Clique para detalhar"),
        selFloor&&ce("button",{style:{...S.btnS,fontSize:11,padding:"5px 10px"},onClick:()=>{setSelFloor(null);setSelRoom(null);}},"x Fechar")
      ),
      ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:selFloor?16:0}},
        FLOORS.map(fl=>{
          const s=floorStats[fl];
          const st=getStatus(s.actualPct,s.plannedPct,s.doneRooms>=s.roomCount&&s.roomCount>0);
          const co=companies.find(c=>c.teams.some(t=>(t.assignedFloors||[]).includes(fl)));
          const isSel=selFloor===fl;
          return ce("div",{key:fl,onClick:()=>{setSelFloor(isSel?null:fl);setSelRoom(null);},style:{borderRadius:10,padding:"10px 12px",background:isSel?"#fff":st.bg,border:`${isSel?2:1}px solid ${isSel?st.color:(st.pill||st.bg)}`,cursor:"pointer",transition:"all .15s"}},
            ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}},
              ce("span",{style:{fontWeight:700,fontSize:14,color:"#1C1B18"}},fl+"°"),
              ce("span",{style:{fontSize:8,fontWeight:700,padding:"2px 6px",borderRadius:10,background:st.color+"33",color:st.color}},st.label)
            ),
            co&&ce("div",{style:{fontSize:9,color:"#7C796E",marginBottom:4}},co.name),
            ce("div",{style:{background:st.color+"33",borderRadius:3,height:4,marginBottom:4}},ce("div",{style:{width:Math.min(100,s.actualPct)+"%",background:st.color,height:4,borderRadius:3}})),
            ce("div",{style:{display:"flex",justifyContent:"space-between",fontSize:9,color:"#7C796E"}},ce("span",null,"Real "+s.actualPct.toFixed(0)+"%"),ce("span",null,"Plan "+s.plannedPct.toFixed(0)+"%")),
            ce("div",{style:{fontSize:9,color:"#9C998E",marginTop:2}},s.doneRooms+"/"+s.roomCount+" completos")

// ══════════ GROUP ANALYSIS ══════════
function GroupAnalysis({grp,schedules,updates,aiInsights,isLoadingAI,onRunAI}){
  const companies=grp.companies||[];
  const insight=typeof aiInsights[grp.id]==="string"?aiInsights[grp.id]:"";
  const grpUpd=updates[grp.id]||[];
  const causeStats={};grpUpd.filter(u=>!u.hitTarget&&u.cause).forEach(u=>{causeStats[u.cause]=(causeStats[u.cause]||0)+1;});
  const topCauses=Object.entries(causeStats).sort((a,b)=>b[1]-a[1]);
  const totalGap=grpUpd.filter(u=>!u.hitTarget).reduce((s,u)=>s+((u.targetPct||0)-(u.actualPct||0)),0);
  const progress=useMemo(()=>computeProgress(updates,schedules,grp.id),[updates,schedules,grp.id]);
  const [ff,setFf]=useState("");const [ft,setFt]=useState("");
  const allTeams=companies.flatMap(co=>co.teams.map(t=>({...t,coName:co.name,coColor:co.color})));
  const filteredUpd=grpUpd.filter(u=>(!ff||u.floor===+ff)&&(!ft||u.teamId===ft)&&!u.hitTarget);
  return ce("div",null,
    ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
      ce("p",{style:{...S.h2,margin:0}},"Analise — "+grp.name),
      ce("button",{style:S.btnP,onClick:()=>onRunAI(grp.id),disabled:isLoadingAI},isLoadingAI?"Analisando...":"Gerar Analise IA")
    ),
    ce("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:14}},
      ce("div",{style:S.card},ce("p",{style:S.h2},"Atraso Acumulado"),ce("div",{style:{fontSize:28,fontWeight:700,color:"#C48282",marginBottom:4}},totalGap+"%"),ce("div",{style:{fontSize:11,color:"#B8B5AD"}},grpUpd.filter(u=>!u.hitTarget).length+" dias")),
      ce("div",{style:S.card},ce("p",{style:S.h2},"Quartos Completos"),ce("div",{style:{fontSize:28,fontWeight:700,color:"#7AAE90",marginBottom:4}},progress.totals.done+"/"+progress.totals.total),ce("div",{style:{fontSize:11,color:"#B8B5AD"}},grp.name)),
      ce("div",{style:S.card},ce("p",{style:S.h2},"Top Causas"),topCauses.slice(0,3).map(([c,n])=>ce("div",{key:c,style:{fontSize:11,color:"#6C6960",marginBottom:4,display:"flex",justifyContent:"space-between"}},ce("span",null,c),ce("span",{style:{fontWeight:700,color:"#C4A882"}},n+"x"))),topCauses.length===0&&ce("span",{style:{color:"#7AAE90",fontSize:11}},"Nenhum atraso"))
    ),
    ce("div",{style:{...S.card,marginBottom:14}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
        ce("p",{style:{...S.h2,margin:0}},"Registros com Atraso"),
        ce("div",{style:{display:"flex",gap:8}},
          ce("select",{style:{...S.inp,width:"auto",fontSize:11},value:ff,onChange:e=>setFf(e.target.value)},ce("option",{value:""},"Todos os andares"),FLOORS.map(f=>ce("option",{key:f,value:f},f+"° Pavimento"))),
          ce("select",{style:{...S.inp,width:"auto",fontSize:11},value:ft,onChange:e=>setFt(e.target.value)},ce("option",{value:""},"Todas as equipes"),allTeams.map(t=>ce("option",{key:t.id,value:t.id},t.coName+" - "+t.name)))
        )
      ),
      filteredUpd.length===0?ce("div",{style:{padding:"16px 0",textAlign:"center",color:"#B8B5AD",fontSize:12}},"Nenhum atraso com esses filtros"):
      filteredUpd.slice(0,20).map(u=>{const co=companies.find(c=>c.teams.some(t=>t.id===u.teamId));const gap=(u.targetPct||0)-(u.actualPct||0);
        return ce("div",{key:u.id||u.ts,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#FAFAF9",borderRadius:8,border:"1px solid #EDEBE6",fontSize:11,marginBottom:6}},
          ce("div",null,ce("div",{style:{fontWeight:700,color:"#1C1B18"}},u.date+" - "+u.floor+"° Q"+u.room+" - "+(u.environment||"—")),ce("div",{style:{color:"#8C8980",marginTop:2}},u.cause||"Sem causa")),
          ce("div",{style:{display:"flex",gap:8,alignItems:"center"}},co&&ce("span",{style:S.badge(co.color)},co.name),ce("span",{style:{fontWeight:700,color:"#C48282"}},"-"+gap+"%"))
        );
      })
    ),
    ce("div",{style:{...S.card,background:"#FAFAF9"}},
      ce("p",{style:S.h2},"Analise e Recomendacoes IA"),
      isLoadingAI?ce("div",{style:{padding:"30px 0",textAlign:"center",color:"#B8B5AD"}},"Analisando..."):

    )
  );
}

// ══════════ OVERVIEW ══════════
function Overview({groups,updates,schedules,setSelectedGroup}){
  return ce("div",null,
    ce("div",{style:{fontSize:20,fontWeight:700,color:"#1C1B18",marginBottom:4}},"Visao Geral da Obra"),
    ce("p",{style:{fontSize:11,color:"#B8B5AD",marginBottom:20}},"Selecione um grupo de servico no menu esquerdo"),
    ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}},
      groups.map(g=>{
        const progress=computeProgress(updates,schedules,g.id);
        const avg=progress.totals.total>0?Math.round(progress.totals.sumPct/progress.totals.total):0;
        const st=getStatus(avg,50,progress.totals.done===progress.totals.total&&progress.totals.total>0);
        return ce("div",{key:g.id,onClick:()=>setSelectedGroup(g.id),style:{...S.card,cursor:"pointer",borderTop:`3px solid ${g.color}`}},
          ce("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
            ce("div",{style:{width:10,height:10,borderRadius:"50%",background:g.color}}),
            ce("span",{style:{fontWeight:700,fontSize:13,color:"#1C1B18",flex:1}},g.name),
            ce("span",{style:{...S.badge(st.color),fontSize:8}},st.label)
          ),
          ce("div",{style:{fontSize:26,fontWeight:700,color:g.color,marginBottom:6}},avg+"%"),
          ce("div",{style:{background:"#E8E5DF",borderRadius:3,height:5,marginBottom:6}},ce("div",{style:{width:avg+"%",background:g.color,height:5,borderRadius:3}})),
          ce("div",{style:{fontSize:10,color:"#B8B5AD"}},progress.totals.done+"/"+progress.totals.total+" completos"),
          ce("div",{style:{fontSize:10,color:"#B8B5AD",marginTop:2}},(updates[g.id]||[]).length+" registros")
        );
      })
    )
  );
}

      const d=snap.val();

  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);},[]);
