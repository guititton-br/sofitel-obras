// ── Line Chart ──
function LineChart({data,color}){
  if(!data||data.length<2) return ce("div",{style:{height:140,display:"flex",alignItems:"center",justifyContent:"center",color:"#B8B5AD",fontSize:12}},"Registre avanços para ver o gráfico");
  const W=580,H=140,pL=38,pR=16,pT=8,pB=24,cW=W-pL-pR,cH=H-pT-pB;
  const allV=data.flatMap(d=>[d.planned,d.actual,d.trend].filter(v=>v!==undefined));
  const maxV=Math.max(...allV,1);
  const xp=i=>pL+(i/(data.length-1))*cW;
  const yp=v=>pT+cH-(v/maxV)*cH;
  const mkLine=(key,stroke,dash)=>{
    const pts=data.map((d,i)=>({v:d[key],i})).filter(p=>p.v!==undefined);
    if(pts.length<2)return null;
    return ce("path",{key,d:pts.map((p,j)=>`${j===0?"M":"L"} ${xp(p.i).toFixed(1)} ${yp(p.v).toFixed(1)}`).join(" "),stroke,strokeWidth:2,fill:"none",strokeDasharray:dash||"none"});
  };
  const step=Math.max(1,Math.floor(data.length/7));
  const todayI=data.findLastIndex(d=>d.actual!==undefined);
  return ce("div",null,
    ce("svg",{viewBox:`0 0 ${W} ${H+18}`,style:{width:"100%",height:158}},
      [0,.25,.5,.75,1].map((p,i)=>ce("line",{key:i,x1:pL,x2:W-pR,y1:(pT+cH*(1-p)).toFixed(1),y2:(pT+cH*(1-p)).toFixed(1),stroke:"#F0EDE8",strokeWidth:1})),
      mkLine("planned","#D6D3CC","6,4"),
      mkLine("actual",color||"#9BB5C8",null),
      mkLine("trend","#C4A882","4,3"),
      todayI>=0&&ce("line",{key:"td",x1:xp(todayI),x2:xp(todayI),y1:pT,y2:pT+cH,stroke:"#E8C4C4",strokeWidth:1.5,strokeDasharray:"4,3"}),
      todayI>=0&&ce("text",{key:"tdl",x:xp(todayI)+3,y:pT+10,fontSize:8,fill:"#C48282",fontFamily:"system-ui"},"Hoje"),
      data.filter((_,i)=>i%step===0).map((d,i)=>ce("text",{key:"x"+i,x:xp(data.indexOf(d)).toFixed(1),y:H+14,textAnchor:"middle",fontSize:9,fill:"#C4C1BA",fontFamily:"system-ui"},d.date)),
      [0,Math.round(maxV/2),maxV].map((v,i)=>ce("text",{key:"y"+i,x:pL-3,y:yp(v)+3,textAnchor:"end",fontSize:9,fill:"#C4C1BA",fontFamily:"system-ui"},v+"%"))
    ),
    ce("div",{style:{display:"flex",gap:16,marginTop:6}},
      [["#D6D3CC","Planejado"],[color||"#9BB5C8","Realizado"],["#C4A882","Tendência"]].map(([c,l])=>
        ce("div",{key:l,style:{display:"flex",alignItems:"center",gap:5,fontSize:10,color:"#8C8980"}},
          ce("div",{style:{width:20,height:2,background:c,borderRadius:1}}),l
        )
      )
    )
  );
}

// ── Progress computation (% based) ──
function computeProgress(updates, schedules, groupId){
  const grpUpd=updates[groupId]||[], sched=schedules[groupId]||{};
  // unitAcc[floor][unit] = accumulated %
  const unitAcc={};
  grpUpd.forEach(u=>{
    if(!unitAcc[u.floor]) unitAcc[u.floor]={};
    unitAcc[u.floor][u.unit]=(unitAcc[u.floor][u.unit]||0)+(u.actualPct||0);
  });
  const floorStats={};
  FLOORS.forEach(fl=>{
    const sc=sched[fl]||{}, cnt=sc.count||10;
    let doneUnits=0, totalPct=0;
    for(let u=1;u<=cnt;u++){
      const acc=Math.min(100,unitAcc[fl]?.[u]||0);
      totalPct+=acc;
      if(acc>=100) doneUnits++;
    }
    const el=Math.max(0,diffD(sc.startDate||TODAY,TODAY));
    const td=Math.max(1,diffD(sc.startDate||TODAY,sc.endDate||fmt(addD(new Date(),90))));
    const plannedPct=Math.min(100,(el/td)*100);
    const actualPct=cnt>0?totalPct/cnt:0;
    floorStats[fl]={count:cnt,doneUnits,totalPct,plannedPct,actualPct,variance:actualPct-plannedPct,startDate:sc.startDate,endDate:sc.endDate};
  });
  const totals=FLOORS.reduce((acc,f)=>{const s=floorStats[f];acc.doneUnits+=s.doneUnits;acc.totalUnits+=s.count;acc.totalPct+=s.totalPct;acc.maxPct+=s.count*100;return acc;},{doneUnits:0,totalUnits:0,totalPct:0,maxPct:0});
  return {unitAcc,floorStats,totals};
}

// ── Chart data ──
function computeChartData(updates, schedules, groupId){
  const grpUpd=updates[groupId]||[], sched=schedules[groupId]||{};
  const dates=[...new Set(grpUpd.map(u=>u.date))].sort();
  const base=dates[0]||TODAY;
  const data=[];
  // Cumulative actual by date
  for(let i=0;i<=diffD(base,fmt(addD(new Date(),35)));i++){
    const date=fmt(addD(new Date(base),i)), isPast=date<=TODAY;
    // Planned: linear interpolation across all floors
    let planned=0;
    FLOORS.forEach(fl=>{const sc=sched[fl];if(!sc||date<sc.startDate)return;const el=Math.max(0,diffD(sc.startDate,date));const td=Math.max(1,diffD(sc.startDate,sc.endDate));planned+=(el/td)*100;});
    const avgPlanned=FLOORS.length>0?planned/FLOORS.length:0;
    const entry={date:date.slice(5),planned:Math.round(avgPlanned)};
    if(isPast){
      // Cumulative actual average %
      const unitAcc={};
      grpUpd.filter(u=>u.date<=date).forEach(u=>{if(!unitAcc[u.floor])unitAcc[u.floor]={};unitAcc[u.floor][u.unit]=(unitAcc[u.floor][u.unit]||0)+(u.actualPct||0);});
      let sumPct=0,cnt=0;
      FLOORS.forEach(fl=>{const sc=sched[fl];if(!sc||date<sc.startDate)return;const c=sc.count||10;for(let u=1;u<=c;u++){sumPct+=Math.min(100,unitAcc[fl]?.[u]||0);cnt++;}});
      entry.actual=cnt>0?Math.round(sumPct/cnt):0;
    }
    if(!isPast&&dates.length>=2){
      const lastAct=data.filter(d=>d.actual!==undefined);
      if(lastAct.length>=2){const la=lastAct[lastAct.length-1].actual,rate=la/Math.max(1,diffD(dates[0],TODAY));entry.trend=Math.min(100,Math.round(la+rate*diffD(TODAY,date)));}
    }
    data.push(entry);
  }
  return data;
}

// ── Unit carryover calculation ──
function getUnitTarget(grpUpd, floor, unit, daysPerUnit){
  const baseTarget=Math.round(100/Math.max(1,daysPerUnit));
  const unitUpd=grpUpd.filter(u=>u.floor===floor&&u.unit===unit);
  const totalPlanned=unitUpd.reduce((s,u)=>s+(u.targetPct||0),0);
  const totalActual=unitUpd.reduce((s,u)=>s+(u.actualPct||0),0);
  const accumulated=Math.min(100,totalActual);
  const remaining=100-accumulated;
  if(remaining<=0) return {target:0,accumulated:100,remaining:0,carryover:0,done:true};
  const carryover=Math.max(0,totalPlanned-totalActual);
  const target=Math.min(remaining,baseTarget+carryover);
  return {target:Math.round(target),accumulated:Math.round(accumulated),remaining:Math.round(remaining),carryover:Math.round(carryover),done:false};
}

  const reset=()=>{setHitTarget(null);setActualPct("");setCause("");};

  const handleHit=v=>{setHitTarget(v);if(v){setActualPct(String(unitInfo.target));setCause("");}else{setActualPct("");}};

  const canSave=hitTarget===true||(hitTarget===false&&actualPct!==""&&cause!=="");

  const submit=async()=>{
    const ap=hitTarget?unitInfo.target:Math.min(unitInfo.remaining,Math.max(0,+actualPct));
    await onPushUpdate(grp.id,{

      cause:hitTarget?null:cause,
      ts:Date.now()

    ce("div",{style:S.g2},
      // Left: form
      ce("div",{style:{display:"flex",flexDirection:"column",gap:14}},
        ce("div",{style:S.card},
          ce("p",{style:S.h3},"Identificação"),
          ce("div",{style:{...S.g2,marginBottom:10}},
            ce("div",null,ce("label",{style:S.lbl},"Data"),ce("input",{style:S.inp,type:"date",value:form.date,onChange:e=>setForm(p=>({...p,date:e.target.value}))})),
            ce("div",null,ce("label",{style:S.lbl},"Equipe"),ce("select",{style:S.inp,value:form.teamId||allTeams[0]?.id||"",onChange:e=>setForm(p=>({...p,teamId:e.target.value}))},allTeams.map(t=>ce("option",{key:t.id,value:t.id},t.coName+" · "+t.name+" ("+t.people+"p · "+t.daysPerUnit+"d/"+grp?.envName?.toLowerCase()+")"))))
          ),
          ce("div",{style:S.g2},
            ce("div",null,ce("label",{style:S.lbl},"Pavimento"),ce("select",{style:S.inp,value:form.floor,onChange:e=>handleFloor(e.target.value)},FLOORS.map(f=>ce("option",{key:f,value:f},f+"° Pavimento")))),

}

// ══════════════ DASHBOARD VIEW ══════════════
function DashboardView({groups,currentGroupId,setCurrentGroupId,updates,schedules,companies,setView,aiInsights}){
  const grp=groups.find(g=>g.id===currentGroupId)||groups[0];
  const progress=useMemo(()=>computeProgress(updates,schedules,currentGroupId),[updates,schedules,currentGroupId]);
  const chartData=useMemo(()=>computeChartData(updates,schedules,currentGroupId),[updates,schedules,currentGroupId]);
  const {totals,floorStats}=progress;
  const ovPct=totals.maxPct>0?Math.round(totals.totalPct/totals.totalPct*100||0):0; // avg %
  const avgPct=totals.totalUnits>0?Math.round(totals.totalPct/totals.totalUnits):0;
  const atRisk=FLOORS.filter(f=>floorStats[f]?.variance<-10).length;
  const critical=FLOORS.filter(f=>floorStats[f]?.variance<-20).length;
  const grpUpd=updates[currentGroupId]||[];
  // Daily pace
  const daysActive=grpUpd.length>0?Math.max(1,diffD(grpUpd[0]?.date||TODAY,TODAY)+1):1;
  const totalActualPct=grpUpd.reduce((s,u)=>s+(u.actualPct||0),0);
  const dailyPace=daysActive>0?(totalActualPct/daysActive).toFixed(1):0;
  const aiText=typeof aiInsights[currentGroupId]==="string"?aiInsights[currentGroupId]:"";

  return ce("div",null,
    ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}},

        ce("div",{style:{color:"#B8B5AD",fontSize:11,marginTop:4}},"Sofitel RJ · "+TODAY)

        ce("button",{style:S.btnS,onClick:()=>setView("analysis")},"✦ Análise IA"),

      groups.map(g=>ce("button",{key:g.id,onClick:()=>setCurrentGroupId(g.id),style:{padding:"5px 14px",borderRadius:20,border:`1px solid ${currentGroupId===g.id?g.color:"#EDEBE6"}`,background:currentGroupId===g.id?g.color+"22":"#fff",fontSize:11,fontWeight:600,color:currentGroupId===g.id?g.color:"#8C8980"}},g.name))
    ),
    ce("div",{style:S.g4},
      [{label:"Avanço Médio",value:avgPct+"%",sub:"média por "+grp?.envName?.toLowerCase(),color:grp?.color||"#9BB5C8",bg:"#F0F4F8"},
       {label:(grp?.envName||"Ambientes")+" Completos",value:String(totals.doneUnits),sub:"de "+totals.totalUnits+" total",color:"#7AAE90",bg:"#F0F7F3"},
       {label:"Ritmo Diário",value:dailyPace+"%",sub:"média de avanço/dia",color:"#C4B89A",bg:"#FAF8F3"},
       {label:"Andares em Risco",value:String(atRisk),sub:"abaixo do planejado",color:"#C4A882",bg:"#FAF6F0"},
      ].map((kpi,i)=>ce("div",{key:i,style:{...S.card,background:kpi.bg,borderTop:`3px solid ${kpi.color}`}},
        ce("div",{style:{fontSize:9,color:"#B8B5AD",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:6}},kpi.label),
        ce("div",{style:{fontSize:26,fontWeight:700,color:kpi.color,lineHeight:1,marginBottom:4}},kpi.value),

      ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}},

          const s=floorStats[fl];

          const color=s.variance>=0?"#7AAE90":s.variance>-10?"#C4A882":"#C48282";

          return ce("div",{key:fl,style:{borderRadius:10,padding:"10px 12px",background:bg,borderLeft:`3px solid ${color}`}},

// ══════════════ ANALYSIS VIEW ══════════════
function AnalysisView({groups,currentGroupId,companies,schedules,updates,aiInsights,isLoadingAI,onRunAI}){
  const grp=groups.find(g=>g.id===currentGroupId)||groups[0];
  const insight=typeof aiInsights[grp?.id]==="string"?aiInsights[grp?.id]:"";
  const grpUpd=updates[grp?.id]||[];
  const causeStats={};
  grpUpd.filter(u=>!u.hitTarget&&u.cause).forEach(u=>{causeStats[u.cause]=(causeStats[u.cause]||0)+1;});
  const topCauses=Object.entries(causeStats).sort((a,b)=>b[1]-a[1]);
  const total=Object.values(causeStats).reduce((a,b)=>a+b,0);
  const totalGap=grpUpd.filter(u=>!u.hitTarget).reduce((s,u)=>s+((u.targetPct||0)-(u.actualPct||0)),0);
  const daysWithGap=grpUpd.filter(u=>!u.hitTarget).length;
  const progress=useMemo(()=>computeProgress(updates,schedules,currentGroupId),[updates,schedules,currentGroupId]);

  return ce("div",null,
    ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
      ce("div",null,
        ce("div",{style:{fontSize:18,fontWeight:700,color:"#1C1B18"}},"Análise Inteligente — "+grp?.name),
        ce("p",{style:{fontSize:11,color:"#B8B5AD",marginTop:4}},"Relatório executivo para apresentação ao CEO")
      ),
      ce("button",{style:S.btnP,onClick:()=>onRunAI(grp?.id),disabled:isLoadingAI},isLoadingAI?"Analisando...":"✦ Gerar Análise IA")
    ),
    ce("div",{style:{...S.g3,marginBottom:14}},
      ce("div",{style:S.card},
        ce("p",{style:S.h2},"Resumo de Atrasos"),
        ce("div",{style:{marginBottom:10}},
          ce("div",{style:{fontSize:9,color:"#B8B5AD",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:4}},"Total de % perdido"),
          ce("div",{style:{fontSize:26,fontWeight:700,color:"#C48282"}}),totalGap+"%",
          ce("div",{style:{fontSize:10,color:"#B8B5AD"}}),daysWithGap+" dias com meta não atingida"
        ),
        ce("div",null,
          ce("div",{style:{fontSize:9,color:"#B8B5AD",fontWeight:700,textTransform:"uppercase",letterSpacing:"1px",marginBottom:4}},"Ambientes completos"),
          ce("div",{style:{fontSize:26,fontWeight:700,color:"#7AAE90"}}),progress.totals.doneUnits+"/"+progress.totals.totalUnits,
          ce("div",{style:{fontSize:10,color:"#B8B5AD"}},"no grupo "+grp?.name)
        )
      ),
      ce("div",{style:{...S.card,gridColumn:"span 2"}},
        ce("p",{style:S.h2},"Principais Causas de Atraso"),
        topCauses.length===0?ce("div",{style:{padding:"20px 0",textAlign:"center"}},
          ce("div",{style:{fontSize:26,marginBottom:8}},"🟢"),
          ce("div",{style:{fontWeight:700,color:"#7AAE90",fontSize:13}},"Nenhum atraso registrado"),
          ce("div",{style:{fontSize:11,color:"#B8B5AD",marginTop:4}},"Todas as metas foram atingidas!")
        ):topCauses.map(([cause,count])=>{
          const p2=total>0?(count/total)*100:0;
          const color=p2>40?"#C48282":p2>20?"#C4A882":"#B8B5AD";
          return ce("div",{key:cause,style:{marginBottom:12}},
            ce("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11}},
              ce("span",{style:{fontWeight:600,color:"#6C6960"}},cause),
              ce("span",{style:{fontWeight:700,color}},count+"x · "+p2.toFixed(0)+"%")
            ),
            ce("div",{style:{background:"#F5F4F1",borderRadius:4,height:6}},
              ce("div",{style:{width:p2+"%",background:color,height:6,borderRadius:4}})
            )
          );
        })
      )
    ),
    ce("div",{style:{...S.card,background:"#FAFAF9"}},
      ce("p",{style:S.h2},"✦ Análise & Recomendações IA"),
      isLoadingAI?ce("div",{style:{padding:"40px 0",textAlign:"center",color:"#B8B5AD"}},
        ce("div",{style:{fontSize:13,fontWeight:600}},"Analisando dados da obra...")
      ):insight?ce("div",{style:{fontSize:12,lineHeight:1.9,whiteSpace:"pre-line",color:"#6C6960"}},insight)
      :ce("div",{style:{padding:"40px 0",textAlign:"center"}},
        ce("div",{style:{fontSize:13,color:"#B8B5AD",marginBottom:16}},"Clique em 'Gerar Análise IA' para recomendações executivas"),
        ce("button",{style:S.btnP,onClick:()=>onRunAI(grp?.id)},"✦ Gerar Análise")
      )
    )
  );
}

            ce("label",{style:S.lbl},"Andares Atribuídos"),
            ce("div",{style:{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}},
              FLOORS.map(f=>ce("button",{key:f,onClick:()=>{const cur=t.assignedFloors||[];const nf=cur.includes(f)?cur.filter(x=>x!==f):[...cur,f].sort((a,b)=>a-b);setCompanies(p=>p.map(c=>c.id===co.id?{...c,teams:c.teams.map(tm=>tm.id===t.id?{...tm,assignedFloors:nf}:tm)}:c));},style:{padding:"3px 9px",borderRadius:5,border:"none",fontSize:11,fontWeight:700,background:(t.assignedFloors||[]).includes(f)?co.color:"#E8E5DF",color:(t.assignedFloors||[]).includes(f)?"#fff":"#8C8980"}},f+"°"))
            )
          )
        ))
      ))
    )
  );
}

// ══════════════ MAIN APP ══════════════
function App(){
  const [view,setView]=useState("dashboard");
  const [groups,setGroups]=useState(INIT_GROUPS);
  const [companies,setCompanies]=useState(INIT_COMPANIES);
  const [schedules,setSchedules]=useState(()=>{const s={};INIT_GROUPS.forEach(g=>{s[g.id]=genSched();});return s;});
  const [updates,setUpdates]=useState({});
  const [aiInsights,setAiInsights]=useState({});
  const [currentGroupId,setCurrentGroupId]=useState(INIT_GROUPS[0].id);
  const [isLoadingAI,setIsLoadingAI]=useState(false);
  const [connected,setConnected]=useState(false);
  const [toast,setToast]=useState(null);

  useEffect(()=>{
    REF.on("value",snap=>{
      const d=snap.val();
      if(!d){
        const init={groups:INIT_GROUPS,companies:INIT_COMPANIES,schedules:{},updates:{},aiInsights:{}};
        INIT_GROUPS.forEach(g=>{init.schedules[g.id]=genSched();});
        REF.set(init);
      } else {
        if(d.groups) setGroups(Array.isArray(d.groups)?d.groups:Object.values(d.groups));
        if(d.companies) setCompanies(Array.isArray(d.companies)?d.companies:Object.values(d.companies));
        if(d.schedules) setSchedules(d.schedules);
        if(d.updates){const upd={};Object.entries(d.updates).forEach(([gid,vals])=>{upd[gid]=Object.values(vals||{}).sort((a,b)=>(a.date||"")>(b.date||"")?1:-1);});setUpdates(upd);}
        if(d.aiInsights){const ai={};Object.entries(d.aiInsights).forEach(([gid,val])=>{ai[gid]=typeof val==="string"?val:"";});setAiInsights(ai);}
      }
      setConnected(true);
      const splash=document.getElementById("splash");
      if(splash){splash.classList.add("hide");setTimeout(()=>splash.remove(),500);}
    },err=>{console.error(err);setConnected(false);});
    return ()=>REF.off();
  },[]);

  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);},[]);
  const onSave=useCallback(async(g,c,sc)=>{await Promise.all([REF.child("groups").set(g),REF.child("companies").set(c),REF.child("schedules").set(sc)]);},[]);
  const onPushUpdate=useCallback(async(groupId,update)=>{await REF.child("updates").child(groupId).push(update);},[]);

  const onRunAI=useCallback(async(groupId)=>{
    setIsLoadingAI(true);
    const grp=groups.find(g=>g.id===groupId);
    const sched=schedules[groupId]||{};
    const grpUpd=updates[groupId]||[];
    const progress=computeProgress(updates,schedules,groupId);
    const totalGap=grpUpd.filter(u=>!u.hitTarget).reduce((s,u)=>s+((u.targetPct||0)-(u.actualPct||0)),0);
    const daysWithGap=grpUpd.filter(u=>!u.hitTarget).length;
    const causeStats={};
    grpUpd.filter(u=>!u.hitTarget&&u.cause).forEach(u=>{causeStats[u.cause]=(causeStats[u.cause]||0)+1;});
    const topCauses=Object.entries(causeStats).sort((a,b)=>b[1]-a[1]).slice(0,3);
    const prompt=`Você é consultor sênior de gestão de obras hoteleiras de alto padrão. Analise os dados abaixo e forneça uma análise executiva precisa e acionável.

OBRA: Hotel Sofitel RJ | GRUPO: ${grp?.name} | DATA: ${TODAY}
AMBIENTE: ${grp?.envName} | ANDARES: 5° ao 20°

RESUMO DE PROGRESSO:
• Total de ${grp?.envName}s: ${progress.totals.totalUnits}
• Completos: ${progress.totals.doneUnits} (${progress.totals.totalUnits>0?Math.round(progress.totals.doneUnits/progress.totals.totalUnits*100):0}%)
• Avanço médio: ${progress.totals.totalUnits>0?Math.round(progress.totals.totalPct/progress.totals.totalUnits):0}%

ATRASOS ACUMULADOS:
• Total de % perdido: ${totalGap}%
• Dias com meta não atingida: ${daysWithGap}
• Principais causas: ${topCauses.map(([c,n])=>`${c} (${n}x)`).join(", ")||"Nenhuma"}

PROGRESSO POR ANDAR:
${FLOORS.map(f=>{const s=progress.floorStats[f];return `• ${f}°: real ${s.actualPct.toFixed(0)}% vs plan ${s.plannedPct.toFixed(0)}% (var ${s.variance>0?"+":""}${s.variance.toFixed(0)}%) | ${s.doneUnits}/${s.count} completos`;}).join("\n")}

ÚLTIMOS 10 REGISTROS:
${grpUpd.slice(-10).map(u=>`${u.date}|${u.floor}°|${grp?.envName}${u.unit}|Meta:${u.targetPct}%|Real:${u.actualPct}%|${u.hitTarget?"✓":"✗"}${u.cause?"|"+u.cause:""}`).join("\n")||"Nenhum ainda"}

Forneça análise executiva com:
1. 🔴🟡🟢 STATUS GERAL — avaliação objetiva (2-3 frases)
2. ⚠️ ALERTAS — andares e equipes críticos
3. 📈 TENDÊNCIA — se mantiver o ritmo atual, qual a nova data de conclusão vs prazo original?
4. ✅ AÇÕES IMEDIATAS — o que o gerente deve fazer hoje/amanhã (bullets práticos)
5. 🔄 RECOMENDAÇÃO — para recuperar o atraso de ${totalGap}%: adicionar X pessoas OU estender Y horas/dia? Calcule o impacto de cada opção.
6. 🎯 META DIÁRIA — % mínimo por ${grp?.envName?.toLowerCase()} por equipe para terminar no prazo

Direto, executivo, em português. Para o CEO.`;
    try{
      const res=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
      const data=await res.json();
      const text=data.content?.find(b=>b.type==="text")?.text||data.error||"Erro ao gerar análise.";
      setAiInsights(p=>({...p,[groupId]:text}));
      await REF.child("aiInsights").child(groupId).set(text);
    }catch(e){setAiInsights(p=>({...p,[groupId]:"⚠ Erro ao conectar com a IA."}));}
    setIsLoadingAI(false);
  },[groups,schedules,updates]);

  const curGrp=groups.find(g=>g.id===currentGroupId);
  const NAV=[{id:"dashboard",icon:"◈",label:"Dashboard"},{id:"config",icon:"⚙",label:"Configurações"},{id:"update",icon:"◎",label:"Atualização"},{id:"analysis",icon:"✦",label:"Análise IA"}];

  return ce("div",{style:{display:"flex",height:"100vh",overflow:"hidden",fontFamily:"'DM Sans',system-ui,sans-serif",background:"#F5F4F1"}},
    ce("nav",{style:{width:210,background:"#fff",display:"flex",flexDirection:"column",flexShrink:0,borderRight:"1px solid #EDEBE6"}},
      ce("div",{style:{padding:"18px 16px 14px",borderBottom:"1px solid #EDEBE6"}},
        ce("div",{style:{fontWeight:700,fontSize:10,letterSpacing:"2.5px",color:"#1C1B18"}},"SOFITEL RJ"),
        ce("div",{style:{fontSize:10,color:"#B8B5AD",marginTop:3,display:"flex",alignItems:"center"}},
          ce("span",{style:{width:6,height:6,borderRadius:"50%",background:connected?"#A8C4B0":"#C48282",display:"inline-block",marginRight:5}}),
          connected?"Online":"Sem conexão"
        )
      ),
      ce("div",{style:{flex:1,overflow:"auto"}},
        ce("div",{style:{padding:"14px 0 4px"}},
          ce("div",{style:{fontSize:9,fontWeight:700,color:"#C4C1BA",letterSpacing:"1.2px",textTransform:"uppercase",padding:"0 16px",marginBottom:4}},"Ferramentas"),
          NAV.map(n=>ce("div",{key:n.id,onClick:()=>setView(n.id),style:{display:"flex",alignItems:"center",gap:9,padding:"9px 16px",cursor:"pointer",borderLeft:view===n.id?"2px solid "+(curGrp?.color||"#9BB5C8"):"2px solid transparent",background:view===n.id?"#F5F4F1":"transparent",color:view===n.id?"#1C1B18":"#8C8980",fontSize:12,fontWeight:view===n.id?700:500,marginBottom:2}},
            ce("span",{style:{fontSize:13}},n.icon)," ",n.label
          ))
        ),
        ce("div",{style:{padding:"14px 0 4px",borderTop:"1px solid #F5F4F1"}},
          ce("div",{style:{fontSize:9,fontWeight:700,color:"#C4C1BA",letterSpacing:"1.2px",textTransform:"uppercase",padding:"0 16px",marginBottom:4}},"Grupos de Serviço"),
          groups.map(g=>ce("div",{key:g.id,onClick:()=>{setCurrentGroupId(g.id);setView("dashboard");},style:{display:"flex",alignItems:"center",gap:9,padding:"9px 16px",cursor:"pointer",borderLeft:currentGroupId===g.id&&view==="dashboard"?"2px solid "+g.color:"2px solid transparent",background:currentGroupId===g.id&&view==="dashboard"?"#F5F4F1":"transparent",color:currentGroupId===g.id&&view==="dashboard"?"#1C1B18":"#8C8980",fontSize:12,fontWeight:currentGroupId===g.id&&view==="dashboard"?700:500,marginBottom:2}},
            ce("div",{style:{width:8,height:8,borderRadius:"50%",background:g.color,flexShrink:0}}),
            ce("span",{style:{flex:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},g.name)
          ))
        )
      ),
      ce("div",{style:{padding:"12px 16px",borderTop:"1px solid #EDEBE6"}},
        ce("div",{style:{fontSize:9,color:"#C4C1BA",textTransform:"uppercase",letterSpacing:"1px",marginBottom:3}},"Grupo atual"),
        ce("div",{style:{fontSize:13,fontWeight:700,color:curGrp?.color||"#9BB5C8"}},curGrp?.name||"—"),
        ce("div",{style:{fontSize:10,color:"#B8B5AD",marginTop:2}},curGrp?.envName||"—")
      )
    ),
    ce("main",{style:{flex:1,overflow:"auto",padding:24,background:"#F5F4F1"}},
      !connected&&ce("div",{style:{background:"#FBF0F0",border:"1px solid #E8C4C4",borderRadius:8,padding:"10px 16px",marginBottom:16,fontSize:12,color:"#C48282",fontWeight:600}},"🔴 Sem conexão com Firebase"),
      view==="dashboard"&&ce(DashboardView,{groups,currentGroupId,setCurrentGroupId,updates,schedules,companies,setView,aiInsights}),
      view==="config"&&ce(ConfigView,{groups,setGroups,companies,setCompanies,schedules,setSchedules,onSave,showToast}),
      view==="update"&&ce(UpdateView,{groups,currentGroupId,setCurrentGroupId,updates,onPushUpdate,companies,schedules,showToast}),
      view==="analysis"&&ce(AnalysisView,{groups,currentGroupId,companies,schedules,updates,aiInsights,isLoadingAI,onRunAI})
    ),
    toast&&ce("div",{style:{position:"fixed",bottom:20,right:20,padding:"11px 20px",borderRadius:9,background:"#1C1B18",color:"#fff",fontSize:12,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.15)",zIndex:9999,borderLeft:"3px solid #A8C4B0"}},toast)
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(ce(App));
</script>
</body>
</html>
